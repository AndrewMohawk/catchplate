name: Fixed ordinary source-revision migration evidence

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Derive candidate public pins, or test separately reviewed committed pins
        required: true
        type: choice
        options: [derive, test]

permissions:
  contents: read

jobs:
  fixed-transition:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TEST_IMAGE: python@sha256:78387bc3881b8273120a12ebe6c1ab22b018ccc2c9adf565ae1ac9b536e184ea
      OLD_COMMIT: c11e75982ceeec516887c3db65a9d88eabf819a9
      TARGET_COMMIT: 1052d0e8ae565956ca8d39df0859f2017f8c107b
      PHASE: ${{ inputs.phase }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          path: tools
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: c11e75982ceeec516887c3db65a9d88eabf819a9
          path: previous
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: 1052d0e8ae565956ca8d39df0859f2017f8c107b
          path: target
      - name: Verify fixed source inputs and provision locked public dependencies
        shell: bash
        run: |
          set -euo pipefail
          case "$PHASE" in derive|test) ;; *) exit 2 ;; esac
          test "$(git -C previous rev-parse HEAD)" = "$OLD_COMMIT"
          test "$(git -C target rev-parse HEAD)" = "$TARGET_COMMIT"
          test "$(git -C tools rev-parse HEAD)" = "$GITHUB_SHA"
          git -C previous diff --exit-code HEAD
          git -C target diff --exit-code HEAD
          git -C tools diff --exit-code HEAD
          cmp previous/requirements.lock target/requirements.lock
          cmp previous/examples/managed-client/requirements.lock target/examples/managed-client/requirements.lock
          mkdir -m 755 "$RUNNER_TEMP/migration-deps"
          mkdir -m 700 "$RUNNER_TEMP/migration-results"
          (cd tools && sha256sum scripts/migrate_operator_authority_source_revision.py scripts/derive_operator_authority_source_revision.py scripts/test_operator_authority_source_revision_migration.py scripts/operator_authority_source_revision_migration_pins.json) > "$RUNNER_TEMP/migration-results/tools.before.sha256"
          sha256sum target/requirements.lock target/examples/managed-client/requirements.lock > "$RUNNER_TEMP/migration-results/locks.sha256"
          printf '{"toolsCommit":"%s","oldCommit":"%s","targetCommit":"%s","phase":"%s","liveStateMounted":false}\n' "$GITHUB_SHA" "$OLD_COMMIT" "$TARGET_COMMIT" "$PHASE" > "$RUNNER_TEMP/migration-results/selection.json"
          timeout --kill-after=10s 180s docker pull "$TEST_IMAGE"
          name="source-revision-deps-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'timeout 20s docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          timeout --kill-after=10s 300s docker run --rm --name "$name" \
            --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges \
            --memory 2g --memory-swap 2g --cpus 2 --pids-limit 128 --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m,mode=1777 \
            --mount "type=bind,src=$GITHUB_WORKSPACE/target/requirements.lock,dst=/requirements.lock,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/target/examples/managed-client/requirements.lock,dst=/managed.lock,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/migration-deps,dst=/deps" \
            --env HOME=/tmp "$TEST_IMAGE" python -m pip install --isolated --disable-pip-version-check \
            --no-cache-dir --require-hashes --only-binary=:all: --index-url https://pypi.org/simple \
            --target /deps -r /requirements.lock -r /managed.lock
      - name: One-shot offline fixed derivation or reviewed-pin tests
        shell: bash
        run: |
          set -euo pipefail
          name="source-revision-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          stage=not_started
          finish() {
            local code="$?"
            printf '{"schema":"serverware.operatorSourceRevisionPhase/v1","phase":"%s","stage":"%s","exitCode":%d,"runAttempt":%d}\n' "$PHASE" "$stage" "$code" "$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/migration-results/phase-status.json"
            timeout 20s docker rm -f "$name" >/dev/null 2>&1 || true
            exit "$code"
          }
          trap finish EXIT
          run_offline() {
            local source_side="$1" deadline="$2" script="$3"
            shift 3
            timeout --kill-after=10s "$deadline" docker run --pull never --rm --init --name "$name" --network none \
              --user "$(id -u):$(id -g)" --read-only --cap-drop ALL --security-opt no-new-privileges \
              --memory 1g --memory-swap 1g --cpus 1 --pids-limit 96 \
              --tmpfs /tmp:rw,nosuid,nodev,size=512m,mode=1777 \
              --mount "type=bind,src=$GITHUB_WORKSPACE/$source_side,dst=/app,readonly" \
              --mount "type=bind,src=$GITHUB_WORKSPACE/previous,dst=/previous-app,readonly" \
              --mount "type=bind,src=$RUNNER_TEMP/migration-deps,dst=/deps,readonly" \
              --mount "type=bind,src=$RUNNER_TEMP/migration-results,dst=/evidence,readonly" \
              --mount "type=bind,src=$GITHUB_WORKSPACE/tools/scripts/migrate_operator_authority_source_revision.py,dst=/migration-tools/migrate_operator_authority_source_revision.py,readonly" \
              --mount "type=bind,src=$GITHUB_WORKSPACE/tools/scripts/derive_operator_authority_source_revision.py,dst=/migration-tools/derive_operator_authority_source_revision.py,readonly" \
              --mount "type=bind,src=$GITHUB_WORKSPACE/tools/scripts/test_operator_authority_source_revision_migration.py,dst=/migration-tools/test_operator_authority_source_revision_migration.py,readonly" \
              --mount "type=bind,src=$GITHUB_WORKSPACE/tools/scripts/operator_authority_source_revision_migration_pins.json,dst=/migration-tools/operator_authority_source_revision_migration_pins.json,readonly" \
              --workdir /app --env PYTHONDONTWRITEBYTECODE=1 --env PYTHONPATH=/migration-tools:/app/scripts:/app:/deps \
              --entrypoint /usr/local/bin/python "$TEST_IMAGE" -B "/migration-tools/$script" "$@"
          }
          case "$PHASE" in
            derive)
              stage=old_derivation
              run_offline previous 140s derive_operator_authority_source_revision.py --side old > "$RUNNER_TEMP/migration-results/old.json"
              stage=target_derivation
              run_offline target 140s derive_operator_authority_source_revision.py --side target > "$RUNNER_TEMP/migration-results/target.json"
              stage=join
              run_offline target 40s derive_operator_authority_source_revision.py --join /evidence/old.json /evidence/target.json > "$RUNNER_TEMP/migration-results/candidate-pins.json"
              ;;
            test)
              # This refuses before SQLite if the independent pins have not
              # been reviewed and committed with their exact digest.
              stage=focused_tests
              run_offline target 510s test_operator_authority_source_revision_migration.py > "$RUNNER_TEMP/migration-results/tests.json" 2> "$RUNNER_TEMP/migration-results/test.stderr"
              ;;
            *) exit 2 ;;
          esac
          stage=complete
      - name: Verify source preservation even after a failed phase
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          (cd tools && sha256sum --check "$RUNNER_TEMP/migration-results/tools.before.sha256")
          git -C previous diff --exit-code HEAD
          git -C target diff --exit-code HEAD
          git -C tools diff --exit-code HEAD
          printf '{"sourcePreservation":true}\n' > "$RUNNER_TEMP/migration-results/preservation.json"
      - name: Retain public derivation evidence (never databases or private fixture files)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ordinary-source-revision-${{ inputs.phase }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/migration-results/*.json
            ${{ runner.temp }}/migration-results/*.sha256
          if-no-files-found: warn
          retention-days: 14
