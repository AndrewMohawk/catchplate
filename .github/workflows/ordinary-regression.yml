name: Ordinary offline regression

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ordinary-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  components:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      # Existing fixture runtime, not an application image or a native/pilot lane.
      TEST_IMAGE: python@sha256:78387bc3881b8273120a12ebe6c1ab22b018ccc2c9adf565ae1ac9b536e184ea
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '25.5.0'
      - name: Provision locked dependencies (networked setup, not offline acceptance)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/ordinary-deps" "$RUNNER_TEMP/ordinary-results"
          timeout --kill-after=10s 180s docker pull "$TEST_IMAGE"
          name="ordinary-dependencies-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          timeout --kill-after=10s 300s docker run --rm --name "$name" \
            --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges \
            --memory 2g --memory-swap 2g --cpus 2 --pids-limit 128 --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m,mode=1777 \
            --mount "type=bind,src=$GITHUB_WORKSPACE/requirements.lock,dst=/requirements.lock,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/examples/managed-client/requirements.lock,dst=/managed-client-requirements.lock,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/ordinary-deps,dst=/deps" \
            --env HOME=/tmp "$TEST_IMAGE" python -m pip install --isolated --disable-pip-version-check \
            --no-cache-dir --require-hashes --only-binary=:all: --index-url https://pypi.org/simple --target /deps \
            -r /requirements.lock -r /managed-client-requirements.lock
      - name: Offline orchestration controls and ordinary components
        shell: bash
        run: |
          set -euo pipefail
          name="ordinary-components-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          node_binary="$(realpath "$(command -v node)")"
          # Node 25's official Linux-x64 binary needs libatomic; the existing
          # pinned Python image lacks it. Borrow only this read-only ABI input.
          node_libatomic="$(ldd "$node_binary" | awk '$1 == "libatomic.so.1" {print $3}')"
          test -n "$node_libatomic"
          node_libatomic="$(realpath "$node_libatomic")"
          test -f "$node_libatomic"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          # Copied-recipe controls execute inert interpreter stubs in this
          # temporary filesystem only; source/dependencies remain read-only.
          timeout --kill-after=10s 960s docker run --rm --init --name "$name" --network none \
            --user "$(id -u):$(id -g)" --read-only --cap-drop ALL --security-opt no-new-privileges \
            --memory 2g --memory-swap 2g --cpus 2 --pids-limit 128 \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=512m,mode=1777 \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/app,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/ordinary-deps,dst=/deps,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/ordinary-results,dst=/results" \
            --mount "type=bind,src=$node_binary,dst=/tools/node,readonly" \
            --mount "type=bind,src=$node_libatomic,dst=/usr/lib/x86_64-linux-gnu/libatomic.so.1,readonly" \
            --workdir /app --env PYTHONDONTWRITEBYTECODE=1 --env PYTHONPATH=/app:/deps \
            --entrypoint /bin/sh "$TEST_IMAGE" -eu -c \
            '/tools/node --version && python -B scripts/test_run_ordinary_regression.py && python -B scripts/run_ordinary_regression.py --node /tools/node --dependency-root /deps --output /results/quick'
      - name: Retain bounded structural diagnostics (never raw test streams)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ordinary-component-results
          path: ${{ runner.temp }}/ordinary-results/**/*.json
          if-no-files-found: warn
          retention-days: 7
