name: Public proxy check

# Explicitly started checks from outside the homelab. Authenticated modes use
# only a temporary, narrowly scoped app token and a synthetic /echo destination.
# This is not real-provider or whole-project acceptance.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Boundary only, one authenticated echo, or revoked-token denial
        type: choice
        required: true
        default: boundary
        options: [boundary, positive, revoked]

permissions:
  contents: read

jobs:
  public-boundary:
    if: inputs.mode == 'boundary'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Verify public DNS, TLS and unauthenticated CONNECT denial
        shell: bash
        run: |
          set -euo pipefail
          proxy_exit=0
          observed="$(curl --disable --silent --show-error \
            --connect-timeout 10 --max-time 20 --retry 0 \
            --proxy https://catchplate-proxy.example.com:443 \
            --noproxy '' --output /dev/null \
            --write-out '%{http_connect} %{http_code} %{proxy_ssl_verify_result} %{remote_ip}' \
            https://demo-upstream:8443/echo)" || proxy_exit=$?
          read -r connect_status origin_status proxy_tls peer_ip <<< "$observed"
          test "$proxy_exit" = 56
          test "$connect_status" = 403
          test "$origin_status" = 000
          test "$proxy_tls" = 0
          test "$peer_ip" = 203.0.113.10
          jq -n --arg peer "$peer_ip" \
            '{public_dns:true,proxy_tls_verified:true,connect_status:403,
              unauthenticated_denied:true,origin_response:false,peer:$peer,
              authenticated_use_verified:false}'
      - name: Verify the console still requires sign-in
        shell: bash
        run: |
          set -euo pipefail
          observed="$(curl --disable --silent --show-error --head \
            --connect-timeout 10 --max-time 20 --retry 0 --noproxy '*' \
            --output /dev/null --write-out '%{http_code} %{redirect_url} %{ssl_verify_result}' \
            https://catchplate.example.com/)"
          read -r status destination tls <<< "$observed"
          test "$status" = 302
          test "$destination" = 'https://auth.example.com/?rd=https%3A%2F%2Fcatchplate.example.com%2F&rm=HEAD'
          test "$tls" = 0
          printf '%s\n' '{"console_tls_verified":true,"console_sign_in_required":true,"sso_completed":false}'

  scoped-client:
    if: inputs.mode == 'positive' || inputs.mode == 'revoked'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use only the scoped temporary application identity
        shell: bash
        env:
          CHECK_MODE: ${{ inputs.mode }}
          CATCHPLATE_PUBLIC_PROXY_CHECK_JSON: ${{ secrets.CATCHPLATE_PUBLIC_PROXY_CHECK_JSON }}
        run: |
          set -euo pipefail
          python3 -B scripts/check_operator_public_proxy.py "$CHECK_MODE" \
            | tee "$RUNNER_TEMP/public-proxy-result.json"
      - name: Retain only the sanitized client receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-proxy-result
          path: ${{ runner.temp }}/public-proxy-result.json
          if-no-files-found: warn
          retention-days: 7
