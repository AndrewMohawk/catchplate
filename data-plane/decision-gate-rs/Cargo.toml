[package]
name = "serverware-decision-gate"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[lib]
name = "serverware_decision_gate"
path = "src/custody_protocol.rs"

[dependencies]
base64 = "0.22"
csv = "1.3"
ed25519-dalek = { version = "2.1", features = ["pem"] }
hex = "0.4"
ipnet = "2.11"
jsonschema = { version = "0.47", default-features = false }
libc = "0.2"
rcgen = { version = "0.13.2", features = ["x509-parser"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
shlex = "1.3"
time = { version = "=0.3.47", features = ["parsing"] }
url = "2.5"
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
x509-parser = "0.16"
zeroize = { version = "1.8", features = ["serde"] }

[profile.release]
strip = "symbols"
