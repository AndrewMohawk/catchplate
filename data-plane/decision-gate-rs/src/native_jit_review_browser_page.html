<!doctype html><meta charset="utf-8"><title>Protected request review</title>
<h1>Protected request review</h1><p id="status">Waiting for the original workspace window.</p><pre id="review"></pre>
<script nonce="__NONCE__">
"use strict";
const portal=__PORTAL__, source=window.opener, status=document.getElementById("status"), view=document.getElementById("review");
let phase="ready", reviewId=null, deadline=0;
const exact=(v,n)=>v&&typeof v==="object"&&!Array.isArray(v)&&Object.keys(v).length===n.length&&n.every(k=>Object.hasOwn(v,k));
const literal=(v,n)=>typeof v==="string"&&v.length>0&&v.length<=n;
const send=v=>{if(!source)throw Error("Original workspace window is unavailable");source.postMessage(v,portal);};
async function post(path,body,maximum=512*1024){
  const remaining=deadline-performance.now();if(!(remaining>0))throw Error("Review deadline expired");
  const control=new AbortController(), timer=setTimeout(()=>control.abort(),remaining);
  let reader;
  try{
    const response=await fetch(path,{method:"POST",credentials:"same-origin",redirect:"error",signal:control.signal,headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    if(!response.ok||response.headers.get("content-type")!=="application/json")throw Error("Protected review refused or expired");
    reader=response.body.getReader();const chunks=[];let size=0;
    for(;;){if(performance.now()>=deadline)throw Error("Review deadline expired");const item=await reader.read();if(item.done)break;size+=item.value.length;if(size>maximum)throw Error("Review response bound");chunks.push(item.value);}
    const bytes=new Uint8Array(size);let offset=0;for(const chunk of chunks){bytes.set(chunk,offset);offset+=chunk.length;}
    if(performance.now()>=deadline)throw Error("Review deadline expired");return new TextDecoder("utf-8",{fatal:true}).decode(bytes);
  }finally{clearTimeout(timer);if(reader)await reader.cancel().catch(()=>{});control.abort();}
}
window.addEventListener("message",async event=>{
  if(event.source!==source||event.origin!==portal)return;
  const m=event.data;
  try{
    if(phase==="ready"&&exact(m,["type","approvalRequestId"])&&m.type==="catchplate.native-jit-review.start"){
      phase="challenge-attempted";deadline=performance.now()+30000;
      if(!literal(m.approvalRequestId,128))throw Error("Approval identity bound");
      const result=JSON.parse(await post("/reviews/jit/challenge",{approvalRequestId:m.approvalRequestId}));
      if(!exact(result,["apiVersion","challengeOriginal"])||result.apiVersion!=="catchplate.nativeJitReviewChallengeResponse/v1")throw Error("Challenge framing refused");
      const challenge=JSON.parse(result.challengeOriginal).statement;reviewId=challenge.reviewId;
      if(typeof reviewId!=="string")throw Error("Challenge identity absent");
      const remaining=Math.floor(challenge.expiresAtEpochNs/1e6)-Date.now()-1;
      if(!(remaining>0))throw Error("Challenge expired");deadline=Math.min(deadline,performance.now()+remaining);
      phase="authorization";status.textContent="Waiting for current reviewer authorization.";
      send({type:"catchplate.native-jit-review.challenge",challengeOriginal:result.challengeOriginal});
    }else if(phase==="authorization"&&exact(m,["type","authorizationOriginal","parentOriginal","childOriginal","pairOriginal","proofOriginal"])&&m.type==="catchplate.native-jit-review.authorized"){
      phase="prepare-attempted";
      if(!literal(m.authorizationOriginal,64*1024)||!literal(m.parentOriginal,512*1024)||!literal(m.childOriginal,512*1024)||!literal(m.pairOriginal,1024*1024)||!literal(m.proofOriginal,128*1024))throw Error("Authorization original bound");
      const result=JSON.parse(await post("/reviews/jit/prepare",{reviewId,authorizationOriginal:m.authorizationOriginal,parentOriginal:m.parentOriginal,childOriginal:m.childOriginal,pairOriginal:m.pairOriginal,proofOriginal:m.proofOriginal}));
      if(!exact(result,["apiVersion","preparationOriginal"])||result.apiVersion!=="catchplate.nativeJitReviewPreparationResponse/v1")throw Error("Preparation framing refused");
      phase="commit";status.textContent="Private review is withheld until its receipt commits.";
      send({type:"catchplate.native-jit-review.prepared",preparationOriginal:result.preparationOriginal});
    }else if(phase==="commit"&&exact(m,["type","commitAckOriginal"])&&m.type==="catchplate.native-jit-review.committed"){
      phase="disclosure-attempted";
      if(!literal(m.commitAckOriginal,64*1024))throw Error("Commit acknowledgment bound");
      const text=await post("/reviews/jit/disclose",{reviewId,commitAckOriginal:m.commitAckOriginal},256*1024);
      view.textContent=text;status.textContent="Protected review opened. This does not approve or run the request.";
      phase="complete";send({type:"catchplate.native-jit-review.disclosed",reviewId});
    }
  }catch(_){phase="uncertain";status.textContent="Review failed, expired, or has an uncertain outcome. It will not retry.";}
});
if(source)send({type:"catchplate.native-jit-review.ready"});
</script>
