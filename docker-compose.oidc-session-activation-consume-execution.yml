# Optional source overlay for explicit v8 consume-execution caller custody.
# Inputs are independently provisioned; this creates no key, socket or service.
# The signed bootstrap stays in the existing read-only authority-trust mount.
# Nested v1 configures authorizer.sock only. Explicit nested v2 additionally
# configures reserver.sock and sql.sock; nested v3 additionally configures
# completion.sock in the same fixed directory. Explicit nested v4 selects the
# release-hints response on that endpoint. This mount neither selects a profile
# nor admits a listener or grants dispatch authority.
services:
  catchplate:
    volumes:
      - type: bind
        source: ${CATCHPLATE_OIDC_SESSION_ACTIVATION_CONSUME_CALLER_KEY_FILE:?set root-owned mode 0400 consume caller key file}
        target: /run/secrets/catchplate-oidc-session-activation-consume-caller-key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CATCHPLATE_OIDC_SESSION_ACTIVATION_CONSUME_EXECUTION_SOCKET_DIR:?set preprovisioned consume execution socket directory}
        target: /run/catchplate/oidc-session-activation-delivery-execution
        read_only: true
        bind:
          create_host_path: false
