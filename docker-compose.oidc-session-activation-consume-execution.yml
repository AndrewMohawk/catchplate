# Optional source overlay for explicit v8 consume-execution caller custody.
# Inputs are independently provisioned; this creates no key, socket or service.
# The signed bootstrap stays in the existing read-only authority-trust mount.
# Nested v1 configures authorizer.sock only. Explicit nested v2 additionally
# configures reserver.sock and sql.sock in the same fixed directory; this mount
# neither selects a profile nor admits a listener or grants dispatch authority.
services:
  serverware:
    volumes:
      - type: bind
        source: ${SERVERWARE_OIDC_SESSION_ACTIVATION_CONSUME_CALLER_KEY_FILE:?set root-owned mode 0400 consume caller key file}
        target: /run/secrets/serverware-oidc-session-activation-consume-caller-key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SERVERWARE_OIDC_SESSION_ACTIVATION_CONSUME_EXECUTION_SOCKET_DIR:?set preprovisioned consume execution socket directory}
        target: /run/serverware/oidc-session-activation-delivery-execution
        read_only: true
        bind:
          create_host_path: false
