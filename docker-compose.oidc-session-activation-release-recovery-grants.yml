# Optional public-only socket for explicit parent/v15 recovery acquisition.
# This source recipe does not create an issuer, signing key or release worker.
# A mounted socket is not actor permission, fresh recovery authority or readiness.
services:
  serverware:
    volumes:
      - type: bind
        source: ${SERVERWARE_OIDC_SESSION_ACTIVATION_RELEASE_RECOVERY_GRANTS_SOCKET:?set preprovisioned recovery-grant issuer socket}
        target: /run/serverware/oidc-session-activation-token-release/recovery-grants.sock
        read_only: true
        bind:
          create_host_path: false
