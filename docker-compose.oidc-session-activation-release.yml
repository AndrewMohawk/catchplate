# Optional production source overlay for a v5 cold release client or v11 handoff.
# Provision the finite release worker and searchable socket directory separately.
# This read-only bind grants no root authority, key custody or public endpoint.
# The signed parent bootstrap uses the existing authority-trust directory mount.
services:
  catchplate:
    volumes:
      - type: bind
        source: ${CATCHPLATE_OIDC_SESSION_ACTIVATION_RELEASE_SOCKET_DIR:?set preprovisioned private release socket directory}
        target: /run/catchplate/oidc-session-activation-token-release
        read_only: true
        bind:
          create_host_path: false
