      CATCHPLATE_AUDIT_ANCHOR_TIMEOUT_SECONDS: ${CATCHPLATE_AUDIT_ANCHOR_TIMEOUT_SECONDS:-10}
      CATCHPLATE_DATA_PLANE_LEASE_RECIPIENT_ATTESTATION_REQUIRED: "1"
      CATCHPLATE_DATA_PLANE_LEASE_RECIPIENT_VERIFY_COMMAND: ${CATCHPLATE_DATA_PLANE_LEASE_RECIPIENT_VERIFY_COMMAND:?set recipient attestation verifier command}
