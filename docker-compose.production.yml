      SERVERWARE_RESPONSE_OBSERVATION_V2_PROOF_PINS_ROOT_SHA256: ${SERVERWARE_RESPONSE_OBSERVATION_V2_PROOF_PINS_ROOT_SHA256:?set pinned v2 proof-policy root SHA-256}
      SERVERWARE_POLICY_SHADOW_TRUST_MANIFEST: /run/serverware/policy-shadow/generation/trust-manifest.json
      SERVERWARE_POLICY_SHADOW_TRUST_MANIFEST_SHA256: ${SERVERWARE_POLICY_SHADOW_TRUST_MANIFEST_SHA256:?set independently approved policy-shadow trust-manifest SHA-256}
      SERVERWARE_POLICY_SHADOW_RUNTIME_ATTESTATION_VERIFY_COMMAND: /opt/serverware/bin/policy-shadow-runtime-attestation-verify
      SERVERWARE_POLICY_SHADOW_RUNTIME_ATTESTATION_VERIFIER_SHA256: ${SERVERWARE_POLICY_SHADOW_RUNTIME_ATTESTATION_VERIFIER_SHA256:?set hardware runtime-attestation verifier executable SHA-256}
      SERVERWARE_POLICY_SHADOW_PUBLICATION_HANDOFF_COMMAND: /opt/serverware/bin/policy-shadow-publication-handoff
      SERVERWARE_POLICY_SHADOW_PUBLICATION_HANDOFF_SHA256: ${SERVERWARE_POLICY_SHADOW_PUBLICATION_HANDOFF_SHA256:?set independently approved publication-handoff executable SHA-256}
      SERVERWARE_POLICY_SHADOW_CUSTODY_CONFIG: /run/serverware/policy-shadow/generation/custody-config.json
      SERVERWARE_POLICY_SHADOW_STARTUP_GENERATION: ${SERVERWARE_POLICY_SHADOW_STARTUP_GENERATION:-}
      SERVERWARE_POLICY_SHADOW_STARTUP_GENERATION_SHA256: ${SERVERWARE_POLICY_SHADOW_STARTUP_GENERATION_SHA256:-}
      SERVERWARE_DATA_PLANE_INSTANCE_ID: ${SERVERWARE_DATA_PLANE_INSTANCE_ID:?set data-plane SPIFFE instance ID}
      SERVERWARE_MITM_CA_CERT: /run/serverware/gate/decision-gate-ca-cert.pem
      SERVERWARE_MITM_CA_KEY: /run/serverware/gate/decision-gate-ca-key.pem
      SERVERWARE_CONTROL_PLANE_AUDIT_URL: https://serverware:3000/api/data-plane/audit
      SERVERWARE_CONTROL_PLANE_GRANT_CONSUME_URL: https://serverware:3000/api/data-plane/grants/consume
      SERVERWARE_CONTROL_PLANE_RATE_LIMIT_CONSUME_URL: ${SERVERWARE_CONTROL_PLANE_RATE_LIMIT_CONSUME_URL:?set shared rate-limit URL}
      SERVERWARE_CONTROL_PLANE_RELEASE_AUTHORIZATION_BASE_URL: https://serverware:3000/api/data-plane/release-authorizations
      SERVERWARE_ATOMIC_RELEASE_AUTHORIZATION_ENABLED: "1"
      SERVERWARE_DATA_PLANE_CREDENTIAL_LEASE_TOKEN_FILE: /run/secrets/serverware-data-plane-credential-lease-token
      SERVERWARE_DATA_PLANE_AUDIT_TOKEN_FILE: /run/secrets/serverware-data-plane-audit-token
      SERVERWARE_DATA_PLANE_GRANT_CONSUME_TOKEN_FILE: /run/secrets/serverware-data-plane-grant-consume-token
      SERVERWARE_DATA_PLANE_RATE_LIMIT_CONSUME_TOKEN_FILE: /run/secrets/serverware-data-plane-rate-limit-consume-token
      SERVERWARE_DATA_PLANE_RELEASE_AUTHORIZATION_TOKEN_FILE: /run/secrets/serverware-data-plane-release-authorization-token
      SERVERWARE_DATA_PLANE_MANAGEMENT_TOKEN_FILE: /run/secrets/serverware-data-plane-management-token
      SERVERWARE_DECISION_GATE_HOST: 0.0.0.0
      SERVERWARE_DECISION_GATE_PORT: "9090"
      SERVERWARE_PROXY_INGRESS_MODE: mtls
      SERVERWARE_PROXY_TLS_CERT: /run/serverware/proxy-ingress/server-cert.pem
      SERVERWARE_PROXY_TLS_KEY: /run/serverware/proxy-ingress/server-key.pem
      SERVERWARE_PROXY_CLIENT_CA_BUNDLE: /run/serverware/proxy-ingress/client-ca.pem
      SERVERWARE_DECISION_GATE_MANAGEMENT_HOST: 127.0.0.1
      SERVERWARE_DECISION_GATE_MANAGEMENT_PORT: "9091"
      SERVERWARE_RELEASE_PROVENANCE: /run/serverware/release/release-provenance.json
      SERVERWARE_IMAGE_SIGNATURES: /run/serverware/release/image-signatures.json
      SERVERWARE_RELEASE_CHANNEL: ${SERVERWARE_RELEASE_CHANNEL:?set release channel}
      SERVERWARE_POLICY_HIGH_WATER_FILE: /var/lib/serverware/policy-high-water.json
      SERVERWARE_POLICY_MIN_SEQUENCE: ${SERVERWARE_POLICY_MIN_SEQUENCE:?set signed minimum policy sequence}
      SERVERWARE_POLICY_MIN_ROLLBACK_EPOCH: ${SERVERWARE_POLICY_MIN_ROLLBACK_EPOCH:?set signed minimum policy rollback epoch}
      SERVERWARE_DECISION_GATE_PROXY_WORKERS: "16"
    volumes:
      - serverware-gate-materials:/run/serverware/gate:ro
      - serverware-gate-state:/var/lib/serverware
      - serverware-custody-socket:/run/serverware-custody:ro
      - ${SERVERWARE_POLICY_SHADOW_TRUST_MANIFEST_FILE:?set root-owned immutable policy-shadow trust manifest}:/run/serverware/policy-shadow/generation/trust-manifest.json:ro
      - ${SERVERWARE_POLICY_SHADOW_CUSTODY_CONFIG_FILE:?set root-owned immutable policy-shadow custody config}:/run/serverware/policy-shadow/generation/custody-config.json:ro
      - ${SERVERWARE_POLICY_SHADOW_STARTUP_GENERATION_FILE:-/dev/null}:/run/serverware/policy-shadow/generation/startup-generation.json:ro
      # The five policy-custody workers are systemd descriptor-only services.
      # The trusted launcher renders their configs after measuring the live
      # driver. Candidate activation stays unavailable until the target is READY.
      - ${SERVERWARE_POLICY_CUSTODY_SOCKET_DIR:?set root-owned policy-custody SOCK_SEQPACKET directory}:/run/serverware/policy-custody:ro
      - ${SERVERWARE_RESPONSE_OBSERVATION_V2_ROUTER_SOCKET_DIR:?set pre-owned custody-router socket directory}:/run/serverware-response-v2/router:ro
      # Host preflight requires cert/CA 0:0 mode 0444 and the private key
      # 0:65532 mode 0440, giving only the decision-gate primary group read access.
      - ${SERVERWARE_PROXY_TLS_CERT_FILE:?set root-owned proxy ingress certificate file}:/run/serverware/proxy-ingress/server-cert.pem:ro
      - ${SERVERWARE_PROXY_TLS_KEY_FILE:?set root-owned proxy ingress private key file}:/run/serverware/proxy-ingress/server-key.pem:ro
      - ${SERVERWARE_PROXY_CLIENT_CA_BUNDLE_FILE:?set root-owned proxy ingress client CA bundle file}:/run/serverware/proxy-ingress/client-ca.pem:ro
      - ${SERVERWARE_CONTROL_PLANE_TLS_DIR:?set control-plane TLS directory}/ca.pem:/run/serverware/tls/ca.pem:ro
      - ${SERVERWARE_ATTESTATION_HELPER_DIR:?set attestation helper directory}:/opt/serverware/bin:ro
      - ${SERVERWARE_NITRO_ROOT_CERT:?set Nitro root certificate}:/run/serverware/nitro/nitro-root.pem:ro
      - ${SERVERWARE_RESPONSE_V2_TEE_EXPECTATIONS_FILE:?set response-v2 TEE expectations file}:/run/serverware/response-v2-tee/expectations.json:ro
      - ${SERVERWARE_RESPONSE_V2_NITRO_TRUST_ROOTS_FILE:?set response-v2 Nitro trust-roots file}:/run/serverware/response-v2-tee/nitro-trust-roots.json:ro
      - ${SERVERWARE_RELEASE_PROVENANCE_FILE:?set release provenance artifact path}:/run/serverware/release/release-provenance.json:ro
      - ${SERVERWARE_IMAGE_SIGNATURES_FILE:?set image signatures artifact path}:/run/serverware/release/image-signatures.json:ro
      - ${SERVERWARE_DATA_PLANE_CREDENTIAL_LEASE_TOKEN_FILE:?set credential-lease token file}:/run/secrets/serverware-data-plane-credential-lease-token:ro
      - ${SERVERWARE_DATA_PLANE_AUDIT_TOKEN_FILE:?set audit-ingest token file}:/run/secrets/serverware-data-plane-audit-token:ro
      - ${SERVERWARE_DATA_PLANE_GRANT_CONSUME_TOKEN_FILE:?set grant-consume token file}:/run/secrets/serverware-data-plane-grant-consume-token:ro
      - ${SERVERWARE_DATA_PLANE_RATE_LIMIT_CONSUME_TOKEN_FILE:?set rate-limit-consume token file}:/run/secrets/serverware-data-plane-rate-limit-consume-token:ro
      - ${SERVERWARE_DATA_PLANE_RELEASE_AUTHORIZATION_TOKEN_FILE:?set release-authorization token file}:/run/secrets/serverware-data-plane-release-authorization-token:ro
      - ${SERVERWARE_DATA_PLANE_MANAGEMENT_TOKEN_FILE:?set Rust management token file}:/run/secrets/serverware-data-plane-management-token:ro
    devices:
      - /dev/nsm:/dev/nsm
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    depends_on:
      custody-runtime:
        condition: service_started
      response-v2-custody-router:
        condition: service_healthy
      response-v2-generation-activation:
        condition: service_completed_successfully
    restart: on-failure

volumes:
  serverware-data:
  serverware-gate-materials:
  serverware-gate-state:
  serverware-audit-anchors:
  serverware-custody-socket:
  serverware-custody-state:
  serverware-custody-trust:

networks:
  gate-control:
    internal: true
  anchor-control:
    internal: true
  authority-db:
    internal: true
  response-v2-egress:
