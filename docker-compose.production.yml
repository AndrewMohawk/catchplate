      - ${CATCHPLATE_DATA_PLANE_MANAGEMENT_TOKEN_FILE:?set Rust management token file}:/run/secrets/catchplate-data-plane-management-token:ro
      - ${CATCHPLATE_AUDIT_ANCHOR_TOKEN_FILE:?set audit-anchor token file}:/run/secrets/catchplate-audit-anchor-token:ro
      - ${CATCHPLATE_SETUP_ENROLLMENT_VERIFIER_PUBLIC_KEY:?set enrollment verifier public key}:/run/catchplate/setup-trust/enrollment-verifier.pub.pem:ro
      - ${CATCHPLATE_SETUP_HARDWARE_VERIFIER_PUBLIC_KEY:?set hardware verifier public key}:/run/catchplate/setup-trust/hardware-verifier.pub.pem:ro
