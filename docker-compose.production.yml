      CATCHPLATE_RESPONSE_PROOF_CUSTODY_SOCKET: /run/catchplate-custody/custody.sock
      CATCHPLATE_RESPONSE_PROOF_CUSTODY_EXPECTED_UID: "65531"
      CATCHPLATE_RESPONSE_PROOF_CUSTODY_STARTUP_TIMEOUT_MS: "30000"
      CATCHPLATE_RESPONSE_OBSERVATION_V2_SOCKET: /run/catchplate-response-v2/router/custody.sock
      CATCHPLATE_RESPONSE_OBSERVATION_V2_EXPECTED_UID: "65520"
      CATCHPLATE_RESPONSE_OBSERVATION_V2_STARTUP_TIMEOUT_MS: "30000"
      CATCHPLATE_RESPONSE_OBSERVATION_V2_ATTESTATION_MODE: tee-hardware
      CATCHPLATE_RESPONSE_OBSERVATION_V2_TEE_VERIFY_COMMAND: ${CATCHPLATE_RESPONSE_OBSERVATION_V2_TEE_VERIFY_COMMAND:?set external response-v2 TEE verifier command}
      CATCHPLATE_RESPONSE_V2_TEE_EXPECTATIONS_FILE: /run/catchplate/response-v2-tee/expectations.json
      CATCHPLATE_RESPONSE_V2_TEE_EXPECTATIONS_SHA256: ${CATCHPLATE_RESPONSE_V2_TEE_EXPECTATIONS_SHA256:?set independently pinned response-v2 TEE expectations SHA-256}
      CATCHPLATE_RESPONSE_V2_NITRO_TRUST_ROOTS_FILE: /run/catchplate/response-v2-tee/nitro-trust-roots.json
      CATCHPLATE_RESPONSE_V2_NITRO_TRUST_ROOTS_SHA256: ${CATCHPLATE_RESPONSE_V2_NITRO_TRUST_ROOTS_SHA256:?set independently pinned response-v2 Nitro trust-roots SHA-256}
      CATCHPLATE_RESPONSE_OBSERVATION_V2_TEE_TOPOLOGY_PROFILE: ${CATCHPLATE_RESPONSE_OBSERVATION_V2_TEE_TOPOLOGY_PROFILE:?set local-single-node-1-of-1 response-v2 TEE topology profile}
      CATCHPLATE_RESPONSE_OBSERVATION_V2_TRANSPARENCY_TRUST_PIN_JSON: ${CATCHPLATE_RESPONSE_OBSERVATION_V2_TRANSPARENCY_TRUST_PIN_JSON:?set canonical independently pinned response-v2 release-log trust JSON}
      CATCHPLATE_RESPONSE_OBSERVATION_V2_GENERATION_ID: ${CATCHPLATE_RESPONSE_OBSERVATION_V2_GENERATION_ID:?set signed response-v2 generation ID}
      CATCHPLATE_RESPONSE_OBSERVATION_V2_SOURCE_COMMIT_SHA256: ${CATCHPLATE_RESPONSE_OBSERVATION_V2_SOURCE_COMMIT_SHA256:?set release-record source commit SHA-256}
      CATCHPLATE_RESPONSE_OBSERVATION_V2_SOURCE_TREE_SHA256: ${CATCHPLATE_RESPONSE_OBSERVATION_V2_SOURCE_TREE_SHA256:?set release-record source tree SHA-256}
      CATCHPLATE_RESPONSE_OBSERVATION_V2_ROLE_KEYS_JSON: ${CATCHPLATE_RESPONSE_OBSERVATION_V2_ROLE_KEYS_JSON:?set canonical public role-key manifest JSON}
      CATCHPLATE_RESPONSE_OBSERVATION_V2_SIGNER_KEY_SHA256: ${CATCHPLATE_RESPONSE_OBSERVATION_V2_SIGNER_KEY_SHA256:?set pinned v2 response signer raw-key SHA-256}
      CATCHPLATE_RESPONSE_OBSERVATION_V2_ROLE_IDENTITY_ROOT_SHA256: ${CATCHPLATE_RESPONSE_OBSERVATION_V2_ROLE_IDENTITY_ROOT_SHA256:?set pinned v2 role-identity root SHA-256}
      CATCHPLATE_RESPONSE_OBSERVATION_V2_PROOF_PINS_ROOT_SHA256: ${CATCHPLATE_RESPONSE_OBSERVATION_V2_PROOF_PINS_ROOT_SHA256:?set pinned v2 proof-policy root SHA-256}
      CATCHPLATE_POLICY_SHADOW_TRUST_MANIFEST: /run/catchplate/policy-shadow/generation/trust-manifest.json
      CATCHPLATE_POLICY_SHADOW_TRUST_MANIFEST_SHA256: ${CATCHPLATE_POLICY_SHADOW_TRUST_MANIFEST_SHA256:?set independently approved policy-shadow trust-manifest SHA-256}
      CATCHPLATE_POLICY_SHADOW_RUNTIME_ATTESTATION_VERIFY_COMMAND: /opt/catchplate/bin/policy-shadow-runtime-attestation-verify
      CATCHPLATE_POLICY_SHADOW_RUNTIME_ATTESTATION_VERIFIER_SHA256: ${CATCHPLATE_POLICY_SHADOW_RUNTIME_ATTESTATION_VERIFIER_SHA256:?set hardware runtime-attestation verifier executable SHA-256}
      CATCHPLATE_POLICY_SHADOW_PUBLICATION_HANDOFF_COMMAND: /opt/catchplate/bin/policy-shadow-publication-handoff
      CATCHPLATE_POLICY_SHADOW_PUBLICATION_HANDOFF_SHA256: ${CATCHPLATE_POLICY_SHADOW_PUBLICATION_HANDOFF_SHA256:?set independently approved publication-handoff executable SHA-256}
      CATCHPLATE_POLICY_SHADOW_CUSTODY_CONFIG: /run/catchplate/policy-shadow/generation/custody-config.json
      CATCHPLATE_POLICY_SHADOW_STARTUP_GENERATION: ${CATCHPLATE_POLICY_SHADOW_STARTUP_GENERATION:-}
      CATCHPLATE_POLICY_SHADOW_STARTUP_GENERATION_SHA256: ${CATCHPLATE_POLICY_SHADOW_STARTUP_GENERATION_SHA256:-}
      CATCHPLATE_DATA_PLANE_INSTANCE_ID: ${CATCHPLATE_DATA_PLANE_INSTANCE_ID:?set data-plane SPIFFE instance ID}
      CATCHPLATE_MITM_CA_CERT: /run/catchplate/gate/decision-gate-ca-cert.pem
      CATCHPLATE_MITM_CA_KEY: /run/catchplate/gate/decision-gate-ca-key.pem
      CATCHPLATE_CONTROL_PLANE_AUDIT_URL: https://catchplate:3000/api/data-plane/audit
      CATCHPLATE_CONTROL_PLANE_GRANT_CONSUME_URL: https://catchplate:3000/api/data-plane/grants/consume
      CATCHPLATE_CONTROL_PLANE_RATE_LIMIT_CONSUME_URL: ${CATCHPLATE_CONTROL_PLANE_RATE_LIMIT_CONSUME_URL:?set shared rate-limit URL}
      CATCHPLATE_CONTROL_PLANE_RELEASE_AUTHORIZATION_BASE_URL: https://catchplate:3000/api/data-plane/release-authorizations
      CATCHPLATE_ATOMIC_RELEASE_AUTHORIZATION_ENABLED: "1"
      CATCHPLATE_DATA_PLANE_CREDENTIAL_LEASE_TOKEN_FILE: /run/secrets/catchplate-data-plane-credential-lease-token
      CATCHPLATE_DATA_PLANE_AUDIT_TOKEN_FILE: /run/secrets/catchplate-data-plane-audit-token
      CATCHPLATE_DATA_PLANE_GRANT_CONSUME_TOKEN_FILE: /run/secrets/catchplate-data-plane-grant-consume-token
      CATCHPLATE_DATA_PLANE_RATE_LIMIT_CONSUME_TOKEN_FILE: /run/secrets/catchplate-data-plane-rate-limit-consume-token
      CATCHPLATE_DATA_PLANE_RELEASE_AUTHORIZATION_TOKEN_FILE: /run/secrets/catchplate-data-plane-release-authorization-token
      CATCHPLATE_DATA_PLANE_MANAGEMENT_TOKEN_FILE: /run/secrets/catchplate-data-plane-management-token
      CATCHPLATE_DECISION_GATE_HOST: 0.0.0.0
      CATCHPLATE_DECISION_GATE_PORT: "9090"
      CATCHPLATE_PROXY_INGRESS_MODE: mtls
      CATCHPLATE_PROXY_TLS_CERT: /run/catchplate/proxy-ingress/server-cert.pem
      CATCHPLATE_PROXY_TLS_KEY: /run/catchplate/proxy-ingress/server-key.pem
      CATCHPLATE_PROXY_CLIENT_CA_BUNDLE: /run/catchplate/proxy-ingress/client-ca.pem
      CATCHPLATE_WORKLOAD_IDENTITY_TRUST_AUTHORIZATION: /run/catchplate/proxy-ingress/trust-authorization.json
      CATCHPLATE_WORKLOAD_IDENTITY_TRUST_AUTHORIZER_PUBLIC_KEY: /run/catchplate/proxy-ingress/trust-authorizer-public-key.pem
      CATCHPLATE_WORKLOAD_IDENTITY_TRUST_AUTHORIZER_SHA256: ${CATCHPLATE_WORKLOAD_IDENTITY_TRUST_AUTHORIZER_SHA256:?set independently approved exact trust-authorizer PEM SHA-256}
      CATCHPLATE_WORKLOAD_IDENTITY_TRUST_DEPLOYMENT_ID: ${CATCHPLATE_WORKLOAD_IDENTITY_TRUST_DEPLOYMENT_ID:?set independently selected workload trust deployment ID}
      CATCHPLATE_DECISION_GATE_MANAGEMENT_HOST: 127.0.0.1
      CATCHPLATE_DECISION_GATE_MANAGEMENT_PORT: "9091"
      CATCHPLATE_RELEASE_PROVENANCE: /run/catchplate/release/release-provenance.json
      CATCHPLATE_IMAGE_SIGNATURES: /run/catchplate/release/image-signatures.json
      CATCHPLATE_RELEASE_CHANNEL: ${CATCHPLATE_RELEASE_CHANNEL:?set release channel}
      CATCHPLATE_POLICY_HIGH_WATER_FILE: /var/lib/catchplate/policy-high-water.json
      CATCHPLATE_POLICY_MIN_SEQUENCE: ${CATCHPLATE_POLICY_MIN_SEQUENCE:?set signed minimum policy sequence}
      CATCHPLATE_POLICY_MIN_ROLLBACK_EPOCH: ${CATCHPLATE_POLICY_MIN_ROLLBACK_EPOCH:?set signed minimum policy rollback epoch}
      CATCHPLATE_DECISION_GATE_PROXY_WORKERS: "16"
    volumes:
      - catchplate-gate-materials:/run/catchplate/gate:ro
      - catchplate-gate-state:/var/lib/catchplate
      - catchplate-custody-socket:/run/catchplate-custody:ro
      - ${CATCHPLATE_POLICY_SHADOW_TRUST_MANIFEST_FILE:?set root-owned immutable policy-shadow trust manifest}:/run/catchplate/policy-shadow/generation/trust-manifest.json:ro
      - ${CATCHPLATE_POLICY_SHADOW_CUSTODY_CONFIG_FILE:?set root-owned immutable policy-shadow custody config}:/run/catchplate/policy-shadow/generation/custody-config.json:ro
      - ${CATCHPLATE_POLICY_SHADOW_STARTUP_GENERATION_FILE:-/dev/null}:/run/catchplate/policy-shadow/generation/startup-generation.json:ro
      # The five policy-custody workers are systemd descriptor-only services.
      # The trusted launcher renders their configs after measuring the live
      # driver. Candidate activation stays unavailable until the target is READY.
      - ${CATCHPLATE_POLICY_CUSTODY_SOCKET_DIR:?set root-owned policy-custody SOCK_SEQPACKET directory}:/run/catchplate/policy-custody:ro
      - ${CATCHPLATE_RESPONSE_OBSERVATION_V2_ROUTER_SOCKET_DIR:?set pre-owned custody-router socket directory}:/run/catchplate-response-v2/router:ro
      # Host preflight requires cert/CA 0:0 mode 0444 and the private key
      # 0:65532 mode 0440, giving only the decision-gate primary group read access.
      - ${CATCHPLATE_PROXY_TLS_CERT_FILE:?set root-owned proxy ingress certificate file}:/run/catchplate/proxy-ingress/server-cert.pem:ro
      - ${CATCHPLATE_PROXY_TLS_KEY_FILE:?set root-owned proxy ingress private key file}:/run/catchplate/proxy-ingress/server-key.pem:ro
      - ${CATCHPLATE_PROXY_CLIENT_CA_BUNDLE_FILE:?set root-owned proxy ingress client CA bundle file}:/run/catchplate/proxy-ingress/client-ca.pem:ro
      # Public trust authorization is separate from CA issuance authority.
      # Deploy these exact public originals as root:root 0444; the immutable
      # publisher's owner-only staging directory is not a runtime installation.
      - ${CATCHPLATE_WORKLOAD_IDENTITY_TRUST_AUTHORIZATION_FILE:?set root-owned signed workload trust authorization file}:/run/catchplate/proxy-ingress/trust-authorization.json:ro
      - ${CATCHPLATE_WORKLOAD_IDENTITY_TRUST_AUTHORIZER_PUBLIC_KEY_FILE:?set independently provisioned root-owned trust-authorizer public key}:/run/catchplate/proxy-ingress/trust-authorizer-public-key.pem:ro
      - ${CATCHPLATE_CONTROL_PLANE_TLS_DIR:?set control-plane TLS directory}/ca.pem:/run/catchplate/tls/ca.pem:ro
      - ${CATCHPLATE_ATTESTATION_HELPER_DIR:?set attestation helper directory}:/opt/catchplate/bin:ro
      - ${CATCHPLATE_NITRO_ROOT_CERT:?set Nitro root certificate}:/run/catchplate/nitro/nitro-root.pem:ro
      - ${CATCHPLATE_RESPONSE_V2_TEE_EXPECTATIONS_FILE:?set response-v2 TEE expectations file}:/run/catchplate/response-v2-tee/expectations.json:ro
      - ${CATCHPLATE_RESPONSE_V2_NITRO_TRUST_ROOTS_FILE:?set response-v2 Nitro trust-roots file}:/run/catchplate/response-v2-tee/nitro-trust-roots.json:ro
      - ${CATCHPLATE_RELEASE_PROVENANCE_FILE:?set release provenance artifact path}:/run/catchplate/release/release-provenance.json:ro
      - ${CATCHPLATE_IMAGE_SIGNATURES_FILE:?set image signatures artifact path}:/run/catchplate/release/image-signatures.json:ro
      - ${CATCHPLATE_DATA_PLANE_CREDENTIAL_LEASE_TOKEN_FILE:?set credential-lease token file}:/run/secrets/catchplate-data-plane-credential-lease-token:ro
      - ${CATCHPLATE_DATA_PLANE_AUDIT_TOKEN_FILE:?set audit-ingest token file}:/run/secrets/catchplate-data-plane-audit-token:ro
      - ${CATCHPLATE_DATA_PLANE_GRANT_CONSUME_TOKEN_FILE:?set grant-consume token file}:/run/secrets/catchplate-data-plane-grant-consume-token:ro
      - ${CATCHPLATE_DATA_PLANE_RATE_LIMIT_CONSUME_TOKEN_FILE:?set rate-limit-consume token file}:/run/secrets/catchplate-data-plane-rate-limit-consume-token:ro
      - ${CATCHPLATE_DATA_PLANE_RELEASE_AUTHORIZATION_TOKEN_FILE:?set release-authorization token file}:/run/secrets/catchplate-data-plane-release-authorization-token:ro
      - ${CATCHPLATE_DATA_PLANE_MANAGEMENT_TOKEN_FILE:?set Rust management token file}:/run/secrets/catchplate-data-plane-management-token:ro
    devices:
      - /dev/nsm:/dev/nsm
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    depends_on:
      custody-runtime:
        condition: service_started
      response-v2-custody-router:
        condition: service_healthy
      response-v2-generation-activation:
        condition: service_completed_successfully
    restart: on-failure

volumes:
  catchplate-data:
  catchplate-gate-materials:
  catchplate-gate-state:
  catchplate-audit-anchors:
  catchplate-custody-socket:
  catchplate-custody-state:
  catchplate-custody-trust:

networks:
  gate-control:
    internal: true
  anchor-control:
    internal: true
  authority-db:
    internal: true
  response-v2-egress:
