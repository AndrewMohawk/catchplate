x-catchplate-policy-custody-host-contract:
  assuranceClass: trusted-host-no-tee
  socketActivation: systemd-inherited-seqpacket
  socketTarget: catchplate-policy-custody-sockets.target
  target: catchplate-policy-custody.target
  driverGroupGid: "${CATCHPLATE_POLICY_CUSTODY_DRIVER_GID:?set host swpc-driver group ID}"
  services:
    durable-recovery-store:
      user: swpc-store
      socket: /run/catchplate/policy-custody/durable-recovery-store.sock
    cleanup-authorization-consumer:
      user: swpc-consume
      socket: /run/catchplate/policy-custody/cleanup-authorization-consumer.sock
    recovery-target-provider:
      user: swpc-target
      socket: /run/catchplate/policy-custody/recovery-target-provider.sock
    current-signature-authority:
      user: swpc-signature
      socket: /run/catchplate/policy-custody/current-signature-authority.sock
    bounded-cleanup-helper:
      user: swpc-cleanup
      socket: /run/catchplate/policy-custody/bounded-cleanup-helper.sock

services:
  catchplate:
    image: ${CATCHPLATE_CONTROL_PLANE_IMAGE:?set immutable control-plane image digest ref}
    user: "0:0"
    init: true
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
      - seccomp=./security/seccomp/catchplate-deny-dangerous.json
      - apparmor=catchplate-docker
    pids_limit: 256
    mem_limit: 768m
    ulimits:
      core:
        soft: 0
        hard: 0
    environment:
      CATCHPLATE_PROCESS_MODE: catchplate-control-plane
      CATCHPLATE_DATA_DIR: /data
      CATCHPLATE_POLICY_BUNDLE: /run/catchplate/gate/policy-bundle.json
      CATCHPLATE_POLICY_HIGH_WATER_FILE: /var/lib/catchplate/policy-high-water.json
      CATCHPLATE_POLICY_MIN_SEQUENCE: ${CATCHPLATE_POLICY_MIN_SEQUENCE:?set signed minimum policy sequence}
      CATCHPLATE_POLICY_MIN_ROLLBACK_EPOCH: ${CATCHPLATE_POLICY_MIN_ROLLBACK_EPOCH:?set signed minimum policy rollback epoch}
      CATCHPLATE_POLICY_SIGNING_PUBLIC_KEY: /run/catchplate/gate/policy-signing-ed25519.pub.pem
      CATCHPLATE_RESPONSE_SIGNING_KEY: /run/secrets/catchplate-response-signing-key
      CATCHPLATE_RESPONSE_SIGNING_PUBLIC_KEY: /run/catchplate/custody-trust/control-plane-response-signing.pub.pem
      CATCHPLATE_RESPONSE_SIGNING_PUBLIC_KEY_ID_PATH: /run/catchplate/custody-trust/control-plane-response-signing.key-id
      CATCHPLATE_DECISION_GATE_CA_CERT: /run/catchplate/gate/decision-gate-ca-cert.pem
      CATCHPLATE_DECISION_GATE_CA_KEY: /run/catchplate/gate/decision-gate-ca-key.pem
      CATCHPLATE_RELEASE_CHANNEL: ${CATCHPLATE_RELEASE_CHANNEL:?set production release channel}
      CATCHPLATE_PUBLIC_URL: ${CATCHPLATE_PUBLIC_URL:?set public URL}
      CATCHPLATE_OAUTH_STATE_TTL_SECONDS: ${CATCHPLATE_OAUTH_STATE_TTL_SECONDS:-600}
      CATCHPLATE_OAUTH_PENDING_CREDENTIAL_TTL_SECONDS: ${CATCHPLATE_OAUTH_PENDING_CREDENTIAL_TTL_SECONDS:-900}
      CATCHPLATE_OAUTH_PENDING_CREDENTIAL_MAX_COUNT: ${CATCHPLATE_OAUTH_PENDING_CREDENTIAL_MAX_COUNT:-1000}
      CATCHPLATE_SETUP_SESSION_TTL_SECONDS: ${CATCHPLATE_SETUP_SESSION_TTL_SECONDS:-86400}
      CATCHPLATE_SETUP_SESSION_MAX_ACTIVE: ${CATCHPLATE_SETUP_SESSION_MAX_ACTIVE:-1000}
      CATCHPLATE_SETUP_SESSION_MAX_RETAINED: ${CATCHPLATE_SETUP_SESSION_MAX_RETAINED:-10000}
      CATCHPLATE_SETUP_SESSION_RETENTION_SECONDS: ${CATCHPLATE_SETUP_SESSION_RETENTION_SECONDS:-604800}
      CATCHPLATE_SETUP_SESSION_EVIDENCE_MAX_BYTES: ${CATCHPLATE_SETUP_SESSION_EVIDENCE_MAX_BYTES:-1048576}
      CATCHPLATE_SETUP_SESSION_EVIDENCE_MAX_COUNT: ${CATCHPLATE_SETUP_SESSION_EVIDENCE_MAX_COUNT:-64}
      CATCHPLATE_SETUP_SESSION_EVENT_MAX_BYTES: ${CATCHPLATE_SETUP_SESSION_EVENT_MAX_BYTES:-16384}
      CATCHPLATE_SETUP_SESSION_EVENT_MAX_COUNT: ${CATCHPLATE_SETUP_SESSION_EVENT_MAX_COUNT:-128}
      CATCHPLATE_SETUP_SESSION_AUDIT_OUTBOX_MAX_PENDING: ${CATCHPLATE_SETUP_SESSION_AUDIT_OUTBOX_MAX_PENDING:-10000}
      CATCHPLATE_SETUP_SESSION_AUDIT_CLAIM_TTL_SECONDS: ${CATCHPLATE_SETUP_SESSION_AUDIT_CLAIM_TTL_SECONDS:-60}
      CATCHPLATE_SETUP_ENROLLMENT_VERIFIER_PUBLIC_KEY: /run/catchplate/setup-trust/enrollment-verifier.pub.pem
      CATCHPLATE_SETUP_ENROLLMENT_VERIFIER_KEY_ID: ${CATCHPLATE_SETUP_ENROLLMENT_VERIFIER_KEY_ID:?set enrollment verifier SPKI ID}
      CATCHPLATE_SETUP_ENROLLMENT_VERIFIER_PROVIDER: ${CATCHPLATE_SETUP_ENROLLMENT_VERIFIER_PROVIDER:?set enrollment verifier provider}
      CATCHPLATE_SETUP_HARDWARE_VERIFIER_PUBLIC_KEY: /run/catchplate/setup-trust/hardware-verifier.pub.pem
      CATCHPLATE_SETUP_HARDWARE_VERIFIER_KEY_ID: ${CATCHPLATE_SETUP_HARDWARE_VERIFIER_KEY_ID:?set hardware verifier SPKI ID}
      CATCHPLATE_SETUP_HARDWARE_VERIFIER_PROVIDER: ${CATCHPLATE_SETUP_HARDWARE_VERIFIER_PROVIDER:?set hardware verifier provider}
      CATCHPLATE_SETUP_FINAL_AUTHORITY_PUBLIC_KEY: /run/catchplate/setup-trust/final-authority.pub.pem
      CATCHPLATE_SETUP_FINAL_AUTHORITY_KEY_ID: ${CATCHPLATE_SETUP_FINAL_AUTHORITY_KEY_ID:?set final authority SPKI ID}
      CATCHPLATE_SETUP_FINAL_AUTHORITY_PROVIDER: ${CATCHPLATE_SETUP_FINAL_AUTHORITY_PROVIDER:?set final authority provider}
      CATCHPLATE_SETUP_ATTESTATION_CHALLENGE_TTL_SECONDS: ${CATCHPLATE_SETUP_ATTESTATION_CHALLENGE_TTL_SECONDS:-300}
      CATCHPLATE_CREDENTIAL_LEASE_REPLAY_MAX_ENTRIES: ${CATCHPLATE_CREDENTIAL_LEASE_REPLAY_MAX_ENTRIES:-1000000}
      CATCHPLATE_GOOGLE_OAUTH_CLIENT_ID: ${CATCHPLATE_GOOGLE_OAUTH_CLIENT_ID:?set Google OAuth client ID}
      CATCHPLATE_GOOGLE_OAUTH_CLIENT_SECRET_FILE: /run/secrets/catchplate-google-oauth-client-secret
      CATCHPLATE_GOOGLE_OAUTH_REDIRECT_URI: ${CATCHPLATE_GOOGLE_OAUTH_REDIRECT_URI:?set exact Google OAuth callback URI}
      CATCHPLATE_X_OAUTH_CLIENT_ID: ${CATCHPLATE_X_OAUTH_CLIENT_ID:?set X OAuth client ID}
      CATCHPLATE_X_OAUTH_CLIENT_SECRET_FILE: /run/secrets/catchplate-x-oauth-client-secret
      CATCHPLATE_X_OAUTH_REDIRECT_URI: ${CATCHPLATE_X_OAUTH_REDIRECT_URI:?set exact X OAuth callback URI}
      CATCHPLATE_WEB_TLS_CERT_FILE: /run/catchplate/tls/catchplate.crt
      CATCHPLATE_WEB_TLS_KEY_FILE: /run/catchplate/tls/catchplate.key
      CATCHPLATE_ADMIN_TOKEN_FILE: /run/secrets/catchplate-admin-token
      CATCHPLATE_OIDC_ENABLED: "1"
      CATCHPLATE_OIDC_ISSUER: ${CATCHPLATE_OIDC_ISSUER:?set OIDC issuer}
      CATCHPLATE_OIDC_AUDIENCE: ${CATCHPLATE_OIDC_AUDIENCE:?set OIDC audience}
      CATCHPLATE_OIDC_JWKS_JSON: ${CATCHPLATE_OIDC_JWKS_JSON:?set pinned JWKS}
      CATCHPLATE_OIDC_ROLE_CLAIM: ${CATCHPLATE_OIDC_ROLE_CLAIM:-catchplate_roles}
      CATCHPLATE_OIDC_BROWSER_LOGIN_ENABLED: "1"
      CATCHPLATE_OIDC_AUTHORIZATION_ENDPOINT: ${CATCHPLATE_OIDC_AUTHORIZATION_ENDPOINT:?set OIDC authorization endpoint}
      CATCHPLATE_OIDC_TOKEN_ENDPOINT: ${CATCHPLATE_OIDC_TOKEN_ENDPOINT:?set OIDC token endpoint}
      CATCHPLATE_OIDC_CLIENT_ID: ${CATCHPLATE_OIDC_CLIENT_ID:?set OIDC client ID}
      CATCHPLATE_OIDC_CLIENT_SECRET_FILE: /run/secrets/catchplate-oidc-client-secret
      CATCHPLATE_OIDC_REDIRECT_URI: ${CATCHPLATE_OIDC_REDIRECT_URI:?set exact OIDC callback URI}
      CATCHPLATE_OIDC_BROWSER_SCOPES: ${CATCHPLATE_OIDC_BROWSER_SCOPES:-openid,profile,email}
      CATCHPLATE_OIDC_TOKEN_AUTH_METHOD: ${CATCHPLATE_OIDC_TOKEN_AUTH_METHOD:-client_secret_basic}
      CATCHPLATE_OIDC_LOGIN_STATE_TTL_SECONDS: ${CATCHPLATE_OIDC_LOGIN_STATE_TTL_SECONDS:-300}
      CATCHPLATE_OIDC_SESSION_TTL_SECONDS: ${CATCHPLATE_OIDC_SESSION_TTL_SECONDS:-3600}
      CATCHPLATE_OIDC_SESSION_WEBAUTHN_REQUIRED: ${CATCHPLATE_OIDC_SESSION_WEBAUTHN_REQUIRED:-1}
      CATCHPLATE_OIDC_SESSION_WEBAUTHN_CHALLENGE_TTL_SECONDS: ${CATCHPLATE_OIDC_SESSION_WEBAUTHN_CHALLENGE_TTL_SECONDS:-120}
      CATCHPLATE_OIDC_SESSION_WEBAUTHN_PENDING_TTL_SECONDS: ${CATCHPLATE_OIDC_SESSION_WEBAUTHN_PENDING_TTL_SECONDS:-300}
      CATCHPLATE_OIDC_SESSION_ACTIVATION_RETRY_TTL_SECONDS: ${CATCHPLATE_OIDC_SESSION_ACTIVATION_RETRY_TTL_SECONDS:-20}
