x-serverware-policy-custody-host-contract:
  assuranceClass: trusted-host-no-tee
  socketActivation: systemd-inherited-seqpacket
  socketTarget: serverware-policy-custody-sockets.target
  target: serverware-policy-custody.target
  driverGroupGid: "${SERVERWARE_POLICY_CUSTODY_DRIVER_GID:?set host swpc-driver group ID}"
  services:
    durable-recovery-store:
      user: swpc-store
      socket: /run/serverware/policy-custody/durable-recovery-store.sock
    cleanup-authorization-consumer:
      user: swpc-consume
      socket: /run/serverware/policy-custody/cleanup-authorization-consumer.sock
    recovery-target-provider:
      user: swpc-target
      socket: /run/serverware/policy-custody/recovery-target-provider.sock
    current-signature-authority:
      user: swpc-signature
      socket: /run/serverware/policy-custody/current-signature-authority.sock
    bounded-cleanup-helper:
      user: swpc-cleanup
      socket: /run/serverware/policy-custody/bounded-cleanup-helper.sock

services:
  serverware:
    image: ${SERVERWARE_CONTROL_PLANE_IMAGE:?set immutable control-plane image digest ref}
    user: "0:0"
    init: true
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
      - seccomp=./security/seccomp/serverware-deny-dangerous.json
      - apparmor=serverware-docker
    pids_limit: 256
    mem_limit: 768m
    ulimits:
      core:
        soft: 0
        hard: 0
    environment:
      SERVERWARE_PROCESS_MODE: serverware-control-plane
      SERVERWARE_DATA_DIR: /data
      SERVERWARE_POLICY_BUNDLE: /run/serverware/gate/policy-bundle.json
      SERVERWARE_POLICY_HIGH_WATER_FILE: /var/lib/serverware/policy-high-water.json
      SERVERWARE_POLICY_MIN_SEQUENCE: ${SERVERWARE_POLICY_MIN_SEQUENCE:?set signed minimum policy sequence}
      SERVERWARE_POLICY_MIN_ROLLBACK_EPOCH: ${SERVERWARE_POLICY_MIN_ROLLBACK_EPOCH:?set signed minimum policy rollback epoch}
      SERVERWARE_POLICY_SIGNING_PUBLIC_KEY: /run/serverware/gate/policy-signing-ed25519.pub.pem
      SERVERWARE_RESPONSE_SIGNING_KEY: /run/secrets/serverware-response-signing-key
      SERVERWARE_RESPONSE_SIGNING_PUBLIC_KEY: /run/serverware/custody-trust/control-plane-response-signing.pub.pem
      SERVERWARE_RESPONSE_SIGNING_PUBLIC_KEY_ID_PATH: /run/serverware/custody-trust/control-plane-response-signing.key-id
      SERVERWARE_DECISION_GATE_CA_CERT: /run/serverware/gate/decision-gate-ca-cert.pem
      SERVERWARE_DECISION_GATE_CA_KEY: /run/serverware/gate/decision-gate-ca-key.pem
      SERVERWARE_RELEASE_CHANNEL: ${SERVERWARE_RELEASE_CHANNEL:?set production release channel}
      SERVERWARE_PUBLIC_URL: ${SERVERWARE_PUBLIC_URL:?set public URL}
      SERVERWARE_OAUTH_STATE_TTL_SECONDS: ${SERVERWARE_OAUTH_STATE_TTL_SECONDS:-600}
      SERVERWARE_OAUTH_PENDING_CREDENTIAL_TTL_SECONDS: ${SERVERWARE_OAUTH_PENDING_CREDENTIAL_TTL_SECONDS:-900}
      SERVERWARE_OAUTH_PENDING_CREDENTIAL_MAX_COUNT: ${SERVERWARE_OAUTH_PENDING_CREDENTIAL_MAX_COUNT:-1000}
      SERVERWARE_SETUP_SESSION_TTL_SECONDS: ${SERVERWARE_SETUP_SESSION_TTL_SECONDS:-86400}
      SERVERWARE_SETUP_SESSION_MAX_ACTIVE: ${SERVERWARE_SETUP_SESSION_MAX_ACTIVE:-1000}
      SERVERWARE_SETUP_SESSION_MAX_RETAINED: ${SERVERWARE_SETUP_SESSION_MAX_RETAINED:-10000}
      SERVERWARE_SETUP_SESSION_RETENTION_SECONDS: ${SERVERWARE_SETUP_SESSION_RETENTION_SECONDS:-604800}
      SERVERWARE_SETUP_SESSION_EVIDENCE_MAX_BYTES: ${SERVERWARE_SETUP_SESSION_EVIDENCE_MAX_BYTES:-1048576}
      SERVERWARE_SETUP_SESSION_EVIDENCE_MAX_COUNT: ${SERVERWARE_SETUP_SESSION_EVIDENCE_MAX_COUNT:-64}
      SERVERWARE_SETUP_SESSION_EVENT_MAX_BYTES: ${SERVERWARE_SETUP_SESSION_EVENT_MAX_BYTES:-16384}
      SERVERWARE_SETUP_SESSION_EVENT_MAX_COUNT: ${SERVERWARE_SETUP_SESSION_EVENT_MAX_COUNT:-128}
      SERVERWARE_SETUP_SESSION_AUDIT_OUTBOX_MAX_PENDING: ${SERVERWARE_SETUP_SESSION_AUDIT_OUTBOX_MAX_PENDING:-10000}
      SERVERWARE_SETUP_SESSION_AUDIT_CLAIM_TTL_SECONDS: ${SERVERWARE_SETUP_SESSION_AUDIT_CLAIM_TTL_SECONDS:-60}
      SERVERWARE_SETUP_ENROLLMENT_VERIFIER_PUBLIC_KEY: /run/serverware/setup-trust/enrollment-verifier.pub.pem
      SERVERWARE_SETUP_ENROLLMENT_VERIFIER_KEY_ID: ${SERVERWARE_SETUP_ENROLLMENT_VERIFIER_KEY_ID:?set enrollment verifier SPKI ID}
      SERVERWARE_SETUP_ENROLLMENT_VERIFIER_PROVIDER: ${SERVERWARE_SETUP_ENROLLMENT_VERIFIER_PROVIDER:?set enrollment verifier provider}
      SERVERWARE_SETUP_HARDWARE_VERIFIER_PUBLIC_KEY: /run/serverware/setup-trust/hardware-verifier.pub.pem
      SERVERWARE_SETUP_HARDWARE_VERIFIER_KEY_ID: ${SERVERWARE_SETUP_HARDWARE_VERIFIER_KEY_ID:?set hardware verifier SPKI ID}
      SERVERWARE_SETUP_HARDWARE_VERIFIER_PROVIDER: ${SERVERWARE_SETUP_HARDWARE_VERIFIER_PROVIDER:?set hardware verifier provider}
      SERVERWARE_SETUP_FINAL_AUTHORITY_PUBLIC_KEY: /run/serverware/setup-trust/final-authority.pub.pem
      SERVERWARE_SETUP_FINAL_AUTHORITY_KEY_ID: ${SERVERWARE_SETUP_FINAL_AUTHORITY_KEY_ID:?set final authority SPKI ID}
      SERVERWARE_SETUP_FINAL_AUTHORITY_PROVIDER: ${SERVERWARE_SETUP_FINAL_AUTHORITY_PROVIDER:?set final authority provider}
      SERVERWARE_SETUP_ATTESTATION_CHALLENGE_TTL_SECONDS: ${SERVERWARE_SETUP_ATTESTATION_CHALLENGE_TTL_SECONDS:-300}
      SERVERWARE_CREDENTIAL_LEASE_REPLAY_MAX_ENTRIES: ${SERVERWARE_CREDENTIAL_LEASE_REPLAY_MAX_ENTRIES:-1000000}
      SERVERWARE_GOOGLE_OAUTH_CLIENT_ID: ${SERVERWARE_GOOGLE_OAUTH_CLIENT_ID:?set Google OAuth client ID}
      SERVERWARE_GOOGLE_OAUTH_CLIENT_SECRET_FILE: /run/secrets/serverware-google-oauth-client-secret
      SERVERWARE_GOOGLE_OAUTH_REDIRECT_URI: ${SERVERWARE_GOOGLE_OAUTH_REDIRECT_URI:?set exact Google OAuth callback URI}
      SERVERWARE_X_OAUTH_CLIENT_ID: ${SERVERWARE_X_OAUTH_CLIENT_ID:?set X OAuth client ID}
      SERVERWARE_X_OAUTH_CLIENT_SECRET_FILE: /run/secrets/serverware-x-oauth-client-secret
      SERVERWARE_X_OAUTH_REDIRECT_URI: ${SERVERWARE_X_OAUTH_REDIRECT_URI:?set exact X OAuth callback URI}
      SERVERWARE_WEB_TLS_CERT_FILE: /run/serverware/tls/serverware.crt
      SERVERWARE_WEB_TLS_KEY_FILE: /run/serverware/tls/serverware.key
      SERVERWARE_ADMIN_TOKEN_FILE: /run/secrets/serverware-admin-token
      SERVERWARE_OIDC_ENABLED: "1"
      SERVERWARE_OIDC_ISSUER: ${SERVERWARE_OIDC_ISSUER:?set OIDC issuer}
      SERVERWARE_OIDC_AUDIENCE: ${SERVERWARE_OIDC_AUDIENCE:?set OIDC audience}
      SERVERWARE_OIDC_JWKS_JSON: ${SERVERWARE_OIDC_JWKS_JSON:?set pinned JWKS}
      SERVERWARE_OIDC_ROLE_CLAIM: ${SERVERWARE_OIDC_ROLE_CLAIM:-serverware_roles}
      SERVERWARE_OIDC_BROWSER_LOGIN_ENABLED: "1"
      SERVERWARE_OIDC_AUTHORIZATION_ENDPOINT: ${SERVERWARE_OIDC_AUTHORIZATION_ENDPOINT:?set OIDC authorization endpoint}
      SERVERWARE_OIDC_TOKEN_ENDPOINT: ${SERVERWARE_OIDC_TOKEN_ENDPOINT:?set OIDC token endpoint}
      SERVERWARE_OIDC_CLIENT_ID: ${SERVERWARE_OIDC_CLIENT_ID:?set OIDC client ID}
      SERVERWARE_OIDC_CLIENT_SECRET_FILE: /run/secrets/serverware-oidc-client-secret
      SERVERWARE_OIDC_REDIRECT_URI: ${SERVERWARE_OIDC_REDIRECT_URI:?set exact OIDC callback URI}
      SERVERWARE_OIDC_BROWSER_SCOPES: ${SERVERWARE_OIDC_BROWSER_SCOPES:-openid,profile,email}
      SERVERWARE_OIDC_TOKEN_AUTH_METHOD: ${SERVERWARE_OIDC_TOKEN_AUTH_METHOD:-client_secret_basic}
      SERVERWARE_OIDC_LOGIN_STATE_TTL_SECONDS: ${SERVERWARE_OIDC_LOGIN_STATE_TTL_SECONDS:-300}
      SERVERWARE_OIDC_SESSION_TTL_SECONDS: ${SERVERWARE_OIDC_SESSION_TTL_SECONDS:-3600}
      SERVERWARE_OIDC_SESSION_WEBAUTHN_REQUIRED: ${SERVERWARE_OIDC_SESSION_WEBAUTHN_REQUIRED:-1}
      SERVERWARE_OIDC_SESSION_WEBAUTHN_CHALLENGE_TTL_SECONDS: ${SERVERWARE_OIDC_SESSION_WEBAUTHN_CHALLENGE_TTL_SECONDS:-120}
      SERVERWARE_OIDC_SESSION_WEBAUTHN_PENDING_TTL_SECONDS: ${SERVERWARE_OIDC_SESSION_WEBAUTHN_PENDING_TTL_SECONDS:-300}
      SERVERWARE_OIDC_SESSION_ACTIVATION_RETRY_TTL_SECONDS: ${SERVERWARE_OIDC_SESSION_ACTIVATION_RETRY_TTL_SECONDS:-20}
      SERVERWARE_WEBAUTHN_RECOVERY_ENABLED: "1"
      SERVERWARE_WEBAUTHN_RECOVERY_ROOT_PUBLIC_KEY: /run/serverware/webauthn-recovery/offline-root.pub.pem
      SERVERWARE_WEBAUTHN_RECOVERY_ROOT_KEY_ID: ${SERVERWARE_WEBAUTHN_RECOVERY_ROOT_KEY_ID:?set offline recovery root SPKI ID}
      SERVERWARE_WEBAUTHN_RECOVERY_ROOT_PROVIDER: ${SERVERWARE_WEBAUTHN_RECOVERY_ROOT_PROVIDER:?set offline recovery root provider}
      SERVERWARE_WEBAUTHN_RECOVERY_AUDIENCE: ${SERVERWARE_WEBAUTHN_RECOVERY_AUDIENCE:?set exact recovery deployment audience}
      SERVERWARE_WEBAUTHN_RECOVERY_TTL_SECONDS: ${SERVERWARE_WEBAUTHN_RECOVERY_TTL_SECONDS:-180}
      SERVERWARE_WEBAUTHN_RECOVERY_MAX_LIVE: ${SERVERWARE_WEBAUTHN_RECOVERY_MAX_LIVE:-100}
      SERVERWARE_WEBAUTHN_RECOVERY_TERMINAL_RETENTION_SECONDS: ${SERVERWARE_WEBAUTHN_RECOVERY_TERMINAL_RETENTION_SECONDS:-7776000}
      SERVERWARE_WEBAUTHN_RECOVERY_MAX_RETAINED: ${SERVERWARE_WEBAUTHN_RECOVERY_MAX_RETAINED:-100000}
      SERVERWARE_WEBAUTHN_RECOVERY_CREDENTIAL_HISTORY_MAX_COUNT: ${SERVERWARE_WEBAUTHN_RECOVERY_CREDENTIAL_HISTORY_MAX_COUNT:-1000}
      SERVERWARE_WEBAUTHN_RECOVERY_CREDENTIAL_HISTORY_MAX_BYTES: ${SERVERWARE_WEBAUTHN_RECOVERY_CREDENTIAL_HISTORY_MAX_BYTES:-4194304}
      SERVERWARE_WEBAUTHN_RECOVERY_EXCLUDE_CREDENTIALS_MAX_COUNT: ${SERVERWARE_WEBAUTHN_RECOVERY_EXCLUDE_CREDENTIALS_MAX_COUNT:-1000}
      SERVERWARE_WEBAUTHN_RECOVERY_EXCLUDE_CREDENTIALS_MAX_BYTES: ${SERVERWARE_WEBAUTHN_RECOVERY_EXCLUDE_CREDENTIALS_MAX_BYTES:-1048576}
      SERVERWARE_WEBAUTHN_RECOVERY_WITNESS_BACKEND: postgres
      SERVERWARE_WEBAUTHN_RECOVERY_WITNESS_POSTGRES_DSN: ${SERVERWARE_WEBAUTHN_RECOVERY_WITNESS_POSTGRES_DSN:?set non-colocated recovery witness DSN}
      SERVERWARE_WEBAUTHN_RECOVERY_WITNESS_FAULT_DOMAIN_ID: ${SERVERWARE_WEBAUTHN_RECOVERY_WITNESS_FAULT_DOMAIN_ID:?set independently provisioned recovery witness fault-domain ID}
      SERVERWARE_WEBAUTHN_RECOVERY_WITNESS_CONNECT_TIMEOUT_SECONDS: ${SERVERWARE_WEBAUTHN_RECOVERY_WITNESS_CONNECT_TIMEOUT_SECONDS:-5}
      SERVERWARE_WEBAUTHN_CHALLENGE_GLOBAL_LIVE_MAX: ${SERVERWARE_WEBAUTHN_CHALLENGE_GLOBAL_LIVE_MAX:-50000}
      SERVERWARE_WEBAUTHN_CHALLENGE_USER_LIVE_MAX: ${SERVERWARE_WEBAUTHN_CHALLENGE_USER_LIVE_MAX:-64}
      SERVERWARE_WEBAUTHN_CHALLENGE_GLOBAL_RATE_MAX: ${SERVERWARE_WEBAUTHN_CHALLENGE_GLOBAL_RATE_MAX:-10000}
      SERVERWARE_WEBAUTHN_CHALLENGE_USER_RATE_MAX: ${SERVERWARE_WEBAUTHN_CHALLENGE_USER_RATE_MAX:-120}
      SERVERWARE_WEBAUTHN_CHALLENGE_RATE_WINDOW_SECONDS: ${SERVERWARE_WEBAUTHN_CHALLENGE_RATE_WINDOW_SECONDS:-60}
      SERVERWARE_WEBAUTHN_CHALLENGE_TERMINAL_RETENTION_SECONDS: ${SERVERWARE_WEBAUTHN_CHALLENGE_TERMINAL_RETENTION_SECONDS:-900}
      SERVERWARE_WEBAUTHN_CHALLENGE_MAX_RETAINED: ${SERVERWARE_WEBAUTHN_CHALLENGE_MAX_RETAINED:-100000}
      SERVERWARE_DIRECT_CA_DOWNLOAD_ENABLED: "0"
      SERVERWARE_CONTROL_PLANE_MUTATION_WEBAUTHN_REQUIRED: "1"
      SERVERWARE_CONTROL_PLANE_MUTATION_REQUIRE_HARDWARE_ATTESTATION: "1"
      SERVERWARE_CONTROL_PLANE_MUTATION_ALLOWED_AUTHENTICATOR_CLASSES: "yubikey,hardware"
      SERVERWARE_CONTROL_PLANE_TWO_PERSON_REQUIRED: "1"
      SERVERWARE_CONTROL_PLANE_TWO_PERSON_ACTIONS: ${SERVERWARE_CONTROL_PLANE_TWO_PERSON_ACTIONS:?set protected mutation actions}
      SERVERWARE_WEBAUTHN_BOOTSTRAP_TOKEN_FILE: /run/secrets/serverware-webauthn-bootstrap-token
      SERVERWARE_POLICY_PUBLISH_DRY_RUN_REQUIRED: "1"
      SERVERWARE_POLICY_CANARY_REQUIRED: "1"
      SERVERWARE_POLICY_CANARY_MIN_OBSERVATION_SECONDS: ${SERVERWARE_POLICY_CANARY_MIN_OBSERVATION_SECONDS:?set staged-policy observation window}
      SERVERWARE_POLICY_CANARY_MIN_AUDIT_EVENTS: ${SERVERWARE_POLICY_CANARY_MIN_AUDIT_EVENTS:?set staged-policy minimum audit events}
      SERVERWARE_POLICY_CANARY_MAX_DENIALS: ${SERVERWARE_POLICY_CANARY_MAX_DENIALS:?set staged-policy denial threshold}
      SERVERWARE_AUDIT_STORE_BACKEND: postgres
      SERVERWARE_AUDIT_STORE_POSTGRES_DSN: ${SERVERWARE_AUDIT_STORE_POSTGRES_DSN:?set audit DSN}
      SERVERWARE_METADATA_STORE_BACKEND: postgres
      SERVERWARE_METADATA_STORE_POSTGRES_DSN: ${SERVERWARE_METADATA_STORE_POSTGRES_DSN:?set metadata DSN}
      SERVERWARE_METADATA_STORE_FAULT_DOMAIN_ID: ${SERVERWARE_METADATA_STORE_FAULT_DOMAIN_ID:?set independently provisioned metadata fault-domain ID}
      SERVERWARE_GRANT_STORE_BACKEND: postgres
      SERVERWARE_GRANT_STORE_POSTGRES_DSN: ${SERVERWARE_METADATA_STORE_POSTGRES_DSN:?set metadata DSN}
      SERVERWARE_ATOMIC_RELEASE_AUTHORIZATION_ENABLED: "1"
      SERVERWARE_RELEASE_AUTHORIZATION_RESERVATION_TTL_SECONDS: ${SERVERWARE_RELEASE_AUTHORIZATION_RESERVATION_TTL_SECONDS:-15}
      SERVERWARE_RELEASE_AUTHORIZATION_DISPATCH_TTL_SECONDS: ${SERVERWARE_RELEASE_AUTHORIZATION_DISPATCH_TTL_SECONDS:-30}
      SERVERWARE_RELEASE_AUTHORIZATION_RECONCILE_LIMIT: ${SERVERWARE_RELEASE_AUTHORIZATION_RECONCILE_LIMIT:-100}
      SERVERWARE_DATA_PLANE_INSTANCE_ID: ${SERVERWARE_DATA_PLANE_INSTANCE_ID:?set data-plane SPIFFE instance ID}
      SERVERWARE_DATA_PLANE_CREDENTIAL_LEASE_TOKEN_FILE: /run/secrets/serverware-data-plane-credential-lease-token
      SERVERWARE_DATA_PLANE_AUDIT_TOKEN_FILE: /run/secrets/serverware-data-plane-audit-token
      SERVERWARE_DATA_PLANE_GRANT_CONSUME_TOKEN_FILE: /run/secrets/serverware-data-plane-grant-consume-token
      SERVERWARE_DATA_PLANE_RATE_LIMIT_CONSUME_TOKEN_FILE: /run/secrets/serverware-data-plane-rate-limit-consume-token
      SERVERWARE_DATA_PLANE_RELEASE_AUTHORIZATION_TOKEN_FILE: /run/secrets/serverware-data-plane-release-authorization-token
      SERVERWARE_DATA_PLANE_MANAGEMENT_TOKEN_FILE: /run/secrets/serverware-data-plane-management-token
      SERVERWARE_AUDIT_ANCHOR_URL: https://audit-anchor:9100/anchors
      SERVERWARE_AUDIT_ANCHOR_CA_BUNDLE: /run/serverware/tls/ca.pem
      SERVERWARE_AUDIT_ANCHOR_TOKEN_FILE: /run/secrets/serverware-audit-anchor-token
      SERVERWARE_AUDIT_ANCHOR_INTERVAL_SECONDS: ${SERVERWARE_AUDIT_ANCHOR_INTERVAL_SECONDS:-2}
      SERVERWARE_AUDIT_ANCHOR_TIMEOUT_SECONDS: ${SERVERWARE_AUDIT_ANCHOR_TIMEOUT_SECONDS:-10}
      SERVERWARE_DATA_PLANE_LEASE_RECIPIENT_ATTESTATION_REQUIRED: "1"
      SERVERWARE_DATA_PLANE_LEASE_RECIPIENT_VERIFY_COMMAND: ${SERVERWARE_DATA_PLANE_LEASE_RECIPIENT_VERIFY_COMMAND:?set recipient attestation verifier command}
      SERVERWARE_TEE_QUOTE_PROVIDER: ${SERVERWARE_TEE_QUOTE_PROVIDER:?set TEE quote provider}
      SERVERWARE_TEE_PLATFORM: ${SERVERWARE_TEE_PLATFORM:?set TEE platform}
      SERVERWARE_TEE_QUOTE_COMMAND: ${SERVERWARE_TEE_QUOTE_COMMAND:?set TEE quote command}
      SERVERWARE_TEE_QUOTE_VERIFY_COMMAND: ${SERVERWARE_TEE_QUOTE_VERIFY_COMMAND:?set TEE quote verifier command}
      SERVERWARE_NITRO_ATTESTATION_COMMAND: ${SERVERWARE_NITRO_ATTESTATION_COMMAND:?set Nitro attestation command}
      SERVERWARE_NITRO_NSM_ATTEST_COMMAND_TEMPLATE: ${SERVERWARE_NITRO_NSM_ATTEST_COMMAND_TEMPLATE:?set NSM attestation command template}
      SERVERWARE_NITRO_ROOT_CERT: /run/serverware/nitro/nitro-root.pem
      SERVERWARE_NITRO_EXPECTED_PCRS: ${SERVERWARE_NITRO_EXPECTED_PCRS:?set expected Nitro PCR policy}
      SERVERWARE_NITRO_REQUIRE_KMS_COMMAND: "1"
      SERVERWARE_NITRO_KMS_RELEASE_COMMAND: ${SERVERWARE_NITRO_KMS_RELEASE_COMMAND:?set KMS Recipient release command}
      SERVERWARE_NITRO_ALLOWED_MATERIALS: broker-kek,decision-gate-ca
      SERVERWARE_RELEASE_PROVENANCE: /run/serverware/release/release-provenance.json
      SERVERWARE_IMAGE_SIGNATURES: /run/serverware/release/image-signatures.json
      SERVERWARE_KEY_RELEASE_REQUIRED: "1"
      SERVERWARE_KEY_RELEASE_ALLOW_DEBUG: "0"
      SERVERWARE_KEY_RELEASE_COMMAND: ${SERVERWARE_KEY_RELEASE_COMMAND:?set external key-release command}
      SERVERWARE_MASTER_KEY_UNSEAL_COMMAND: ${SERVERWARE_MASTER_KEY_UNSEAL_COMMAND:?set in-TEE broker KEK unseal command}
      SERVERWARE_NITRO_NSM_UNSEAL_COMMAND_TEMPLATE: ${SERVERWARE_NITRO_NSM_UNSEAL_COMMAND_TEMPLATE:?set enclave RSA-OAEP unwrap command template}
      SERVERWARE_NITRO_NSM_UNSEAL_OUTPUT_FORMAT: ${SERVERWARE_NITRO_NSM_UNSEAL_OUTPUT_FORMAT:-json}
      SERVERWARE_KEY_RELEASE_MIN_ROLLBACK_EPOCH: ${SERVERWARE_KEY_RELEASE_MIN_ROLLBACK_EPOCH:?set rollback epoch floor}
      SERVERWARE_KEY_RELEASE_REQUIRE_DATA_PLANE_DIGEST: "1"
      SERVERWARE_EXPECTED_DATA_PLANE_BINARY_DIGEST: ${SERVERWARE_EXPECTED_DATA_PLANE_BINARY_DIGEST:?set measured data-plane binary digest}
    ports:
      - "127.0.0.1:3000:3000"
      - "${SERVERWARE_PROXY_BIND_ADDRESS:?set explicit production proxy bind address}:8080:9090"
    entrypoint:
      - /runtime/python/bin/python3
      - -I
      - -P
      - -s
      - -S
      - /runtime/authority-bootstrap/authority_fd_entrypoint.py
      - control-plane
    command: []
    volumes:
      - serverware-data:/data
      - serverware-gate-materials:/run/serverware/gate
      - serverware-custody-trust:/run/serverware/custody-trust
      - ${SERVERWARE_CONTROL_PLANE_TLS_DIR:?set control-plane TLS directory}:/run/serverware/tls:ro
      - ${SERVERWARE_ATTESTATION_HELPER_DIR:?set attestation helper directory}:/opt/serverware/bin:ro
      - ${SERVERWARE_NITRO_ROOT_CERT:?set Nitro root certificate}:/run/serverware/nitro/nitro-root.pem:ro
      - ${SERVERWARE_NITRO_KMS_MATERIALS_FILE:?set KMS Recipient materials file}:/run/serverware/nitro/kms-materials.json:ro
      - ${SERVERWARE_RELEASE_PROVENANCE_FILE:?set release provenance artifact path}:/run/serverware/release/release-provenance.json:ro
      - ${SERVERWARE_IMAGE_SIGNATURES_FILE:?set image signatures artifact path}:/run/serverware/release/image-signatures.json:ro
      - ${SERVERWARE_GOOGLE_OAUTH_CLIENT_SECRET_FILE:?set Google OAuth client secret file}:/run/secrets/serverware-google-oauth-client-secret:ro
      - ${SERVERWARE_X_OAUTH_CLIENT_SECRET_FILE:?set X OAuth client secret file}:/run/secrets/serverware-x-oauth-client-secret:ro
      - ${SERVERWARE_OIDC_CLIENT_SECRET_FILE:?set OIDC client secret file}:/run/secrets/serverware-oidc-client-secret:ro
      - ${SERVERWARE_RESPONSE_SIGNING_PRIVATE_KEY_FILE:?set response signing private key file}:/run/secrets/serverware-response-signing-key:ro
      - ${SERVERWARE_ADMIN_TOKEN_FILE:?set admin token file}:/run/secrets/serverware-admin-token:ro
      - ${SERVERWARE_WEBAUTHN_BOOTSTRAP_TOKEN_FILE:?set first-enrollment bootstrap token file}:/run/secrets/serverware-webauthn-bootstrap-token:ro
      - ${SERVERWARE_DATA_PLANE_CREDENTIAL_LEASE_TOKEN_FILE:?set credential-lease token file}:/run/secrets/serverware-data-plane-credential-lease-token:ro
      - ${SERVERWARE_DATA_PLANE_AUDIT_TOKEN_FILE:?set audit-ingest token file}:/run/secrets/serverware-data-plane-audit-token:ro
      - ${SERVERWARE_DATA_PLANE_GRANT_CONSUME_TOKEN_FILE:?set grant-consume token file}:/run/secrets/serverware-data-plane-grant-consume-token:ro
      - ${SERVERWARE_DATA_PLANE_RATE_LIMIT_CONSUME_TOKEN_FILE:?set rate-limit-consume token file}:/run/secrets/serverware-data-plane-rate-limit-consume-token:ro
      - ${SERVERWARE_DATA_PLANE_RELEASE_AUTHORIZATION_TOKEN_FILE:?set release-authorization token file}:/run/secrets/serverware-data-plane-release-authorization-token:ro
      - ${SERVERWARE_DATA_PLANE_MANAGEMENT_TOKEN_FILE:?set Rust management token file}:/run/secrets/serverware-data-plane-management-token:ro
      - ${SERVERWARE_AUDIT_ANCHOR_TOKEN_FILE:?set audit-anchor token file}:/run/secrets/serverware-audit-anchor-token:ro
      - ${SERVERWARE_SETUP_ENROLLMENT_VERIFIER_PUBLIC_KEY:?set enrollment verifier public key}:/run/serverware/setup-trust/enrollment-verifier.pub.pem:ro
      - ${SERVERWARE_SETUP_HARDWARE_VERIFIER_PUBLIC_KEY:?set hardware verifier public key}:/run/serverware/setup-trust/hardware-verifier.pub.pem:ro
      - ${SERVERWARE_SETUP_FINAL_AUTHORITY_PUBLIC_KEY:?set final authority public key}:/run/serverware/setup-trust/final-authority.pub.pem:ro
      - ${SERVERWARE_WEBAUTHN_RECOVERY_ROOT_PUBLIC_KEY:?set offline WebAuthn recovery root public key}:/run/serverware/webauthn-recovery/offline-root.pub.pem:ro
      - ${SERVERWARE_AUTHORITY_RUNTIME_SOCKET_DIR:?provision runtime relay socket directory uid 65524 gid 65524}:/run/serverware/authority-runtime
      - ${SERVERWARE_AUTHORITY_RUNTIME_TRUST_DIR:?set signed runtime authority trust directory}:/run/serverware/authority-trust:ro
    devices:
      - /dev/nsm:/dev/nsm
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    healthcheck:
      test:
        - CMD
        - /runtime/python/bin/python3
        - -I
        - -P
        - -s
        - -S
        - /runtime/authority-bootstrap/authority_fd_entrypoint.py
        - control-plane-health
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 1s
    networks:
      - default
      - gate-control
      - anchor-control
    depends_on:
      policy-authority-runtime:
        condition: service_healthy

  policy-authority-runtime:
    image: ${SERVERWARE_CONTROL_PLANE_IMAGE:?set immutable control-plane image digest ref}
    user: "0:0"
    init: true
    read_only: true
    network_mode: none
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
      - seccomp=./security/seccomp/serverware-deny-dangerous.json
    pids_limit: 96
    mem_limit: 256m
    environment:
      SERVERWARE_PROCESS_MODE: policy-authority-runtime
    entrypoint:
      - /runtime/python/bin/python3
      - -I
      - -P
      - -s
      - -S
      - /runtime/authority-bootstrap/authority_fd_entrypoint.py
      - runtime
    command: []
