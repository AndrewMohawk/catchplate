      CATCHPLATE_WEBAUTHN_RECOVERY_EXCLUDE_CREDENTIALS_MAX_COUNT: ${CATCHPLATE_WEBAUTHN_RECOVERY_EXCLUDE_CREDENTIALS_MAX_COUNT:-1000}
      CATCHPLATE_WEBAUTHN_RECOVERY_EXCLUDE_CREDENTIALS_MAX_BYTES: ${CATCHPLATE_WEBAUTHN_RECOVERY_EXCLUDE_CREDENTIALS_MAX_BYTES:-1048576}
      CATCHPLATE_WEBAUTHN_RECOVERY_WITNESS_BACKEND: postgres
      CATCHPLATE_WEBAUTHN_RECOVERY_WITNESS_POSTGRES_DSN: ${CATCHPLATE_WEBAUTHN_RECOVERY_WITNESS_POSTGRES_DSN:?set non-colocated recovery witness DSN}
      CATCHPLATE_WEBAUTHN_RECOVERY_WITNESS_FAULT_DOMAIN_ID: ${CATCHPLATE_WEBAUTHN_RECOVERY_WITNESS_FAULT_DOMAIN_ID:?set independently provisioned recovery witness fault-domain ID}
      CATCHPLATE_WEBAUTHN_RECOVERY_WITNESS_CONNECT_TIMEOUT_SECONDS: ${CATCHPLATE_WEBAUTHN_RECOVERY_WITNESS_CONNECT_TIMEOUT_SECONDS:-5}
      CATCHPLATE_WEBAUTHN_CHALLENGE_GLOBAL_LIVE_MAX: ${CATCHPLATE_WEBAUTHN_CHALLENGE_GLOBAL_LIVE_MAX:-50000}
      CATCHPLATE_WEBAUTHN_CHALLENGE_USER_LIVE_MAX: ${CATCHPLATE_WEBAUTHN_CHALLENGE_USER_LIVE_MAX:-64}
      CATCHPLATE_WEBAUTHN_CHALLENGE_GLOBAL_RATE_MAX: ${CATCHPLATE_WEBAUTHN_CHALLENGE_GLOBAL_RATE_MAX:-10000}
      CATCHPLATE_WEBAUTHN_CHALLENGE_USER_RATE_MAX: ${CATCHPLATE_WEBAUTHN_CHALLENGE_USER_RATE_MAX:-120}
      CATCHPLATE_WEBAUTHN_CHALLENGE_RATE_WINDOW_SECONDS: ${CATCHPLATE_WEBAUTHN_CHALLENGE_RATE_WINDOW_SECONDS:-60}
      CATCHPLATE_WEBAUTHN_CHALLENGE_TERMINAL_RETENTION_SECONDS: ${CATCHPLATE_WEBAUTHN_CHALLENGE_TERMINAL_RETENTION_SECONDS:-900}
      CATCHPLATE_WEBAUTHN_CHALLENGE_MAX_RETAINED: ${CATCHPLATE_WEBAUTHN_CHALLENGE_MAX_RETAINED:-100000}
      CATCHPLATE_DIRECT_CA_DOWNLOAD_ENABLED: "0"
      CATCHPLATE_CONTROL_PLANE_MUTATION_WEBAUTHN_REQUIRED: "1"
      CATCHPLATE_CONTROL_PLANE_MUTATION_REQUIRE_HARDWARE_ATTESTATION: "1"
      CATCHPLATE_CONTROL_PLANE_MUTATION_ALLOWED_AUTHENTICATOR_CLASSES: "yubikey,hardware"
      CATCHPLATE_CONTROL_PLANE_TWO_PERSON_REQUIRED: "1"
      CATCHPLATE_CONTROL_PLANE_TWO_PERSON_ACTIONS: ${CATCHPLATE_CONTROL_PLANE_TWO_PERSON_ACTIONS:?set protected mutation actions}
      CATCHPLATE_WEBAUTHN_BOOTSTRAP_TOKEN_FILE: /run/secrets/catchplate-webauthn-bootstrap-token
      CATCHPLATE_POLICY_PUBLISH_DRY_RUN_REQUIRED: "1"
      CATCHPLATE_POLICY_CANARY_REQUIRED: "1"
      CATCHPLATE_POLICY_CANARY_MIN_OBSERVATION_SECONDS: ${CATCHPLATE_POLICY_CANARY_MIN_OBSERVATION_SECONDS:?set staged-policy observation window}
      CATCHPLATE_POLICY_CANARY_MIN_AUDIT_EVENTS: ${CATCHPLATE_POLICY_CANARY_MIN_AUDIT_EVENTS:?set staged-policy minimum audit events}
      CATCHPLATE_POLICY_CANARY_MAX_DENIALS: ${CATCHPLATE_POLICY_CANARY_MAX_DENIALS:?set staged-policy denial threshold}
      CATCHPLATE_AUDIT_STORE_BACKEND: postgres
      CATCHPLATE_AUDIT_STORE_POSTGRES_DSN: ${CATCHPLATE_AUDIT_STORE_POSTGRES_DSN:?set audit DSN}
      CATCHPLATE_METADATA_STORE_BACKEND: postgres
      CATCHPLATE_METADATA_STORE_POSTGRES_DSN: ${CATCHPLATE_METADATA_STORE_POSTGRES_DSN:?set metadata DSN}
      CATCHPLATE_METADATA_STORE_FAULT_DOMAIN_ID: ${CATCHPLATE_METADATA_STORE_FAULT_DOMAIN_ID:?set independently provisioned metadata fault-domain ID}
      CATCHPLATE_GRANT_STORE_BACKEND: postgres
      CATCHPLATE_GRANT_STORE_POSTGRES_DSN: ${CATCHPLATE_METADATA_STORE_POSTGRES_DSN:?set metadata DSN}
      CATCHPLATE_ATOMIC_RELEASE_AUTHORIZATION_ENABLED: "1"
      CATCHPLATE_RELEASE_AUTHORIZATION_RESERVATION_TTL_SECONDS: ${CATCHPLATE_RELEASE_AUTHORIZATION_RESERVATION_TTL_SECONDS:-15}
