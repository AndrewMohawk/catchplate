      CATCHPLATE_WEBAUTHN_RECOVERY_ROOT_PUBLIC_KEY: /run/catchplate/webauthn-recovery/offline-root.pub.pem
      CATCHPLATE_WEBAUTHN_RECOVERY_ROOT_KEY_ID: ${CATCHPLATE_WEBAUTHN_RECOVERY_ROOT_KEY_ID:?set offline recovery root SPKI ID}
      CATCHPLATE_WEBAUTHN_RECOVERY_ROOT_PROVIDER: ${CATCHPLATE_WEBAUTHN_RECOVERY_ROOT_PROVIDER:?set offline recovery root provider}
