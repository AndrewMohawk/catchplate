services:
  serverware:
    image: ${SERVERWARE_CONTROL_PLANE_IMAGE:?set immutable control-plane image digest ref}
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp=./security/seccomp/serverware-deny-dangerous.json
      - apparmor=serverware-docker
    pids_limit: 256
    mem_limit: 768m
    ulimits:
      core:
        soft: 0
        hard: 0
    environment:
      SERVERWARE_DATA_DIR: /data
      SERVERWARE_POLICY_BUNDLE: /run/serverware/gate/policy-bundle.json
      SERVERWARE_POLICY_HIGH_WATER_FILE: /var/lib/serverware/policy-high-water.json
      SERVERWARE_POLICY_MIN_SEQUENCE: ${SERVERWARE_POLICY_MIN_SEQUENCE:?set signed minimum policy sequence}
      SERVERWARE_POLICY_MIN_ROLLBACK_EPOCH: ${SERVERWARE_POLICY_MIN_ROLLBACK_EPOCH:?set signed minimum policy rollback epoch}
      SERVERWARE_POLICY_SIGNING_PUBLIC_KEY: /run/serverware/gate/policy-signing-ed25519.pub.pem
      SERVERWARE_DECISION_GATE_CA_CERT: /run/serverware/gate/decision-gate-ca-cert.pem
      SERVERWARE_DECISION_GATE_CA_KEY: /run/serverware/gate/decision-gate-ca-key.pem
      SERVERWARE_RELEASE_CHANNEL: ${SERVERWARE_RELEASE_CHANNEL:?set production release channel}
      SERVERWARE_PUBLIC_URL: ${SERVERWARE_PUBLIC_URL:?set public URL}
      SERVERWARE_WEB_TLS_CERT_FILE: /run/serverware/tls/serverware.crt
      SERVERWARE_WEB_TLS_KEY_FILE: /run/serverware/tls/serverware.key
      SERVERWARE_ADMIN_TOKEN: ${SERVERWARE_ADMIN_TOKEN:?set admin token}
      SERVERWARE_OIDC_ENABLED: "1"
      SERVERWARE_OIDC_ISSUER: ${SERVERWARE_OIDC_ISSUER:?set OIDC issuer}
      SERVERWARE_OIDC_AUDIENCE: ${SERVERWARE_OIDC_AUDIENCE:?set OIDC audience}
      SERVERWARE_OIDC_JWKS_JSON: ${SERVERWARE_OIDC_JWKS_JSON:?set pinned JWKS}
      SERVERWARE_OIDC_ROLE_CLAIM: ${SERVERWARE_OIDC_ROLE_CLAIM:-serverware_roles}
      SERVERWARE_DIRECT_CA_DOWNLOAD_ENABLED: "0"
      SERVERWARE_CONTROL_PLANE_MUTATION_WEBAUTHN_REQUIRED: "1"
      SERVERWARE_CONTROL_PLANE_TWO_PERSON_REQUIRED: "1"
      SERVERWARE_CONTROL_PLANE_TWO_PERSON_ACTIONS: ${SERVERWARE_CONTROL_PLANE_TWO_PERSON_ACTIONS:?set protected mutation actions}
      SERVERWARE_WEBAUTHN_BOOTSTRAP_TOKEN: ${SERVERWARE_WEBAUTHN_BOOTSTRAP_TOKEN:?set first-enrollment bootstrap token}
      SERVERWARE_POLICY_PUBLISH_DRY_RUN_REQUIRED: "1"
      SERVERWARE_POLICY_CANARY_REQUIRED: "1"
      SERVERWARE_AUDIT_STORE_BACKEND: postgres
      SERVERWARE_AUDIT_STORE_POSTGRES_DSN: ${SERVERWARE_AUDIT_STORE_POSTGRES_DSN:?set audit DSN}
      SERVERWARE_METADATA_STORE_BACKEND: postgres
      SERVERWARE_METADATA_STORE_POSTGRES_DSN: ${SERVERWARE_METADATA_STORE_POSTGRES_DSN:?set metadata DSN}
      SERVERWARE_GRANT_STORE_BACKEND: postgres
      SERVERWARE_GRANT_STORE_POSTGRES_DSN: ${SERVERWARE_GRANT_STORE_POSTGRES_DSN:?set grant DSN}
      SERVERWARE_DATA_PLANE_AUDIT_TOKEN: ${SERVERWARE_DATA_PLANE_AUDIT_TOKEN:?set data-plane token}
      SERVERWARE_AUDIT_ANCHOR_URL: https://audit-anchor:9100/anchors
      SERVERWARE_AUDIT_ANCHOR_CA_BUNDLE: /run/serverware/tls/ca.pem
      SERVERWARE_AUDIT_ANCHOR_TOKEN: ${SERVERWARE_AUDIT_ANCHOR_TOKEN:?set audit-anchor token}
      SERVERWARE_AUDIT_ANCHOR_INTERVAL_SECONDS: ${SERVERWARE_AUDIT_ANCHOR_INTERVAL_SECONDS:-2}
      SERVERWARE_AUDIT_ANCHOR_TIMEOUT_SECONDS: ${SERVERWARE_AUDIT_ANCHOR_TIMEOUT_SECONDS:-10}
      SERVERWARE_DATA_PLANE_LEASE_RECIPIENT_ATTESTATION_REQUIRED: "1"
      SERVERWARE_DATA_PLANE_LEASE_RECIPIENT_VERIFY_COMMAND: ${SERVERWARE_DATA_PLANE_LEASE_RECIPIENT_VERIFY_COMMAND:?set recipient attestation verifier command}
      SERVERWARE_TEE_QUOTE_PROVIDER: ${SERVERWARE_TEE_QUOTE_PROVIDER:?set TEE quote provider}
      SERVERWARE_TEE_PLATFORM: ${SERVERWARE_TEE_PLATFORM:?set TEE platform}
      SERVERWARE_TEE_QUOTE_COMMAND: ${SERVERWARE_TEE_QUOTE_COMMAND:?set TEE quote command}
      SERVERWARE_TEE_QUOTE_VERIFY_COMMAND: ${SERVERWARE_TEE_QUOTE_VERIFY_COMMAND:?set TEE quote verifier command}
      SERVERWARE_NITRO_ATTESTATION_COMMAND: ${SERVERWARE_NITRO_ATTESTATION_COMMAND:?set Nitro attestation command}
      SERVERWARE_NITRO_NSM_ATTEST_COMMAND_TEMPLATE: ${SERVERWARE_NITRO_NSM_ATTEST_COMMAND_TEMPLATE:?set NSM attestation command template}
      SERVERWARE_NITRO_ROOT_CERT: /run/serverware/nitro/nitro-root.pem
      SERVERWARE_NITRO_EXPECTED_PCRS: ${SERVERWARE_NITRO_EXPECTED_PCRS:?set expected Nitro PCR policy}
      SERVERWARE_NITRO_REQUIRE_KMS_COMMAND: "1"
      SERVERWARE_NITRO_KMS_RELEASE_COMMAND: ${SERVERWARE_NITRO_KMS_RELEASE_COMMAND:?set KMS Recipient release command}
      SERVERWARE_NITRO_ALLOWED_MATERIALS: broker-kek,decision-gate-ca
      SERVERWARE_RELEASE_PROVENANCE: /run/serverware/release/release-provenance.json
      SERVERWARE_IMAGE_SIGNATURES: /run/serverware/release/image-signatures.json
      SERVERWARE_KEY_RELEASE_REQUIRED: "1"
      SERVERWARE_KEY_RELEASE_ALLOW_DEBUG: "0"
      SERVERWARE_KEY_RELEASE_COMMAND: ${SERVERWARE_KEY_RELEASE_COMMAND:?set external key-release command}
      SERVERWARE_MASTER_KEY_UNSEAL_COMMAND: ${SERVERWARE_MASTER_KEY_UNSEAL_COMMAND:?set in-TEE broker KEK unseal command}
      SERVERWARE_NITRO_NSM_UNSEAL_COMMAND_TEMPLATE: ${SERVERWARE_NITRO_NSM_UNSEAL_COMMAND_TEMPLATE:?set enclave RSA-OAEP unwrap command template}
      SERVERWARE_NITRO_NSM_UNSEAL_OUTPUT_FORMAT: ${SERVERWARE_NITRO_NSM_UNSEAL_OUTPUT_FORMAT:-json}
      SERVERWARE_KEY_RELEASE_MIN_ROLLBACK_EPOCH: ${SERVERWARE_KEY_RELEASE_MIN_ROLLBACK_EPOCH:?set rollback epoch floor}
      SERVERWARE_KEY_RELEASE_REQUIRE_DATA_PLANE_DIGEST: "1"
      SERVERWARE_EXPECTED_DATA_PLANE_BINARY_DIGEST: ${SERVERWARE_EXPECTED_DATA_PLANE_BINARY_DIGEST:?set measured data-plane binary digest}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - serverware-data:/data
      - serverware-gate-materials:/run/serverware/gate
      - ${SERVERWARE_CONTROL_PLANE_TLS_DIR:?set control-plane TLS directory}:/run/serverware/tls:ro
      - ${SERVERWARE_ATTESTATION_HELPER_DIR:?set attestation helper directory}:/opt/serverware/bin:ro
      - ${SERVERWARE_NITRO_ROOT_CERT:?set Nitro root certificate}:/run/serverware/nitro/nitro-root.pem:ro
      - ${SERVERWARE_NITRO_KMS_MATERIALS_FILE:?set KMS Recipient materials file}:/run/serverware/nitro/kms-materials.json:ro
      - ${SERVERWARE_RELEASE_PROVENANCE_FILE:?set release provenance artifact path}:/run/serverware/release/release-provenance.json:ro
      - ${SERVERWARE_IMAGE_SIGNATURES_FILE:?set image signatures artifact path}:/run/serverware/release/image-signatures.json:ro
    devices:
      - /dev/nsm:/dev/nsm
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    networks:
      - default
      - gate-control
      - anchor-control

  audit-anchor:
    image: ${SERVERWARE_CONTROL_PLANE_IMAGE:?set immutable control-plane image digest ref}
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp=./security/seccomp/serverware-deny-dangerous.json
      - apparmor=serverware-docker
    pids_limit: 128
    mem_limit: 256m
    ulimits:
      core:
        soft: 0
        hard: 0
    command: ["scripts/audit_anchor_sink.py"]
    environment:
      SERVERWARE_AUDIT_ANCHOR_TOKEN: ${SERVERWARE_AUDIT_ANCHOR_TOKEN:?set anchor token}
      SERVERWARE_AUDIT_ANCHOR_PATH: /anchors/transparency-log.jsonl
      SERVERWARE_TRANSPARENCY_LOG_SIGNING_KEY: /anchors/transparency-log-ed25519.pem
      SERVERWARE_TRANSPARENCY_CHECKPOINT_COMMAND: ${SERVERWARE_TRANSPARENCY_CHECKPOINT_COMMAND:?set transparency checkpoint command}
      SERVERWARE_TRANSPARENCY_CHECKPOINT_REQUIRED: "1"
      SERVERWARE_AUDIT_ANCHOR_TLS_CERT_FILE: /run/serverware/anchor-tls/audit-anchor.crt
      SERVERWARE_AUDIT_ANCHOR_TLS_KEY_FILE: /run/serverware/anchor-tls/audit-anchor.key
    volumes:
      - serverware-audit-anchors:/anchors
      - ${SERVERWARE_AUDIT_ANCHOR_TLS_DIR:?set audit-anchor TLS directory}:/run/serverware/anchor-tls:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    networks:
      - anchor-control

  decision-gate-rs:
    image: ${SERVERWARE_DECISION_GATE_IMAGE:?set immutable decision-gate image digest ref}
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp=./security/seccomp/serverware-deny-dangerous.json
      - apparmor=serverware-docker
    pids_limit: 256
    mem_limit: 512m
    ulimits:
      core:
        soft: 0
        hard: 0
    environment:
      SERVERWARE_POLICY_BUNDLE: /run/serverware/gate/policy-bundle.json
      SERVERWARE_POLICY_TRUST_ROOT_ATTESTATION_URL: https://serverware:3000/attestation
      SERVERWARE_CONTROL_PLANE_CREDENTIAL_LEASE_URL: https://serverware:3000/api/data-plane/credential-leases
      SERVERWARE_CONTROL_PLANE_CA_BUNDLE: /run/serverware/tls/ca.pem
      SERVERWARE_CONTROL_PLANE_ATTESTATION_VERIFY_COMMAND: ${SERVERWARE_CONTROL_PLANE_ATTESTATION_VERIFY_COMMAND:?set control-plane attestation verifier command}
      SERVERWARE_CREDENTIAL_LEASE_POLL_SECONDS: "1.0"
      SERVERWARE_DATA_PLANE_RECIPIENT_ATTESTATION_COMMAND: ${SERVERWARE_DATA_PLANE_RECIPIENT_ATTESTATION_COMMAND:?set recipient attestation command}
      SERVERWARE_DATA_PLANE_RESPONSE_PROOF_ATTESTATION_COMMAND: ${SERVERWARE_DATA_PLANE_RESPONSE_PROOF_ATTESTATION_COMMAND:?set response proof attestation command}
      SERVERWARE_DATA_PLANE_INSTANCE_ID: ${SERVERWARE_DATA_PLANE_INSTANCE_ID:?set data-plane SPIFFE instance ID}
      SERVERWARE_MITM_CA_CERT: /run/serverware/gate/decision-gate-ca-cert.pem
      SERVERWARE_MITM_CA_KEY: /run/serverware/gate/decision-gate-ca-key.pem
      SERVERWARE_CONTROL_PLANE_AUDIT_URL: https://serverware:3000/api/data-plane/audit
      SERVERWARE_CONTROL_PLANE_GRANT_CONSUME_URL: https://serverware:3000/api/data-plane/grants/consume
      SERVERWARE_CONTROL_PLANE_RATE_LIMIT_CONSUME_URL: ${SERVERWARE_CONTROL_PLANE_RATE_LIMIT_CONSUME_URL:?set shared rate-limit URL}
      SERVERWARE_DATA_PLANE_AUDIT_TOKEN: ${SERVERWARE_DATA_PLANE_AUDIT_TOKEN:?set data-plane token}
      SERVERWARE_DECISION_GATE_HOST: 0.0.0.0
      SERVERWARE_DECISION_GATE_PORT: "9090"
      SERVERWARE_DECISION_GATE_MANAGEMENT_HOST: 127.0.0.1
      SERVERWARE_DECISION_GATE_MANAGEMENT_PORT: "9091"
      SERVERWARE_RELEASE_PROVENANCE: /run/serverware/release/release-provenance.json
      SERVERWARE_IMAGE_SIGNATURES: /run/serverware/release/image-signatures.json
      SERVERWARE_RELEASE_CHANNEL: ${SERVERWARE_RELEASE_CHANNEL:?set release channel}
      SERVERWARE_POLICY_HIGH_WATER_FILE: /var/lib/serverware/policy-high-water.json
      SERVERWARE_POLICY_MIN_SEQUENCE: ${SERVERWARE_POLICY_MIN_SEQUENCE:?set signed minimum policy sequence}
      SERVERWARE_POLICY_MIN_ROLLBACK_EPOCH: ${SERVERWARE_POLICY_MIN_ROLLBACK_EPOCH:?set signed minimum policy rollback epoch}
      SERVERWARE_DECISION_GATE_PROXY_WORKERS: "16"
    ports:
      - "8080:9090"
    volumes:
      - serverware-gate-materials:/run/serverware/gate:ro
      - serverware-gate-state:/var/lib/serverware
      - ${SERVERWARE_CONTROL_PLANE_TLS_DIR:?set control-plane TLS directory}:/run/serverware/tls:ro
      - ${SERVERWARE_ATTESTATION_HELPER_DIR:?set attestation helper directory}:/opt/serverware/bin:ro
      - ${SERVERWARE_NITRO_ROOT_CERT:?set Nitro root certificate}:/run/serverware/nitro/nitro-root.pem:ro
      - ${SERVERWARE_RELEASE_PROVENANCE_FILE:?set release provenance artifact path}:/run/serverware/release/release-provenance.json:ro
      - ${SERVERWARE_IMAGE_SIGNATURES_FILE:?set image signatures artifact path}:/run/serverware/release/image-signatures.json:ro
    devices:
      - /dev/nsm:/dev/nsm
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    networks:
      - default
      - gate-control

volumes:
  serverware-data:
  serverware-gate-materials:
  serverware-gate-state:
  serverware-audit-anchors:

networks:
  gate-control:
    internal: true
  anchor-control:
    internal: true
