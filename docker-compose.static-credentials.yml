# Explicit opt-in: merge after docker-compose.production.yml with -f.
# Enables creation, rotation and currentness together; it does not provision,
# sign, admit or renew any authority. Supply genuine signed originals and the
# existing fixed trust files below /run/serverware/authority-trust:
#   static-credential-creation.json, -root-public-key, -authority-configuration.json
#   static-credential-rotation.json, -root-public-key, -authority-configuration.json
#   currentness-assignment.json, -root-public-key, -authority-configuration.json,
#     -original.json (each suffix uses the corresponding full basename).
# The three required values select the JSON descriptors. Their nested descriptor
# choices must be disjoint and match the independently signed runtime FD roster.
# The existing entrypoint validates the originals, numbers and collisions; its
# entrypoint, trust-directory mount and cold-owner admission are unchanged.
#
# Compose replaces command lists. This overlay intentionally does not select
# optional --policy-canary-intake or --setup-native-observation modes, which are
# not prerequisites for these credential operations. Do not layer it over a
# command selecting those modes: use a separately reviewed combined command
# with those flags before the three descriptor pairs when they are required.
services:
  serverware:
    command:
      - --static-credential-creation-fd
      - ${SERVERWARE_STATIC_CREDENTIAL_CONFIG_FD:?set independently selected creation selector descriptor}
      - --static-credential-rotation-fd
      - ${SERVERWARE_STATIC_ROTATION_CONFIG_FD:?set independently selected rotation selector descriptor}
      - --currentness-assignment-fd
      - ${SERVERWARE_CURRENTNESS_ASSIGNMENT_CONFIG_FD:?set independently selected currentness selector descriptor}
