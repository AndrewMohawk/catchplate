      response-v2-immutable-artifact-ledger:
        condition: service_healthy
      response-v2-release-attestor-publisher:
        condition: service_healthy
      response-v2-cleanup-watchdog:
        condition: service_healthy

  decision-gate-rs:
    platform: linux/amd64
    image: ${CATCHPLATE_DECISION_GATE_DEV_IMAGE:-catchplate-decision-gate:dev}
    build:
      context: .
      dockerfile: data-plane/decision-gate-rs/Dockerfile
    user: "10001:10001"
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp=./security/seccomp/catchplate-deny-dangerous.json
    pids_limit: 256
    mem_limit: 512m
    ulimits:
      core:
        soft: 0
        hard: 0
    environment:
      CATCHPLATE_POLICY_BUNDLE: /data/policy-bundle.json
      CATCHPLATE_POLICY_TRUST_ROOT_ATTESTATION_URL: http://catchplate:3000/attestation
      CATCHPLATE_CONTROL_PLANE_CREDENTIAL_LEASE_URL: http://catchplate:3000/api/data-plane/credential-leases
      CATCHPLATE_ALLOW_INSECURE_DEV_CREDENTIAL_LEASES: "1"
      CATCHPLATE_RELEASE_CHANNEL: dev
      CATCHPLATE_UPSTREAM_CA_BUNDLE: /data/demo-upstream/ca.pem
      CATCHPLATE_MITM_CA_CERT: /data/decision-gate-ca-cert.pem
      CATCHPLATE_MITM_CA_KEY: /data/decision-gate-ca-key.pem
      CATCHPLATE_CREDENTIAL_LEASE_POLL_SECONDS: "0.25"
      CATCHPLATE_POLICY_POLL_SECONDS: "0.25"
      CATCHPLATE_CONTROL_PLANE_AUDIT_URL: http://catchplate:3000/api/data-plane/audit
      CATCHPLATE_CONTROL_PLANE_GRANT_CONSUME_URL: http://catchplate:3000/api/data-plane/grants/consume
      CATCHPLATE_CONTROL_PLANE_RATE_LIMIT_CONSUME_URL: http://catchplate:3000/api/data-plane/rate-limits/consume
      CATCHPLATE_CONTROL_PLANE_RELEASE_AUTHORIZATION_BASE_URL: http://catchplate:3000/api/data-plane/release-authorizations
      CATCHPLATE_ATOMIC_RELEASE_AUTHORIZATION_ENABLED: "1"
      CATCHPLATE_DATA_PLANE_CREDENTIAL_LEASE_TOKEN: dev-credential-lease-token
      CATCHPLATE_DATA_PLANE_AUDIT_TOKEN: dev-audit-ingest-token
      CATCHPLATE_DATA_PLANE_GRANT_CONSUME_TOKEN: dev-grant-consume-token
      CATCHPLATE_DATA_PLANE_RATE_LIMIT_CONSUME_TOKEN: dev-rate-limit-consume-token
      CATCHPLATE_DATA_PLANE_RELEASE_AUTHORIZATION_TOKEN: dev-release-authorization-token
      CATCHPLATE_DATA_PLANE_MANAGEMENT_TOKEN: dev-rust-management-token
      CATCHPLATE_DECISION_GATE_HOST: 0.0.0.0
      CATCHPLATE_DECISION_GATE_PORT: "9090"
      CATCHPLATE_DECISION_GATE_MANAGEMENT_HOST: 0.0.0.0
      CATCHPLATE_DECISION_GATE_MANAGEMENT_PORT: "9091"
      CATCHPLATE_RELEASE_PROVENANCE: /data/release-provenance.json
      CATCHPLATE_IMAGE_SIGNATURES: /data/image-signatures.json
      CATCHPLATE_DATA_PLANE_RESPONSE_PROOF_ATTESTATION_COMMAND: /usr/local/bin/catchplate-response-proof-fixture
      CATCHPLATE_DATA_PLANE_INSTANCE_ID: spiffe://development.catchplate/decision-gate/local
    ports:
      # The ordinary proxy default remains "127.0.0.1:8080:9090"; isolated lifecycle tests use ephemeral host ports.
      - "127.0.0.1:${CATCHPLATE_DECISION_GATE_PROXY_HOST_PORT:-8080}:9090"
      - "127.0.0.1:${CATCHPLATE_DECISION_GATE_DIRECT_HOST_PORT:-9090}:9090"
      - "127.0.0.1:${CATCHPLATE_DECISION_GATE_MANAGEMENT_HOST_PORT:-9091}:9091"
    volumes:
      - catchplate-data:/data:ro
      - catchplate-custody-socket:/run/catchplate-custody:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    depends_on:
      - catchplate
      - demo-upstream

volumes:
  catchplate-data:
  catchplate-audit-anchors:
  catchplate-grant-store:
  catchplate-custody-socket:
  catchplate-custody-trust:
  catchplate-custody-state:
  catchplate-response-signing-private:
  catchplate-response-v2-router-socket:
  catchplate-response-v2-state-socket:
  catchplate-response-v2-credential-socket:
  catchplate-response-v2-policy-socket:
  catchplate-response-v2-ledger-socket:
  catchplate-response-v2-release-socket:
  catchplate-response-v2-watchdog-socket:
  catchplate-response-v2-router-data:
  catchplate-response-v2-state-data:
  catchplate-response-v2-credential-data:
  catchplate-response-v2-policy-data:
  catchplate-response-v2-ledger-data:
  catchplate-response-v2-release-data:
  catchplate-response-v2-watchdog-data:

networks:
  response-v2-egress:
