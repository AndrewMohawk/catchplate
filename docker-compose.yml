services:
  serverware:
    platform: linux/amd64
    build:
      context: .
    command: ["python", "-m", "serverware.control_plane_runner"]
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp=./security/seccomp/serverware-deny-dangerous.json
    pids_limit: 256
    mem_limit: 768m
    ulimits:
      core:
        soft: 0
        hard: 0
    environment:
      SERVERWARE_DATA_DIR: /data
      SERVERWARE_PUBLIC_URL: ${SERVERWARE_PUBLIC_URL:-http://localhost:3000}
      SERVERWARE_OAUTH_STATE_TTL_SECONDS: ${SERVERWARE_OAUTH_STATE_TTL_SECONDS:-600}
      SERVERWARE_OAUTH_PENDING_CREDENTIAL_TTL_SECONDS: ${SERVERWARE_OAUTH_PENDING_CREDENTIAL_TTL_SECONDS:-900}
      SERVERWARE_OAUTH_PENDING_CREDENTIAL_MAX_COUNT: ${SERVERWARE_OAUTH_PENDING_CREDENTIAL_MAX_COUNT:-1000}
      SERVERWARE_SETUP_SESSION_TTL_SECONDS: ${SERVERWARE_SETUP_SESSION_TTL_SECONDS:-86400}
      SERVERWARE_SETUP_SESSION_MAX_ACTIVE: ${SERVERWARE_SETUP_SESSION_MAX_ACTIVE:-1000}
      SERVERWARE_SETUP_SESSION_MAX_RETAINED: ${SERVERWARE_SETUP_SESSION_MAX_RETAINED:-10000}
      SERVERWARE_SETUP_SESSION_RETENTION_SECONDS: ${SERVERWARE_SETUP_SESSION_RETENTION_SECONDS:-604800}
      SERVERWARE_SETUP_SESSION_EVIDENCE_MAX_BYTES: ${SERVERWARE_SETUP_SESSION_EVIDENCE_MAX_BYTES:-1048576}
      SERVERWARE_SETUP_SESSION_EVIDENCE_MAX_COUNT: ${SERVERWARE_SETUP_SESSION_EVIDENCE_MAX_COUNT:-64}
      SERVERWARE_SETUP_SESSION_EVENT_MAX_BYTES: ${SERVERWARE_SETUP_SESSION_EVENT_MAX_BYTES:-16384}
      SERVERWARE_SETUP_SESSION_EVENT_MAX_COUNT: ${SERVERWARE_SETUP_SESSION_EVENT_MAX_COUNT:-128}
      SERVERWARE_SETUP_SESSION_AUDIT_OUTBOX_MAX_PENDING: ${SERVERWARE_SETUP_SESSION_AUDIT_OUTBOX_MAX_PENDING:-10000}
      SERVERWARE_SETUP_SESSION_AUDIT_CLAIM_TTL_SECONDS: ${SERVERWARE_SETUP_SESSION_AUDIT_CLAIM_TTL_SECONDS:-60}
      SERVERWARE_SETUP_ENROLLMENT_VERIFIER_PUBLIC_KEY: ${SERVERWARE_SETUP_ENROLLMENT_VERIFIER_PUBLIC_KEY:+/run/serverware/setup-trust/enrollment-verifier.pub.pem}
      SERVERWARE_SETUP_ENROLLMENT_VERIFIER_KEY_ID: ${SERVERWARE_SETUP_ENROLLMENT_VERIFIER_KEY_ID:-}
      SERVERWARE_SETUP_ENROLLMENT_VERIFIER_PROVIDER: ${SERVERWARE_SETUP_ENROLLMENT_VERIFIER_PROVIDER:-}
      SERVERWARE_SETUP_HARDWARE_VERIFIER_PUBLIC_KEY: ${SERVERWARE_SETUP_HARDWARE_VERIFIER_PUBLIC_KEY:+/run/serverware/setup-trust/hardware-verifier.pub.pem}
      SERVERWARE_SETUP_HARDWARE_VERIFIER_KEY_ID: ${SERVERWARE_SETUP_HARDWARE_VERIFIER_KEY_ID:-}
      SERVERWARE_SETUP_HARDWARE_VERIFIER_PROVIDER: ${SERVERWARE_SETUP_HARDWARE_VERIFIER_PROVIDER:-}
      SERVERWARE_SETUP_FINAL_AUTHORITY_PUBLIC_KEY: ${SERVERWARE_SETUP_FINAL_AUTHORITY_PUBLIC_KEY:+/run/serverware/setup-trust/final-authority.pub.pem}
      SERVERWARE_SETUP_FINAL_AUTHORITY_KEY_ID: ${SERVERWARE_SETUP_FINAL_AUTHORITY_KEY_ID:-}
      SERVERWARE_SETUP_FINAL_AUTHORITY_PROVIDER: ${SERVERWARE_SETUP_FINAL_AUTHORITY_PROVIDER:-}
      SERVERWARE_SETUP_ATTESTATION_CHALLENGE_TTL_SECONDS: ${SERVERWARE_SETUP_ATTESTATION_CHALLENGE_TTL_SECONDS:-300}
      SERVERWARE_CREDENTIAL_LEASE_REPLAY_MAX_ENTRIES: ${SERVERWARE_CREDENTIAL_LEASE_REPLAY_MAX_ENTRIES:-1000000}
      SERVERWARE_POLICY_CANARY_REQUIRED: ${SERVERWARE_POLICY_CANARY_REQUIRED:-0}
      SERVERWARE_POLICY_CANARY_MIN_OBSERVATION_SECONDS: ${SERVERWARE_POLICY_CANARY_MIN_OBSERVATION_SECONDS:-0}
      SERVERWARE_POLICY_CANARY_MIN_AUDIT_EVENTS: ${SERVERWARE_POLICY_CANARY_MIN_AUDIT_EVENTS:-0}
      SERVERWARE_POLICY_CANARY_MAX_DENIALS: ${SERVERWARE_POLICY_CANARY_MAX_DENIALS:-0}
      SERVERWARE_GOOGLE_OAUTH_CLIENT_ID: ${SERVERWARE_GOOGLE_OAUTH_CLIENT_ID:-}
      SERVERWARE_GOOGLE_OAUTH_CLIENT_SECRET: ${SERVERWARE_GOOGLE_OAUTH_CLIENT_SECRET:-}
      SERVERWARE_GOOGLE_OAUTH_CLIENT_SECRET_FILE: ${SERVERWARE_GOOGLE_OAUTH_CLIENT_SECRET_FILE:+/run/secrets/serverware-google-oauth-client-secret}
      SERVERWARE_GOOGLE_OAUTH_REDIRECT_URI: ${SERVERWARE_GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:3000/api/oauth/callback/google}
      SERVERWARE_X_OAUTH_CLIENT_ID: ${SERVERWARE_X_OAUTH_CLIENT_ID:-}
      SERVERWARE_X_OAUTH_CLIENT_SECRET: ${SERVERWARE_X_OAUTH_CLIENT_SECRET:-}
      SERVERWARE_X_OAUTH_CLIENT_SECRET_FILE: ${SERVERWARE_X_OAUTH_CLIENT_SECRET_FILE:+/run/secrets/serverware-x-oauth-client-secret}
      SERVERWARE_X_OAUTH_REDIRECT_URI: ${SERVERWARE_X_OAUTH_REDIRECT_URI:-http://localhost:3000/api/oauth/callback/x}
      SERVERWARE_OIDC_ENABLED: ${SERVERWARE_OIDC_ENABLED:-0}
      SERVERWARE_OIDC_BROWSER_LOGIN_ENABLED: ${SERVERWARE_OIDC_BROWSER_LOGIN_ENABLED:-0}
      SERVERWARE_OIDC_ISSUER: ${SERVERWARE_OIDC_ISSUER:-}
      SERVERWARE_OIDC_AUDIENCE: ${SERVERWARE_OIDC_AUDIENCE:-}
      SERVERWARE_OIDC_JWKS_JSON: ${SERVERWARE_OIDC_JWKS_JSON:-}
      SERVERWARE_OIDC_AUTHORIZATION_ENDPOINT: ${SERVERWARE_OIDC_AUTHORIZATION_ENDPOINT:-}
      SERVERWARE_OIDC_TOKEN_ENDPOINT: ${SERVERWARE_OIDC_TOKEN_ENDPOINT:-}
      SERVERWARE_OIDC_CLIENT_ID: ${SERVERWARE_OIDC_CLIENT_ID:-}
      SERVERWARE_OIDC_CLIENT_SECRET: ${SERVERWARE_OIDC_CLIENT_SECRET:-}
      SERVERWARE_OIDC_CLIENT_SECRET_FILE: ${SERVERWARE_OIDC_CLIENT_SECRET_FILE:+/run/secrets/serverware-oidc-client-secret}
      SERVERWARE_OIDC_REDIRECT_URI: ${SERVERWARE_OIDC_REDIRECT_URI:-http://localhost:3000/api/auth/oidc/callback}
      SERVERWARE_OIDC_BROWSER_SCOPES: ${SERVERWARE_OIDC_BROWSER_SCOPES:-openid,profile,email}
      SERVERWARE_OIDC_TOKEN_AUTH_METHOD: ${SERVERWARE_OIDC_TOKEN_AUTH_METHOD:-client_secret_basic}
      SERVERWARE_OIDC_LOGIN_STATE_TTL_SECONDS: ${SERVERWARE_OIDC_LOGIN_STATE_TTL_SECONDS:-300}
      SERVERWARE_OIDC_SESSION_TTL_SECONDS: ${SERVERWARE_OIDC_SESSION_TTL_SECONDS:-3600}
      SERVERWARE_ADMIN_TOKEN: dev-admin-token
      SERVERWARE_ADMIN_USER: user:demo
      SERVERWARE_DEV_AUTHENTICATOR: "1"
      SERVERWARE_DECISION_GATE_BASE: http://decision-gate-rs:9091
      SERVERWARE_DATA_PLANE_INSTANCE_ID: spiffe://development.serverware/decision-gate/local
      SERVERWARE_DATA_PLANE_CREDENTIAL_LEASE_TOKEN: dev-credential-lease-token
      SERVERWARE_DATA_PLANE_AUDIT_TOKEN: dev-audit-ingest-token
      SERVERWARE_DATA_PLANE_GRANT_CONSUME_TOKEN: dev-grant-consume-token
      SERVERWARE_DATA_PLANE_RATE_LIMIT_CONSUME_TOKEN: dev-rate-limit-consume-token
      SERVERWARE_DATA_PLANE_RELEASE_AUTHORIZATION_TOKEN: dev-release-authorization-token
      SERVERWARE_DATA_PLANE_MANAGEMENT_TOKEN: dev-rust-management-token
      SERVERWARE_AUDIT_ANCHOR_URL: http://audit-anchor:9100/anchors
      SERVERWARE_AUDIT_ANCHOR_TOKEN: dev-audit-anchor-token
      SERVERWARE_AUDIT_ANCHOR_INTERVAL_SECONDS: "0.5"
      SERVERWARE_AUDIT_ANCHOR_TIMEOUT_SECONDS: "30"
      SERVERWARE_AUDIT_STORE_BACKEND: postgres
      SERVERWARE_AUDIT_STORE_POSTGRES_DSN: postgresql://serverware:serverware@grant-store:5432/serverware
      SERVERWARE_METADATA_STORE_BACKEND: postgres
      SERVERWARE_METADATA_STORE_POSTGRES_DSN: postgresql://serverware:serverware@grant-store:5432/serverware
      SERVERWARE_GRANT_STORE_BACKEND: postgres
      SERVERWARE_GRANT_STORE_POSTGRES_DSN: postgresql://serverware:serverware@grant-store:5432/serverware
      SERVERWARE_ATOMIC_RELEASE_AUTHORIZATION_ENABLED: "1"
      SERVERWARE_RELEASE_AUTHORIZATION_RESERVATION_TTL_SECONDS: "15"
      SERVERWARE_RELEASE_AUTHORIZATION_DISPATCH_TTL_SECONDS: "30"
      SERVERWARE_RELEASE_AUTHORIZATION_RECONCILE_LIMIT: "100"
      SERVERWARE_RELEASE_PROVENANCE: /data/release-provenance.json
      SERVERWARE_IMAGE_SIGNATURES: /data/image-signatures.json
      SERVERWARE_KEY_RELEASE_REQUIRED: "1"
      SERVERWARE_RELEASE_CHANNEL: dev
      SERVERWARE_KEY_RELEASE_MIN_ROLLBACK_EPOCH: "1"
      SERVERWARE_KEY_RELEASE_REQUIRE_DATA_PLANE_DIGEST: "1"
      SERVERWARE_EXPECTED_DATA_PLANE_BINARY_DIGEST: ${SERVERWARE_EXPECTED_DATA_PLANE_BINARY_DIGEST:-}
      SERVERWARE_RESPONSE_SIGNING_KEY: /run/serverware/response-signing-private/response-signing-ed25519.pem
      SERVERWARE_RESPONSE_SIGNING_PUBLIC_KEY: /custody-trust/control-plane-response-signing.pub.pem
      SERVERWARE_RESPONSE_SIGNING_PUBLIC_KEY_ID_PATH: /custody-trust/control-plane-response-signing.key-id
    ports:
      - "127.0.0.1:${SERVERWARE_CONTROL_PLANE_HOST_PORT:-3000}:3000"
    volumes:
      - serverware-data:/data
      - serverware-custody-trust:/custody-trust
      - serverware-response-signing-private:/run/serverware/response-signing-private
      - ${SERVERWARE_GOOGLE_OAUTH_CLIENT_SECRET_FILE:-/dev/null}:/run/secrets/serverware-google-oauth-client-secret:ro
      - ${SERVERWARE_X_OAUTH_CLIENT_SECRET_FILE:-/dev/null}:/run/secrets/serverware-x-oauth-client-secret:ro
      - ${SERVERWARE_OIDC_CLIENT_SECRET_FILE:-/dev/null}:/run/secrets/serverware-oidc-client-secret:ro
      - ${SERVERWARE_SETUP_ENROLLMENT_VERIFIER_PUBLIC_KEY:-/dev/null}:/run/serverware/setup-trust/enrollment-verifier.pub.pem:ro
      - ${SERVERWARE_SETUP_HARDWARE_VERIFIER_PUBLIC_KEY:-/dev/null}:/run/serverware/setup-trust/hardware-verifier.pub.pem:ro
      - ${SERVERWARE_SETUP_FINAL_AUTHORITY_PUBLIC_KEY:-/dev/null}:/run/serverware/setup-trust/final-authority.pub.pem:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    depends_on:
      audit-anchor:
        condition: service_started
      grant-store:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; opener=urllib.request.build_opener(urllib.request.ProxyHandler({})); response=opener.open('http://localhost:3000/healthz', timeout=2); response.read(65537); raise SystemExit(0 if response.status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20

  audit-anchor:
    platform: linux/amd64
    build: .
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp=./security/seccomp/serverware-deny-dangerous.json
    pids_limit: 128
    mem_limit: 256m
    ulimits:
      core:
        soft: 0
        hard: 0
    command: ["python", "scripts/audit_anchor_sink.py"]
    environment:
      SERVERWARE_AUDIT_ANCHOR_TOKEN: dev-audit-anchor-token
      SERVERWARE_AUDIT_ANCHOR_PATH: /anchors/transparency-log.jsonl
      SERVERWARE_TRANSPARENCY_LOG_SIGNING_KEY: /anchors/transparency-log-ed25519.pem
      SERVERWARE_TRANSPARENCY_CHECKPOINT_COMMAND: python scripts/transparency_checkpoint.py checkpoint
      SERVERWARE_TRANSPARENCY_CHECKPOINT_MODE: fixture
      SERVERWARE_TRANSPARENCY_CHECKPOINT_REQUIRED: "1"
      SERVERWARE_EXTERNAL_TRANSPARENCY_LOG_PATH: /anchors/managed-transparency-log.jsonl
    ports:
      - "127.0.0.1:${SERVERWARE_AUDIT_ANCHOR_HOST_PORT:-9100}:9100"
    volumes:
      - serverware-audit-anchors:/anchors
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; opener=urllib.request.build_opener(urllib.request.ProxyHandler({})); response=opener.open('http://localhost:9100/healthz', timeout=2); response.read(65537); raise SystemExit(0 if response.status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20

  grant-store:
    platform: linux/amd64
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    init: true
    user: postgres
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp=./security/seccomp/serverware-deny-dangerous.json
    pids_limit: 128
    mem_limit: 512m
    ulimits:
      core:
        soft: 0
        hard: 0
    environment:
      POSTGRES_DB: serverware
      POSTGRES_USER: serverware
      POSTGRES_PASSWORD: serverware
      PGDATA: /var/lib/postgresql/data/pgdata
    expose:
      - "5432"
    volumes:
      - serverware-grant-store:/var/lib/postgresql/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
      - /var/run/postgresql:rw,noexec,nosuid,nodev,size=8m,uid=70,gid=70,mode=3775
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U serverware -d serverware"]
      interval: 5s
      timeout: 3s
      retries: 20

  demo-upstream:
    platform: linux/amd64
    build: .
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp=./security/seccomp/serverware-deny-dangerous.json
    pids_limit: 128
    mem_limit: 256m
    ulimits:
      core:
        soft: 0
        hard: 0
    command: ["python", "scripts/demo_upstream.py"]
    expose:
      - "8443"
    volumes:
      - serverware-data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m

  custody-runtime:
    profiles: ["custody"]
    platform: linux/amd64
    image: ${SERVERWARE_DECISION_GATE_DEV_IMAGE:-serverware-decision-gate:dev}
    pull_policy: never
    init: true
    read_only: true
    network_mode: none
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp=./security/seccomp/serverware-deny-dangerous.json
    pids_limit: 64
    mem_limit: 128m
    user: "10002:10003"
    ulimits:
      core:
        soft: 0
        hard: 0
    entrypoint: ["/usr/local/bin/serverware-custody-runtime"]
    command: ["--socket", "/run/serverware-custody/custody.sock"]
    environment:
      SERVERWARE_CONTROL_PLANE_RESPONSE_SIGNING_PUBLIC_KEY: /custody-trust/control-plane-response-signing.pub.pem
      SERVERWARE_CONTROL_PLANE_RESPONSE_SIGNING_PUBLIC_KEY_ID_FILE: /custody-trust/control-plane-response-signing.key-id
      SERVERWARE_CUSTODY_EXPECTED_CLIENT_UID: "10001"
      SERVERWARE_CUSTODY_ATTEMPT_LEDGER_DIRECTORY: /var/lib/serverware-custody
    volumes:
      - serverware-custody-socket:/run/serverware-custody
      - serverware-custody-trust:/custody-trust:ro
      - serverware-custody-state:/var/lib/serverware-custody
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    depends_on:
      serverware:
        condition: service_healthy

  response-v2-generation-bootstrap:
    profiles: ["custody"]
    platform: linux/amd64
    image: ${SERVERWARE_DECISION_GATE_DEV_IMAGE:-serverware-decision-gate:dev}
    pull_policy: never
    user: "65521:65519"
    init: true
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=${SERVERWARE_RESPONSE_OBSERVATION_V2_SECCOMP_PROFILE:-./security/seccomp/serverware-deny-dangerous.json}
    pids_limit: 32
    mem_limit: 128m
    entrypoint: ["/usr/local/bin/serverware-response-observation-v2-custody"]
    command: ["--bootstrap-generation", "--config", "/run/serverware-response-v2/config/custody.json"]
    environment:
      CREDENTIALS_DIRECTORY: /run/credentials/serverware-response-v2-generation-bootstrap
      SERVERWARE_RESPONSE_V2_PROVIDER_GENERATION_SHA256: ${SERVERWARE_RESPONSE_V2_PROVIDER_GENERATION_SHA256:?set verified provider-generation digest}
      SERVERWARE_RESPONSE_V2_CGROUP_ROOT: /sys/fs/cgroup/serverware-response-v2
    volumes:
      - ${SERVERWARE_RESPONSE_OBSERVATION_V2_STATE_DATA_DIR:-serverware-response-v2-state-data}:/var/lib/serverware-response-v2/state-authority
      - ${SERVERWARE_RESPONSE_OBSERVATION_V2_LEDGER_DATA_DIR:-serverware-response-v2-ledger-data}:/var/lib/serverware-response-v2/immutable-artifact-ledger:ro
      - ${SERVERWARE_RESPONSE_OBSERVATION_V2_PUBLIC_CONFIG_DIR:-/dev/null}:/run/serverware-response-v2/config:ro
      - ${SERVERWARE_RESPONSE_OBSERVATION_V2_BOOTSTRAP_KEY_DIR:?set one-shot generation bootstrap credential directory}:/run/credentials/serverware-response-v2-generation-bootstrap:ro
      - ${SERVERWARE_RESPONSE_OBSERVATION_V2_POSTGRES_SOCKET_DIR:-/dev/null}:/run/postgresql:ro
      - ${SERVERWARE_RESPONSE_OBSERVATION_V2_CGROUP_ROOT:-/dev/null}:/sys/fs/cgroup/serverware-response-v2:ro
    cgroup: host
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m
    restart: "no"

  response-v2-state-authority:
    profiles: ["custody"]
    platform: linux/amd64
    image: ${SERVERWARE_DECISION_GATE_DEV_IMAGE:-serverware-decision-gate:dev}
    pull_policy: never
    user: "65521:65519"
    init: true
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=${SERVERWARE_RESPONSE_OBSERVATION_V2_SECCOMP_PROFILE:-./security/seccomp/serverware-deny-dangerous.json}
    pids_limit: 64
    mem_limit: 256m
    entrypoint: ["/usr/local/bin/serverware-response-observation-v2-custody"]
    command: ["--service", "state-authority", "--config", "/run/serverware-response-v2/config/custody.json"]
    environment:
      CREDENTIALS_DIRECTORY: /run/credentials/serverware-response-v2-state-authority
      SERVERWARE_RESPONSE_V2_GENERATION_PUBLIC_CREDENTIALS_DIRECTORY: /run/credentials/serverware-response-v2-generation-public
      SERVERWARE_RESPONSE_V2_PROVIDER_GENERATION_SHA256: ${SERVERWARE_RESPONSE_V2_PROVIDER_GENERATION_SHA256:?set verified provider-generation digest}
      SERVERWARE_RESPONSE_V2_CGROUP_ROOT: /sys/fs/cgroup/serverware-response-v2
    healthcheck:
      test: ["CMD", "/usr/local/bin/serverware-response-observation-v2-custody", "--service", "state-authority", "--config", "/run/serverware-response-v2/config/custody.json", "--check-readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - ${SERVERWARE_RESPONSE_OBSERVATION_V2_STATE_SOCKET_DIR:-serverware-response-v2-state-socket}:/run/serverware-response-v2/state
      - ${SERVERWARE_RESPONSE_OBSERVATION_V2_STATE_DATA_DIR:-serverware-response-v2-state-data}:/var/lib/serverware-response-v2/state-authority
      - ${SERVERWARE_RESPONSE_OBSERVATION_V2_PUBLIC_CONFIG_DIR:-/dev/null}:/run/serverware-response-v2/config:ro
      - ${SERVERWARE_RESPONSE_OBSERVATION_V2_STATE_KEY_DIR:-/dev/null}:/run/credentials/serverware-response-v2-state-authority:ro
      - ${SERVERWARE_RESPONSE_OBSERVATION_V2_GENERATION_PUBLIC_CREDENTIAL_DIR:?set public generation and trust-anchor credential directory}:/run/credentials/serverware-response-v2-generation-public:ro
      - ${SERVERWARE_RESPONSE_OBSERVATION_V2_POSTGRES_SOCKET_DIR:-/dev/null}:/run/postgresql:ro
      - ${SERVERWARE_RESPONSE_OBSERVATION_V2_CGROUP_ROOT:-/dev/null}:/sys/fs/cgroup/serverware-response-v2:ro
    cgroup: host
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    depends_on:
      response-v2-generation-bootstrap:
        condition: service_completed_successfully

  response-v2-credential-transport:
    profiles: ["custody"]
    platform: linux/amd64
    image: ${SERVERWARE_DECISION_GATE_DEV_IMAGE:-serverware-decision-gate:dev}
    pull_policy: never
    user: "65522:65519"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=${SERVERWARE_RESPONSE_OBSERVATION_V2_SECCOMP_PROFILE:-./security/seccomp/serverware-deny-dangerous.json}
    pids_limit: 64
    mem_limit: 256m
    entrypoint: ["/usr/local/bin/serverware-response-observation-v2-custody"]
    command: ["--service", "credential-transport", "--config", "/run/serverware-response-v2/config/custody.json"]
    environment:
      CREDENTIALS_DIRECTORY: /run/credentials/serverware-response-v2-credential-transport
    healthcheck:
      test: ["CMD", "/usr/local/bin/serverware-response-observation-v2-custody", "--service", "credential-transport", "--config", "/run/serverware-response-v2/config/custody.json", "--check-readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - ${SERVERWARE_RESPONSE_OBSERVATION_V2_CREDENTIAL_SOCKET_DIR:-serverware-response-v2-credential-socket}:/run/serverware-response-v2/credential-transport
      - ${SERVERWARE_RESPONSE_OBSERVATION_V2_STATE_SOCKET_DIR:-serverware-response-v2-state-socket}:/run/serverware-response-v2/state:ro
      - ${SERVERWARE_RESPONSE_OBSERVATION_V2_CREDENTIAL_DATA_DIR:-serverware-response-v2-credential-data}:/var/lib/serverware-response-v2/credential-transport
      - ${SERVERWARE_RESPONSE_OBSERVATION_V2_PUBLIC_CONFIG_DIR:-/dev/null}:/run/serverware-response-v2/config:ro
      - ${SERVERWARE_RESPONSE_OBSERVATION_V2_CREDENTIAL_KEY_DIR:-/dev/null}:/run/credentials/serverware-response-v2-credential-transport:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    networks:
      - response-v2-egress
    depends_on:
      response-v2-state-authority:
        condition: service_healthy

  response-v2-policy-proof-verifier:
    profiles: ["custody"]
    platform: linux/amd64
    image: ${SERVERWARE_DECISION_GATE_DEV_IMAGE:-serverware-decision-gate:dev}
    pull_policy: never
    user: "65523:65519"
    init: true
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=${SERVERWARE_RESPONSE_OBSERVATION_V2_SECCOMP_PROFILE:-./security/seccomp/serverware-deny-dangerous.json}
    pids_limit: 64
    mem_limit: 192m
    entrypoint: ["/usr/local/bin/serverware-response-observation-v2-custody"]
    command: ["--service", "policy-proof-verifier", "--config", "/run/serverware-response-v2/config/custody.json"]
    environment:
