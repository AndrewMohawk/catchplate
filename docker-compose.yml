services:
  catchplate:
    platform: linux/amd64
    build:
      context: .
    command: ["python", "-m", "catchplate.control_plane_runner"]
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp=./security/seccomp/catchplate-deny-dangerous.json
    pids_limit: 256
    mem_limit: 768m
    ulimits:
      core:
        soft: 0
        hard: 0
    environment:
      CATCHPLATE_DATA_DIR: /data
      CATCHPLATE_PROCESS_MODE: catchplate-control-plane
      CATCHPLATE_PUBLIC_URL: ${CATCHPLATE_PUBLIC_URL:-http://localhost:${CATCHPLATE_CONTROL_PLANE_HOST_PORT:-3000}}
      CATCHPLATE_OAUTH_STATE_TTL_SECONDS: ${CATCHPLATE_OAUTH_STATE_TTL_SECONDS:-600}
      CATCHPLATE_OAUTH_PENDING_CREDENTIAL_TTL_SECONDS: ${CATCHPLATE_OAUTH_PENDING_CREDENTIAL_TTL_SECONDS:-900}
      CATCHPLATE_OAUTH_PENDING_CREDENTIAL_MAX_COUNT: ${CATCHPLATE_OAUTH_PENDING_CREDENTIAL_MAX_COUNT:-1000}
      CATCHPLATE_SETUP_SESSION_TTL_SECONDS: ${CATCHPLATE_SETUP_SESSION_TTL_SECONDS:-86400}
      CATCHPLATE_SETUP_SESSION_MAX_ACTIVE: ${CATCHPLATE_SETUP_SESSION_MAX_ACTIVE:-1000}
      CATCHPLATE_SETUP_SESSION_MAX_RETAINED: ${CATCHPLATE_SETUP_SESSION_MAX_RETAINED:-10000}
      CATCHPLATE_SETUP_SESSION_RETENTION_SECONDS: ${CATCHPLATE_SETUP_SESSION_RETENTION_SECONDS:-604800}
      CATCHPLATE_SETUP_SESSION_EVIDENCE_MAX_BYTES: ${CATCHPLATE_SETUP_SESSION_EVIDENCE_MAX_BYTES:-1048576}
      CATCHPLATE_SETUP_SESSION_EVIDENCE_MAX_COUNT: ${CATCHPLATE_SETUP_SESSION_EVIDENCE_MAX_COUNT:-64}
      CATCHPLATE_SETUP_SESSION_EVENT_MAX_BYTES: ${CATCHPLATE_SETUP_SESSION_EVENT_MAX_BYTES:-16384}
      CATCHPLATE_SETUP_SESSION_EVENT_MAX_COUNT: ${CATCHPLATE_SETUP_SESSION_EVENT_MAX_COUNT:-128}
      CATCHPLATE_SETUP_SESSION_AUDIT_OUTBOX_MAX_PENDING: ${CATCHPLATE_SETUP_SESSION_AUDIT_OUTBOX_MAX_PENDING:-10000}
      CATCHPLATE_SETUP_SESSION_AUDIT_CLAIM_TTL_SECONDS: ${CATCHPLATE_SETUP_SESSION_AUDIT_CLAIM_TTL_SECONDS:-60}
      CATCHPLATE_SETUP_ENROLLMENT_VERIFIER_PUBLIC_KEY: ${CATCHPLATE_SETUP_ENROLLMENT_VERIFIER_PUBLIC_KEY:+/run/catchplate/setup-trust/enrollment-verifier.pub.pem}
      CATCHPLATE_SETUP_ENROLLMENT_VERIFIER_KEY_ID: ${CATCHPLATE_SETUP_ENROLLMENT_VERIFIER_KEY_ID:-}
      CATCHPLATE_SETUP_ENROLLMENT_VERIFIER_PROVIDER: ${CATCHPLATE_SETUP_ENROLLMENT_VERIFIER_PROVIDER:-}
      CATCHPLATE_SETUP_HARDWARE_VERIFIER_PUBLIC_KEY: ${CATCHPLATE_SETUP_HARDWARE_VERIFIER_PUBLIC_KEY:+/run/catchplate/setup-trust/hardware-verifier.pub.pem}
      CATCHPLATE_SETUP_HARDWARE_VERIFIER_KEY_ID: ${CATCHPLATE_SETUP_HARDWARE_VERIFIER_KEY_ID:-}
      CATCHPLATE_SETUP_HARDWARE_VERIFIER_PROVIDER: ${CATCHPLATE_SETUP_HARDWARE_VERIFIER_PROVIDER:-}
      CATCHPLATE_SETUP_FINAL_AUTHORITY_PUBLIC_KEY: ${CATCHPLATE_SETUP_FINAL_AUTHORITY_PUBLIC_KEY:+/run/catchplate/setup-trust/final-authority.pub.pem}
      CATCHPLATE_SETUP_FINAL_AUTHORITY_KEY_ID: ${CATCHPLATE_SETUP_FINAL_AUTHORITY_KEY_ID:-}
      CATCHPLATE_SETUP_FINAL_AUTHORITY_PROVIDER: ${CATCHPLATE_SETUP_FINAL_AUTHORITY_PROVIDER:-}
      CATCHPLATE_SETUP_ATTESTATION_CHALLENGE_TTL_SECONDS: ${CATCHPLATE_SETUP_ATTESTATION_CHALLENGE_TTL_SECONDS:-300}
      CATCHPLATE_CREDENTIAL_LEASE_REPLAY_MAX_ENTRIES: ${CATCHPLATE_CREDENTIAL_LEASE_REPLAY_MAX_ENTRIES:-1000000}
      CATCHPLATE_POLICY_CANARY_REQUIRED: ${CATCHPLATE_POLICY_CANARY_REQUIRED:-0}
      CATCHPLATE_POLICY_CANARY_MIN_OBSERVATION_SECONDS: ${CATCHPLATE_POLICY_CANARY_MIN_OBSERVATION_SECONDS:-0}
      CATCHPLATE_POLICY_CANARY_MIN_AUDIT_EVENTS: ${CATCHPLATE_POLICY_CANARY_MIN_AUDIT_EVENTS:-0}
      CATCHPLATE_POLICY_CANARY_MAX_DENIALS: ${CATCHPLATE_POLICY_CANARY_MAX_DENIALS:-0}
      CATCHPLATE_GOOGLE_OAUTH_CLIENT_ID: ${CATCHPLATE_GOOGLE_OAUTH_CLIENT_ID:-}
      CATCHPLATE_GOOGLE_OAUTH_CLIENT_SECRET: ${CATCHPLATE_GOOGLE_OAUTH_CLIENT_SECRET:-}
      CATCHPLATE_GOOGLE_OAUTH_CLIENT_SECRET_FILE: ${CATCHPLATE_GOOGLE_OAUTH_CLIENT_SECRET_FILE:+/run/secrets/catchplate-google-oauth-client-secret}
      CATCHPLATE_GOOGLE_OAUTH_REDIRECT_URI: ${CATCHPLATE_GOOGLE_OAUTH_REDIRECT_URI:-${CATCHPLATE_PUBLIC_URL:-http://localhost:${CATCHPLATE_CONTROL_PLANE_HOST_PORT:-3000}}/api/oauth/callback/google}
      CATCHPLATE_X_OAUTH_CLIENT_ID: ${CATCHPLATE_X_OAUTH_CLIENT_ID:-}
      CATCHPLATE_X_OAUTH_CLIENT_SECRET: ${CATCHPLATE_X_OAUTH_CLIENT_SECRET:-}
      CATCHPLATE_X_OAUTH_CLIENT_SECRET_FILE: ${CATCHPLATE_X_OAUTH_CLIENT_SECRET_FILE:+/run/secrets/catchplate-x-oauth-client-secret}
      CATCHPLATE_X_OAUTH_REDIRECT_URI: ${CATCHPLATE_X_OAUTH_REDIRECT_URI:-${CATCHPLATE_PUBLIC_URL:-http://localhost:${CATCHPLATE_CONTROL_PLANE_HOST_PORT:-3000}}/api/oauth/callback/x}
      CATCHPLATE_OIDC_ENABLED: ${CATCHPLATE_OIDC_ENABLED:-0}
      CATCHPLATE_OIDC_BROWSER_LOGIN_ENABLED: ${CATCHPLATE_OIDC_BROWSER_LOGIN_ENABLED:-0}
      CATCHPLATE_OIDC_ISSUER: ${CATCHPLATE_OIDC_ISSUER:-}
      CATCHPLATE_OIDC_AUDIENCE: ${CATCHPLATE_OIDC_AUDIENCE:-}
      CATCHPLATE_OIDC_JWKS_JSON: ${CATCHPLATE_OIDC_JWKS_JSON:-}
      CATCHPLATE_OIDC_AUTHORIZATION_ENDPOINT: ${CATCHPLATE_OIDC_AUTHORIZATION_ENDPOINT:-}
      CATCHPLATE_OIDC_TOKEN_ENDPOINT: ${CATCHPLATE_OIDC_TOKEN_ENDPOINT:-}
      CATCHPLATE_OIDC_CLIENT_ID: ${CATCHPLATE_OIDC_CLIENT_ID:-}
      CATCHPLATE_OIDC_CLIENT_SECRET: ${CATCHPLATE_OIDC_CLIENT_SECRET:-}
      CATCHPLATE_OIDC_CLIENT_SECRET_FILE: ${CATCHPLATE_OIDC_CLIENT_SECRET_FILE:+/run/secrets/catchplate-oidc-client-secret}
      CATCHPLATE_OIDC_REDIRECT_URI: ${CATCHPLATE_OIDC_REDIRECT_URI:-${CATCHPLATE_PUBLIC_URL:-http://localhost:${CATCHPLATE_CONTROL_PLANE_HOST_PORT:-3000}}/api/auth/oidc/callback}
      CATCHPLATE_OIDC_BROWSER_SCOPES: ${CATCHPLATE_OIDC_BROWSER_SCOPES:-openid,profile,email}
      CATCHPLATE_OIDC_TOKEN_AUTH_METHOD: ${CATCHPLATE_OIDC_TOKEN_AUTH_METHOD:-client_secret_basic}
      CATCHPLATE_OIDC_LOGIN_STATE_TTL_SECONDS: ${CATCHPLATE_OIDC_LOGIN_STATE_TTL_SECONDS:-300}
      CATCHPLATE_OIDC_SESSION_TTL_SECONDS: ${CATCHPLATE_OIDC_SESSION_TTL_SECONDS:-3600}
      CATCHPLATE_ADMIN_TOKEN: dev-admin-token
      CATCHPLATE_ADMIN_USER: user:demo
      CATCHPLATE_DEV_AUTHENTICATOR: "1"
      CATCHPLATE_DECISION_GATE_BASE: http://decision-gate-rs:9091
      CATCHPLATE_DATA_PLANE_INSTANCE_ID: spiffe://development.catchplate/decision-gate/local
      CATCHPLATE_DATA_PLANE_CREDENTIAL_LEASE_TOKEN: dev-credential-lease-token
      CATCHPLATE_DATA_PLANE_AUDIT_TOKEN: dev-audit-ingest-token
      CATCHPLATE_DATA_PLANE_GRANT_CONSUME_TOKEN: dev-grant-consume-token
      CATCHPLATE_DATA_PLANE_RATE_LIMIT_CONSUME_TOKEN: dev-rate-limit-consume-token
      CATCHPLATE_DATA_PLANE_RELEASE_AUTHORIZATION_TOKEN: dev-release-authorization-token
      CATCHPLATE_DATA_PLANE_MANAGEMENT_TOKEN: dev-rust-management-token
      CATCHPLATE_AUDIT_ANCHOR_URL: http://audit-anchor:9100/anchors
      CATCHPLATE_AUDIT_ANCHOR_TOKEN: dev-audit-anchor-token
      CATCHPLATE_AUDIT_ANCHOR_INTERVAL_SECONDS: "0.5"
      CATCHPLATE_AUDIT_ANCHOR_TIMEOUT_SECONDS: "30"
      CATCHPLATE_AUDIT_STORE_BACKEND: postgres
      CATCHPLATE_AUDIT_STORE_POSTGRES_DSN: postgresql://catchplate:catchplate@grant-store:5432/catchplate
      CATCHPLATE_METADATA_STORE_BACKEND: postgres
      CATCHPLATE_METADATA_STORE_POSTGRES_DSN: postgresql://catchplate:catchplate@grant-store:5432/catchplate
      CATCHPLATE_GRANT_STORE_BACKEND: postgres
      CATCHPLATE_GRANT_STORE_POSTGRES_DSN: postgresql://catchplate:catchplate@grant-store:5432/catchplate
      CATCHPLATE_ATOMIC_RELEASE_AUTHORIZATION_ENABLED: "1"
      CATCHPLATE_RELEASE_AUTHORIZATION_RESERVATION_TTL_SECONDS: "15"
      CATCHPLATE_RELEASE_AUTHORIZATION_DISPATCH_TTL_SECONDS: "30"
      CATCHPLATE_RELEASE_AUTHORIZATION_RECONCILE_LIMIT: "100"
      CATCHPLATE_RELEASE_PROVENANCE: /data/release-provenance.json
      CATCHPLATE_IMAGE_SIGNATURES: /data/image-signatures.json
      CATCHPLATE_KEY_RELEASE_REQUIRED: "1"
      CATCHPLATE_RELEASE_CHANNEL: dev
      CATCHPLATE_KEY_RELEASE_MIN_ROLLBACK_EPOCH: "1"
      CATCHPLATE_KEY_RELEASE_REQUIRE_DATA_PLANE_DIGEST: "1"
      CATCHPLATE_EXPECTED_DATA_PLANE_BINARY_DIGEST: ${CATCHPLATE_EXPECTED_DATA_PLANE_BINARY_DIGEST:-}
      CATCHPLATE_RESPONSE_SIGNING_KEY: /run/catchplate/response-signing-private/response-signing-ed25519.pem
      CATCHPLATE_RESPONSE_SIGNING_PUBLIC_KEY: /custody-trust/control-plane-response-signing.pub.pem
      CATCHPLATE_RESPONSE_SIGNING_PUBLIC_KEY_ID_PATH: /custody-trust/control-plane-response-signing.key-id
    ports:
      - "127.0.0.1:${CATCHPLATE_CONTROL_PLANE_HOST_PORT:-3000}:3000"
    volumes:
      - catchplate-data:/data
      - catchplate-custody-trust:/custody-trust
      - catchplate-response-signing-private:/run/catchplate/response-signing-private
      - ${CATCHPLATE_GOOGLE_OAUTH_CLIENT_SECRET_FILE:-/dev/null}:/run/secrets/catchplate-google-oauth-client-secret:ro
      - ${CATCHPLATE_X_OAUTH_CLIENT_SECRET_FILE:-/dev/null}:/run/secrets/catchplate-x-oauth-client-secret:ro
      - ${CATCHPLATE_OIDC_CLIENT_SECRET_FILE:-/dev/null}:/run/secrets/catchplate-oidc-client-secret:ro
      - ${CATCHPLATE_SETUP_ENROLLMENT_VERIFIER_PUBLIC_KEY:-/dev/null}:/run/catchplate/setup-trust/enrollment-verifier.pub.pem:ro
      - ${CATCHPLATE_SETUP_HARDWARE_VERIFIER_PUBLIC_KEY:-/dev/null}:/run/catchplate/setup-trust/hardware-verifier.pub.pem:ro
      - ${CATCHPLATE_SETUP_FINAL_AUTHORITY_PUBLIC_KEY:-/dev/null}:/run/catchplate/setup-trust/final-authority.pub.pem:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    depends_on:
      audit-anchor:
        condition: service_started
      grant-store:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; opener=urllib.request.build_opener(urllib.request.ProxyHandler({})); response=opener.open('http://localhost:3000/healthz', timeout=2); response.read(65537); raise SystemExit(0 if response.status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20

  audit-anchor:
    platform: linux/amd64
    build: .
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp=./security/seccomp/catchplate-deny-dangerous.json
    pids_limit: 128
    mem_limit: 256m
    ulimits:
      core:
        soft: 0
        hard: 0
    command: ["python", "scripts/audit_anchor_sink.py"]
    environment:
      CATCHPLATE_AUDIT_ANCHOR_TOKEN: dev-audit-anchor-token
      CATCHPLATE_AUDIT_ANCHOR_PATH: /anchors/transparency-log.jsonl
      CATCHPLATE_TRANSPARENCY_LOG_SIGNING_KEY: /anchors/transparency-log-ed25519.pem
      CATCHPLATE_TRANSPARENCY_CHECKPOINT_COMMAND: python scripts/transparency_checkpoint.py checkpoint
      CATCHPLATE_TRANSPARENCY_CHECKPOINT_MODE: fixture
      CATCHPLATE_TRANSPARENCY_CHECKPOINT_REQUIRED: "1"
      CATCHPLATE_EXTERNAL_TRANSPARENCY_LOG_PATH: /anchors/managed-transparency-log.jsonl
    ports:
      - "127.0.0.1:${CATCHPLATE_AUDIT_ANCHOR_HOST_PORT:-9100}:9100"
    volumes:
      - catchplate-audit-anchors:/anchors
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; opener=urllib.request.build_opener(urllib.request.ProxyHandler({})); response=opener.open('http://localhost:9100/healthz', timeout=2); response.read(65537); raise SystemExit(0 if response.status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20

  grant-store:
    platform: linux/amd64
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    init: true
    user: postgres
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp=./security/seccomp/catchplate-deny-dangerous.json
    pids_limit: 128
    mem_limit: 512m
    ulimits:
      core:
        soft: 0
        hard: 0
    environment:
      POSTGRES_DB: catchplate
      POSTGRES_USER: catchplate
      POSTGRES_PASSWORD: catchplate
      PGDATA: /var/lib/postgresql/data/pgdata
    expose:
      - "5432"
    volumes:
      - catchplate-grant-store:/var/lib/postgresql/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
      - /var/run/postgresql:rw,noexec,nosuid,nodev,size=8m,uid=70,gid=70,mode=3775
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catchplate -d catchplate"]
      interval: 5s
      timeout: 3s
      retries: 20

  demo-upstream:
    platform: linux/amd64
    build: .
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp=./security/seccomp/catchplate-deny-dangerous.json
    pids_limit: 128
    mem_limit: 256m
    ulimits:
      core:
        soft: 0
        hard: 0
    command: ["python", "scripts/demo_upstream.py"]
    expose:
      - "8443"
    volumes:
      - catchplate-data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    healthcheck:
      test: ["CMD", "python", "-c", "import json,ssl,urllib.request; context=ssl.create_default_context(cafile='/data/demo-upstream/ca.pem'); opener=urllib.request.build_opener(urllib.request.ProxyHandler({}), urllib.request.HTTPSHandler(context=context)); response=opener.open('https://demo-upstream:8443/_test/request-count?method=GET&path=%2Fecho', timeout=2); body=response.read(65537); payload=json.loads(body) if len(body) <= 65536 else {}; raise SystemExit(0 if response.status == 200 and type(payload.get('count')) is int and payload['count'] >= 0 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20

  custody-runtime:
    profiles: ["custody"]
    platform: linux/amd64
    image: ${CATCHPLATE_DECISION_GATE_DEV_IMAGE:-catchplate-decision-gate:dev}
    pull_policy: never
    init: true
    read_only: true
    network_mode: none
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp=./security/seccomp/catchplate-deny-dangerous.json
    pids_limit: 64
    mem_limit: 128m
    user: "10002:10003"
    ulimits:
      core:
        soft: 0
        hard: 0
    entrypoint: ["/usr/local/bin/catchplate-custody-runtime"]
    command: ["--socket", "/run/catchplate-custody/custody.sock"]
    environment:
      CATCHPLATE_CONTROL_PLANE_RESPONSE_SIGNING_PUBLIC_KEY: /custody-trust/control-plane-response-signing.pub.pem
      CATCHPLATE_CONTROL_PLANE_RESPONSE_SIGNING_PUBLIC_KEY_ID_FILE: /custody-trust/control-plane-response-signing.key-id
      CATCHPLATE_CUSTODY_EXPECTED_CLIENT_UID: "10001"
      CATCHPLATE_CUSTODY_ATTEMPT_LEDGER_DIRECTORY: /var/lib/catchplate-custody
    volumes:
      - catchplate-custody-socket:/run/catchplate-custody
      - catchplate-custody-trust:/custody-trust:ro
      - catchplate-custody-state:/var/lib/catchplate-custody
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    depends_on:
      catchplate:
        condition: service_healthy

  # Required generation pins and credential mounts live in the opt-in custody
  # override: Compose interpolates even services whose profiles are disabled.
  # A profile alone does not provision authority material or enable gate custody.
  response-v2-generation-bootstrap:
    profiles: ["custody"]
    platform: linux/amd64
    image: ${CATCHPLATE_DECISION_GATE_DEV_IMAGE:-catchplate-decision-gate:dev}
    pull_policy: never
    user: "65521:65519"
    init: true
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=${CATCHPLATE_RESPONSE_OBSERVATION_V2_SECCOMP_PROFILE:-./security/seccomp/catchplate-deny-dangerous.json}
    pids_limit: 32
    mem_limit: 128m
    entrypoint: ["/usr/local/bin/catchplate-response-observation-v2-custody"]
    command: ["--bootstrap-generation", "--config", "/run/catchplate-response-v2/config/custody.json"]
    environment:
      CREDENTIALS_DIRECTORY: /run/credentials/catchplate-response-v2-generation-bootstrap
      CATCHPLATE_RESPONSE_V2_CGROUP_ROOT: /sys/fs/cgroup/catchplate-response-v2
    volumes:
      - ${CATCHPLATE_RESPONSE_OBSERVATION_V2_STATE_DATA_DIR:-catchplate-response-v2-state-data}:/var/lib/catchplate-response-v2/state-authority
      - ${CATCHPLATE_RESPONSE_OBSERVATION_V2_LEDGER_DATA_DIR:-catchplate-response-v2-ledger-data}:/var/lib/catchplate-response-v2/immutable-artifact-ledger:ro
      - ${CATCHPLATE_RESPONSE_OBSERVATION_V2_PUBLIC_CONFIG_DIR:-/dev/null}:/run/catchplate-response-v2/config:ro
      - ${CATCHPLATE_RESPONSE_OBSERVATION_V2_POSTGRES_SOCKET_DIR:-/dev/null}:/run/postgresql:ro
      - ${CATCHPLATE_RESPONSE_OBSERVATION_V2_CGROUP_ROOT:-/dev/null}:/sys/fs/cgroup/catchplate-response-v2:ro
    cgroup: host
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m
    restart: "no"

  response-v2-state-authority:
    profiles: ["custody"]
    platform: linux/amd64
    image: ${CATCHPLATE_DECISION_GATE_DEV_IMAGE:-catchplate-decision-gate:dev}
    pull_policy: never
    user: "65521:65519"
    init: true
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=${CATCHPLATE_RESPONSE_OBSERVATION_V2_SECCOMP_PROFILE:-./security/seccomp/catchplate-deny-dangerous.json}
    pids_limit: 64
    mem_limit: 256m
    entrypoint: ["/usr/local/bin/catchplate-response-observation-v2-custody"]
    command: ["--service", "state-authority", "--config", "/run/catchplate-response-v2/config/custody.json"]
    environment:
      CREDENTIALS_DIRECTORY: /run/credentials/catchplate-response-v2-state-authority
      CATCHPLATE_RESPONSE_V2_GENERATION_PUBLIC_CREDENTIALS_DIRECTORY: /run/credentials/catchplate-response-v2-generation-public
      CATCHPLATE_RESPONSE_V2_CGROUP_ROOT: /sys/fs/cgroup/catchplate-response-v2
    healthcheck:
      test: ["CMD", "/usr/local/bin/catchplate-response-observation-v2-custody", "--service", "state-authority", "--config", "/run/catchplate-response-v2/config/custody.json", "--check-readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - ${CATCHPLATE_RESPONSE_OBSERVATION_V2_STATE_SOCKET_DIR:-catchplate-response-v2-state-socket}:/run/catchplate-response-v2/state
      - ${CATCHPLATE_RESPONSE_OBSERVATION_V2_STATE_DATA_DIR:-catchplate-response-v2-state-data}:/var/lib/catchplate-response-v2/state-authority
      - ${CATCHPLATE_RESPONSE_OBSERVATION_V2_PUBLIC_CONFIG_DIR:-/dev/null}:/run/catchplate-response-v2/config:ro
      - ${CATCHPLATE_RESPONSE_OBSERVATION_V2_STATE_KEY_DIR:-/dev/null}:/run/credentials/catchplate-response-v2-state-authority:ro
      - ${CATCHPLATE_RESPONSE_OBSERVATION_V2_POSTGRES_SOCKET_DIR:-/dev/null}:/run/postgresql:ro
      - ${CATCHPLATE_RESPONSE_OBSERVATION_V2_CGROUP_ROOT:-/dev/null}:/sys/fs/cgroup/catchplate-response-v2:ro
    cgroup: host
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    depends_on:
      response-v2-generation-bootstrap:
        condition: service_completed_successfully

  response-v2-credential-transport:
    profiles: ["custody"]
    platform: linux/amd64
    image: ${CATCHPLATE_DECISION_GATE_DEV_IMAGE:-catchplate-decision-gate:dev}
    pull_policy: never
    user: "65522:65519"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=${CATCHPLATE_RESPONSE_OBSERVATION_V2_SECCOMP_PROFILE:-./security/seccomp/catchplate-deny-dangerous.json}
    pids_limit: 64
    mem_limit: 256m
    entrypoint: ["/usr/local/bin/catchplate-response-observation-v2-custody"]
    command: ["--service", "credential-transport", "--config", "/run/catchplate-response-v2/config/custody.json"]
    environment:
      CREDENTIALS_DIRECTORY: /run/credentials/catchplate-response-v2-credential-transport
    healthcheck:
      test: ["CMD", "/usr/local/bin/catchplate-response-observation-v2-custody", "--service", "credential-transport", "--config", "/run/catchplate-response-v2/config/custody.json", "--check-readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - ${CATCHPLATE_RESPONSE_OBSERVATION_V2_CREDENTIAL_SOCKET_DIR:-catchplate-response-v2-credential-socket}:/run/catchplate-response-v2/credential-transport
