# Managed, unconfigured layer used by the accepted live rollout on 2026-10-10.
# The historical candidate filename is retained; accepted-source pins its source.
# Combine in this order: base + this SINGLE source-selection layer + curated-gate
# + notifications. Never combine with another source override or legacy google.
# Root must verify the immutable OPERATOR_MANAGED_SOURCE manifest and literal
# binary below, then resolve/review the complete Compose model before execution.
# Provider custody must be an existing EMPTY app-owned 0700 directory, distinct
# from app-data, gate-runtime and notification custody (including bind aliases).
# Start the app before creating the gate so curated public state exists. No key,
# client profile, credential, consent or Prepare operation is supplied here.
services:
  catchplate:
    environment:
      CATCHPLATE_EXPECTED_DATA_PLANE_BINARY_DIGEST: sha256:333ff7a3db00ab2bf03644fc965aed9b691bdd6ddc4ec651273e6d0c36f053e0
      CATCHPLATE_OPERATOR_MANAGED_GOOGLE_ENABLED: "1"
      CATCHPLATE_OPERATOR_PROVIDER_CUSTODY_DIR: /provider-custody
      CATCHPLATE_PROCESS_MODE: catchplate-control-plane
      CATCHPLATE_METADATA_STORE_BACKEND: sqlite
      CATCHPLATE_AUDIT_STORE_BACKEND: sqlite
      CATCHPLATE_GRANT_STORE_BACKEND: sqlite
      CATCHPLATE_RELEASE_CHANNEL: dev
      CATCHPLATE_ATOMIC_RELEASE_AUTHORIZATION_ENABLED: "0"
      CATCHPLATE_KEY_RELEASE_REQUIRED: "0"
      CATCHPLATE_DEV_AUTHENTICATOR: "0"
      CATCHPLATE_DEV_DEMO_SEED: "0"
    volumes:
      - type: bind
        source: ${OPERATOR_MANAGED_SOURCE:?Set the reviewed immutable managed source directory}
        target: /app
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${OPERATOR_MANAGED_PROVIDER_CUSTODY_DIR:?Set the reviewed empty app-only provider custody directory}
        target: /provider-custody
        read_only: false
        bind: {create_host_path: false}

  decision-gate-rs:
    environment:
      CATCHPLATE_OPERATOR_MANAGED_GOOGLE_ENABLED: "1"
    volumes:
      - type: bind
        source: /srv/catchplate-fast/projects/catchplate-operator-artifacts/sha256-333ff7a3db00ab2bf03644fc965aed9b691bdd6ddc4ec651273e6d0c36f053e0/catchplate-decision-gate
        target: /usr/local/bin/catchplate-decision-gate
        read_only: true
        bind: {create_host_path: false}
