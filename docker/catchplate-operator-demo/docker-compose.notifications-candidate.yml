# Notification-capable immutable application; combine with the base and optional
# notifications layer only. This selection is not evidence of deployment.
services:
  catchplate:
    environment:
      CATCHPLATE_EXPECTED_DATA_PLANE_BINARY_DIGEST: sha256:e7529b4484228ebdbf2be1ebb471a80a78a3e127673f0bc6dcb4921db92489e2
    volumes:
      - type: bind
        source: /srv/catchplate-fast/projects/catchplate-operator-artifacts/source-b897d1aa51c70e23afaafc57e989e3f366939548
        target: /app
        read_only: true
        bind: {create_host_path: false}
  decision-gate-rs:
    volumes:
      - type: bind
        source: /srv/catchplate-fast/projects/catchplate-operator-artifacts/sha256-e7529b4484228ebdbf2be1ebb471a80a78a3e127673f0bc6dcb4921db92489e2/catchplate-decision-gate
        target: /usr/local/bin/catchplate-decision-gate
        read_only: true
        bind: {create_host_path: false}
