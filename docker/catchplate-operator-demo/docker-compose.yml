name: catchplate-operator-demo

# Local-key development deployment; external proxy DNS rollout remains separate.
# Existing synthetic sandbox and native pilot remain separate.
# Cached images supply dependencies only. /app and the Rust executable are
# read-only current-source overlays, not claims of a newly built image.
x-isolated: &isolated
  pull_policy: never
  restart: unless-stopped
  user: "10001:10001"
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  networks: [sandbox]
  # Docker's embedded resolver handles service names. Do not forward external
  # DNS to a host resolver from these demo-only services.
  dns: [127.0.0.1]
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=32m,uid=10001,gid=10001,mode=0700
  logging:
    driver: local
    options: {max-size: 2m, max-file: "2"}

services:
  catchplate:
    <<: *isolated
    networks:
      sandbox:
        ipv4_address: 172.16.249.19
    image: sha256:ec14a558a42e483a834860521e399b461a2df880fcba495e7127b0d8d2a51e01
    cpus: 2
    mem_limit: 1g
    working_dir: /app
    command: [python, -m, catchplate.operator_demo_runner]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: /app
      CATCHPLATE_OPERATOR_DEMO: "1"
      CATCHPLATE_OPERATOR_DEMO_UPSTREAMS: ${OPERATOR_DEMO_UPSTREAMS:?Set the reviewed HTTPS origin allowlist}
      CATCHPLATE_OPERATOR_DEMO_FIXTURE_CIDRS: '["172.16.249.18/32"]'
      CATCHPLATE_OPERATOR_DEMO_PROXY_URL: https://catchplate-proxy.example.com:443
      CATCHPLATE_DATA_DIR: /data
      CATCHPLATE_RELEASE_CHANNEL: dev
      CATCHPLATE_PUBLIC_URL: https://catchplate.example.com
      CATCHPLATE_DIRECT_CA_DOWNLOAD_ENABLED: "1"
      CATCHPLATE_ADMIN_USER: user:operator-demo-operator
      CATCHPLATE_DATA_PLANE_LEASE_RECIPIENT_ATTESTATION_REQUIRED: "0"
      CATCHPLATE_ADMIN_TOKEN_FILE: /run/secrets/catchplate/admin.token
      CATCHPLATE_DATA_PLANE_CREDENTIAL_LEASE_TOKEN_FILE: /run/secrets/catchplate/credential-lease.token
      CATCHPLATE_DATA_PLANE_AUDIT_TOKEN_FILE: /run/secrets/catchplate/audit.token
      CATCHPLATE_DATA_PLANE_GRANT_CONSUME_TOKEN_FILE: /run/secrets/catchplate/grant-consume.token
      CATCHPLATE_DATA_PLANE_RATE_LIMIT_CONSUME_TOKEN_FILE: /run/secrets/catchplate/rate-limit-consume.token
      CATCHPLATE_DATA_PLANE_RELEASE_AUTHORIZATION_TOKEN_FILE: /run/secrets/catchplate/release-authorization.token
      CATCHPLATE_DATA_PLANE_MANAGEMENT_TOKEN_FILE: /run/secrets/catchplate/management.token
      CATCHPLATE_DECISION_GATE_BASE: http://decision-gate-rs:9091
      CATCHPLATE_DATA_PLANE_INSTANCE_ID: spiffe://operator-demo.catchplate/decision-gate/local
      CATCHPLATE_EXPECTED_DATA_PLANE_BINARY_DIGEST: sha256:${OPERATOR_DEMO_RUST_BINARY_SHA256:?Set the reviewed current-source Rust binary hash}
    volumes:
      - type: bind
        source: ${OPERATOR_DEMO_SDK_SOURCE:?Set OPERATOR_DEMO_SDK_SOURCE}
        target: /app
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${OPERATOR_DEMO_DATA_ROOT:-/srv/catchplate-fast/homelab_data/catchplate-operator-demo}/app-data
        target: /data
        bind: {create_host_path: false}
      - type: bind
        source: ${OPERATOR_DEMO_DATA_ROOT:-/srv/catchplate-fast/homelab_data/catchplate-operator-demo}/service-secrets
        target: /run/secrets/catchplate
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${OPERATOR_DEMO_DATA_ROOT:-/srv/catchplate-fast/homelab_data/catchplate-operator-demo}/upstream-data/demo-upstream
        target: /demo-upstream
        read_only: true
        bind: {create_host_path: false}
    depends_on:
      demo-upstream: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import json,urllib.request; o=urllib.request.build_opener(urllib.request.ProxyHandler({})); r=o.open('http://127.0.0.1:3000/healthz',timeout=2); b=r.read(65537); raise SystemExit(0 if r.status==200 and len(b)<=65536 and json.loads(b).get('ok') is True else 1)"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 45s

  demo-upstream:
    <<: *isolated
    networks:
      sandbox:
        ipv4_address: 172.16.249.18
    image: sha256:13fba0146806ccc218afd91dbc2c9087f5d8abdb16fc8c7acbe3c3448e79937d
    cpus: 0.5
    mem_limit: 256m
    working_dir: /app
    command: [python, scripts/demo_upstream.py]
    environment: {PYTHONDONTWRITEBYTECODE: "1"}
    volumes:
      - type: bind
        source: ${OPERATOR_DEMO_SDK_SOURCE:?Set OPERATOR_DEMO_SDK_SOURCE}
        target: /app
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${OPERATOR_DEMO_DATA_ROOT:-/srv/catchplate-fast/homelab_data/catchplate-operator-demo}/upstream-data
        target: /data
        bind: {create_host_path: false}
    healthcheck:
      test: [CMD, python, -c, "import json,ssl,urllib.request; c=ssl.create_default_context(cafile='/data/demo-upstream/ca.pem'); o=urllib.request.build_opener(urllib.request.ProxyHandler({}),urllib.request.HTTPSHandler(context=c)); r=o.open('https://demo-upstream:8443/_test/request-count?method=GET&path=%2Fecho',timeout=2); b=r.read(65537); p=json.loads(b) if len(b)<=65536 else {}; raise SystemExit(0 if r.status==200 and type(p.get('count')) is int else 1)"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 15s

  decision-gate-rs:
    <<: *isolated
    dns: []
    networks:
      sandbox:
        ipv4_address: 172.16.249.20
      outbound:
        ipv4_address: 172.16.249.34
    # Cached glibc 2.41 runtime can load the host-built glibc 2.39 executable.
    # The old pilot Rust runtime (glibc 2.36) cannot and is not used here.
    image: python@sha256:78387bc3881b8273120a12ebe6c1ab22b018ccc2c9adf565ae1ac9b536e184ea
    entrypoint: [/usr/local/bin/catchplate-decision-gate]
    command: []
    cpus: 1
    mem_limit: 512m
    environment:
      CATCHPLATE_OPERATOR_DEMO: "1"
      CATCHPLATE_OPERATOR_DEMO_UPSTREAMS: ${OPERATOR_DEMO_UPSTREAMS:?Set the reviewed HTTPS origin allowlist}
      CATCHPLATE_OPERATOR_DEMO_FIXTURE_CIDRS: '["172.16.249.18/32"]'
      CATCHPLATE_OPERATOR_DEMO_PROXY_URL: https://catchplate-proxy.example.com:443
      CATCHPLATE_RELEASE_CHANNEL: dev
      CATCHPLATE_ALLOW_INSECURE_DEV_CREDENTIAL_LEASES: "1"
      CATCHPLATE_ATOMIC_RELEASE_AUTHORIZATION_ENABLED: "0"
      CATCHPLATE_POLICY_BUNDLE: /data/policy-bundle.json
      CATCHPLATE_POLICY_HIGH_WATER_FILE: /gate-data/policy-high-water.json
      CATCHPLATE_POLICY_TRUST_ROOT_ATTESTATION_URL: http://catchplate:3000/attestation
      CATCHPLATE_CONTROL_PLANE_CREDENTIAL_LEASE_URL: http://catchplate:3000/api/data-plane/credential-leases
      CATCHPLATE_DATA_PLANE_CREDENTIAL_LEASE_TOKEN_FILE: /run/secrets/catchplate/credential-lease.token
      CATCHPLATE_CONTROL_PLANE_AUDIT_URL: http://catchplate:3000/api/data-plane/audit
      CATCHPLATE_DATA_PLANE_AUDIT_TOKEN_FILE: /run/secrets/catchplate/audit.token
      # Keep retry identity at one event in the synthetic legacy audit path.
      # The database still rejects partial batches and immutable-ID conflicts.
      CATCHPLATE_DATA_PLANE_AUDIT_BATCH_MAX: "1"
      CATCHPLATE_DATA_PLANE_MANAGEMENT_TOKEN_FILE: /run/secrets/catchplate/management.token
      CATCHPLATE_DATA_PLANE_INSTANCE_ID: spiffe://operator-demo.catchplate/decision-gate/local
      CATCHPLATE_UPSTREAM_CA_BUNDLE: /demo-upstream/ca.pem
      CATCHPLATE_MITM_CA_CERT: /data/mitmproxy/mitmproxy-ca-cert.pem
      CATCHPLATE_MITM_CA_KEY: /data/mitmproxy/mitmproxy-ca.pem
      CATCHPLATE_PROXY_INGRESS_MODE: operator-demo-tls-edge
      CATCHPLATE_DECISION_GATE_HOST: 0.0.0.0
      CATCHPLATE_DECISION_GATE_PORT: "9090"
      CATCHPLATE_DECISION_GATE_MANAGEMENT_HOST: 172.16.249.20
      CATCHPLATE_DECISION_GATE_MANAGEMENT_PORT: "9091"
    volumes:
      - type: bind
        source: ${OPERATOR_DEMO_RUST_BINARY:?Set OPERATOR_DEMO_RUST_BINARY to the reviewed current-source executable}
        target: /usr/local/bin/catchplate-decision-gate
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${OPERATOR_DEMO_DATA_ROOT:-/srv/catchplate-fast/homelab_data/catchplate-operator-demo}/app-data
        target: /data
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${OPERATOR_DEMO_DATA_ROOT:-/srv/catchplate-fast/homelab_data/catchplate-operator-demo}/gate-data
        target: /gate-data
        bind: {create_host_path: false}
      - type: bind
        source: ${OPERATOR_DEMO_DATA_ROOT:-/srv/catchplate-fast/homelab_data/catchplate-operator-demo}/upstream-data/demo-upstream
        target: /demo-upstream
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${OPERATOR_DEMO_DATA_ROOT:-/srv/catchplate-fast/homelab_data/catchplate-operator-demo}/service-secrets/credential-lease.token
        target: /run/secrets/catchplate/credential-lease.token
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${OPERATOR_DEMO_DATA_ROOT:-/srv/catchplate-fast/homelab_data/catchplate-operator-demo}/service-secrets/audit.token
        target: /run/secrets/catchplate/audit.token
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${OPERATOR_DEMO_DATA_ROOT:-/srv/catchplate-fast/homelab_data/catchplate-operator-demo}/service-secrets/management.token
        target: /run/secrets/catchplate/management.token
        read_only: true
        bind: {create_host_path: false}
    depends_on:
      catchplate: {condition: service_healthy}
    healthcheck:
      test: [CMD, /bin/bash, -ec, "exec 3<>/dev/tcp/172.16.249.20/9091; printf 'GET /healthz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; read -r status <&3; [[ $$status == 'HTTP/1.1 200 '* ]]"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 30s

    labels:
      # The edge is the sole public console AND proxy ingress. Stopping it
      # fences both paths while this internal gate is replaced or inspected.
      - traefik.enable=false
      - com.centurylinklabs.watchtower.enable=false

  edge:
    image: nginx@sha256:1ed1b0e1d7652937d6cbdaf4018c7b6fc009a7dd6c3047351e2eddda745de43f
    pull_policy: never
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 0.25
    mem_limit: 64m
    pids_limit: 32
    environment:
      TRAEFIK_IPV4: ${TRAEFIK_IPV4:?Set the current exact Traefik overlay peer IPv4}
      NGINX_ENVSUBST_FILTER: ^TRAEFIK_IPV4$$
      NGINX_ENVSUBST_OUTPUT_DIR: /tmp
    command: [nginx, -c, /tmp/nginx.conf, -g, "daemon off;"]
    volumes:
      - type: bind
        source: ./config/nginx.conf.template
        target: /etc/nginx/templates/nginx.conf.template
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${OPERATOR_DEMO_DATA_ROOT:-/srv/catchplate-fast/homelab_data/catchplate-operator-demo}/edge-secrets
        target: /run/secrets/catchplate-edge
        read_only: true
        bind: {create_host_path: false}
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m,uid=1000,gid=1000,mode=0700
    networks:
      sandbox:
        ipv4_address: 172.16.249.21
      traefik-v3-public: {}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8081/edge-healthz]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: local
      options: {max-size: 1m, max-file: "2"}
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-v3-public
      - traefik.tcp.routers.catchplate-operator-proxy.rule=HostSNI(`catchplate-proxy.example.com`)
      - traefik.tcp.routers.catchplate-operator-proxy.entrypoints=websecure
      - traefik.tcp.routers.catchplate-operator-proxy.tls=true
      - traefik.tcp.routers.catchplate-operator-proxy.tls.options=mcp-http1@file
      - traefik.tcp.routers.catchplate-operator-proxy.service=catchplate-operator-proxy
      - traefik.tcp.services.catchplate-operator-proxy.loadbalancer.server.port=9090
      # Canonical UI and compatibility route use the existing authenticated edge.
      - traefik.http.routers.catchplate-public.rule=Host(`catchplate.example.com`)
      - traefik.http.routers.catchplate-public.entrypoints=websecure
      - traefik.http.routers.catchplate-public.tls=true
      - traefik.http.routers.catchplate-public.middlewares=authelia-public@file
      - traefik.http.routers.catchplate-public.service=catchplate-demo-edge
      - traefik.http.routers.catchplate-lab.rule=Host(`catchplate.lab.example.com`)
      - traefik.http.routers.catchplate-lab.entrypoints=websecure
      - traefik.http.routers.catchplate-lab.tls=true
      - traefik.http.routers.catchplate-lab.middlewares=localnetwork@file
      - traefik.http.routers.catchplate-lab.service=catchplate-demo-edge
      - traefik.http.routers.catchplate-demo-public.rule=Host(`catchplate-demo.example.com`)
      - traefik.http.routers.catchplate-demo-public.entrypoints=websecure
      - traefik.http.routers.catchplate-demo-public.tls=true
      - traefik.http.routers.catchplate-demo-public.middlewares=authelia-public@file
      - traefik.http.routers.catchplate-demo-public.service=catchplate-demo-edge
      - traefik.http.routers.catchplate-demo-lab.rule=Host(`catchplate-demo.lab.example.com`)
      - traefik.http.routers.catchplate-demo-lab.entrypoints=websecure
      - traefik.http.routers.catchplate-demo-lab.tls=true
      - traefik.http.routers.catchplate-demo-lab.middlewares=localnetwork@file
      - traefik.http.routers.catchplate-demo-lab.service=catchplate-demo-edge
      - traefik.http.services.catchplate-demo-edge.loadbalancer.server.port=8080
      - homepage.group=Apps & Data
      - homepage.name=Catchplate
      - homepage.href=https://catchplate.example.com/
      - homepage.description=Authenticated Catchplate; local keys, not hardware-backed authority
      - com.centurylinklabs.watchtower.enable=false

networks:
  sandbox:
    internal: true
    ipam:
      config:
        - subnet: 172.16.249.16/28
  outbound:
    ipam:
      config:
        - subnet: 172.16.249.32/29
  traefik-v3-public:
    external: true
