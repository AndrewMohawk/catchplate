        "ALL"
      ],
      "command": [
        "nginx",
        "-c",
        "/tmp/nginx.conf",
        "-g",
        "daemon off;"
      ],
      "cpus": 0.25,
      "entrypoint": null,
      "environment": {
        "NGINX_ENVSUBST_FILTER": "^TRAEFIK_IPV4$$",
        "NGINX_ENVSUBST_OUTPUT_DIR": "/tmp",
        "TRAEFIK_IPV4": "10.77.0.187"
      },
      "healthcheck": {
        "interval": "30s",
        "retries": 3,
        "start_period": "5s",
        "test": [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:8081/edge-healthz"
        ],
        "timeout": "3s"
      },
      "image": "nginx@sha256:1ed1b0e1d7652937d6cbdaf4018c7b6fc009a7dd6c3047351e2eddda745de43f",
