    "demo-upstream": {
      "cap_drop": [
        "ALL"
      ],
      "command": [
        "scripts/demo_upstream.py"
      ],
      "cpus": 0.5,
      "dns": [
        "127.0.0.1"
      ],
      "entrypoint": [
        "python",
        "-B"
      ],
      "environment": {
        "PYTHONDONTWRITEBYTECODE": "1"
      },
      "healthcheck": {
        "interval": "15s",
        "retries": 4,
        "start_period": "15s",
        "test": [
          "CMD",
          "python",
          "-c",
          "import json,ssl,urllib.request; c=ssl.create_default_context(cafile='/data/demo-upstream/ca.pem'); o=urllib.request.build_opener(urllib.request.ProxyHandler({}),urllib.request.HTTPSHandler(context=c)); r=o.open('https://demo-upstream:8443/_test/request-count?method=GET&path=%2Fecho',timeout=2); b=r.read(65537); p=json.loads(b) if len(b)<=65536 else {}; raise SystemExit(0 if r.status==200 and type(p.get('count')) is int else 1)"
        ],
        "timeout": "3s"
      },
      "image": "sha256:239031aa68d723419d2d53f8f44f61d1487437898036a077767fe3c22f2ff7a9",
      "init": true,
      "logging": {
        "driver": "local",
