          "target": "/data",
          "type": "bind"
        },
        {
          "bind": {
            "create_host_path": false
          },
          "read_only": true,
          "source": "/srv/catchplate-fast/homelab_data/catchplate-sandbox/upstream-data/demo-upstream",
          "target": "/demo-upstream",
          "type": "bind"
        },
        {
          "bind": {
            "create_host_path": false
          },
          "read_only": true,
          "source": "/srv/catchplate-fast/homelab_data/catchplate-sandbox/service-secrets/credential-lease.token",
          "target": "/run/secrets/catchplate/credential-lease.token",
          "type": "bind"
