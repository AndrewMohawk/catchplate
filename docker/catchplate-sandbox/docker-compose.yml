{
  "name": "catchplate-sandbox",
  "networks": {
    "sandbox": {
      "internal": true,
      "ipam": {
        "config": [
          {
            "subnet": "172.16.249.128/28"
          }
        ]
      },
      "name": "catchplate-sandbox_sandbox"
    },
    "traefik-v3-public": {
      "external": true,
      "ipam": {},
      "name": "traefik-v3-public"
    }
  },
  "services": {
    "catchplate": {
      "cap_drop": [
        "ALL"
      ],
      "command": [],
      "cpus": 2,
      "depends_on": {
        "demo-upstream": {
          "condition": "service_healthy",
          "required": true
        }
      },
      "dns": [
        "127.0.0.1"
      ],
      "entrypoint": [
        "python",
        "-B",
        "-m",
        "catchplate.development_sandbox_runner"
      ],
      "environment": {
        "CATCHPLATE_ADMIN_TOKEN_FILE": "/run/secrets/catchplate/admin.token",
        "CATCHPLATE_ADMIN_USER": "user:sandbox-operator",
        "CATCHPLATE_DATA_DIR": "/data",
        "CATCHPLATE_DATA_PLANE_AUDIT_TOKEN_FILE": "/run/secrets/catchplate/audit.token",
        "CATCHPLATE_DATA_PLANE_CREDENTIAL_LEASE_TOKEN_FILE": "/run/secrets/catchplate/credential-lease.token",
        "CATCHPLATE_DATA_PLANE_GRANT_CONSUME_TOKEN_FILE": "/run/secrets/catchplate/grant-consume.token",
        "CATCHPLATE_DATA_PLANE_INSTANCE_ID": "spiffe://development.catchplate/decision-gate/local",
        "CATCHPLATE_DATA_PLANE_LEASE_RECIPIENT_ATTESTATION_REQUIRED": "0",
        "CATCHPLATE_DATA_PLANE_MANAGEMENT_TOKEN_FILE": "/run/secrets/catchplate/management.token",
        "CATCHPLATE_DATA_PLANE_RATE_LIMIT_CONSUME_TOKEN_FILE": "/run/secrets/catchplate/rate-limit-consume.token",
        "CATCHPLATE_DATA_PLANE_RELEASE_AUTHORIZATION_TOKEN_FILE": "/run/secrets/catchplate/release-authorization.token",
        "CATCHPLATE_DECISION_GATE_BASE": "http://decision-gate-rs:9091",
        "CATCHPLATE_DEVELOPMENT_SANDBOX": "1",
        "CATCHPLATE_EXPECTED_DATA_PLANE_BINARY_DIGEST": "sha256:73ebd4426aee420902bf3d6086d17f67b0ce12df56a4f7e2f27e6e7d45315ec1",
        "CATCHPLATE_PUBLIC_URL": "https://catchplate-sandbox.example.com",
        "CATCHPLATE_RELEASE_CHANNEL": "dev",
        "PYTHONDONTWRITEBYTECODE": "1",
        "PYTHONPATH": "/app"
      },
      "healthcheck": {
        "interval": "15s",
        "retries": 4,
        "start_period": "45s",
        "test": [
          "CMD",
          "python",
          "-c",
          "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:3000/healthz',timeout=2); raise SystemExit(0 if r.status==200 else 1)"
        ],
        "timeout": "3s"
      },
      "image": "sha256:239031aa68d723419d2d53f8f44f61d1487437898036a077767fe3c22f2ff7a9",
      "init": true,
      "logging": {
        "driver": "local",
        "options": {
          "max-file": "2",
          "max-size": "2m"
        }
      },
      "mem_limit": "1073741824",
      "networks": {
        "sandbox": null
      },
      "pids_limit": 128,
      "pull_policy": "never",
      "read_only": true,
      "restart": "unless-stopped",
      "security_opt": [
        "no-new-privileges:true"
      ],
      "tmpfs": [
        "/tmp:rw,noexec,nosuid,nodev,size=32m,uid=10001,gid=10001,mode=0700"
      ],
      "user": "10001:10001",
      "volumes": [
        {
          "bind": {
            "create_host_path": false
          },
          "source": "/srv/catchplate-fast/homelab_data/catchplate-sandbox/app-data",
          "target": "/data",
          "type": "bind"
        },
        {
          "bind": {
            "create_host_path": false
          },
          "read_only": true,
          "source": "/srv/catchplate-fast/homelab_data/catchplate-sandbox/service-secrets",
          "target": "/run/secrets/catchplate",
          "type": "bind"
        },
        {
          "bind": {
            "create_host_path": false
          },
          "read_only": true,
          "source": "/srv/catchplate-fast/homelab_data/catchplate-sandbox/upstream-data/demo-upstream",
          "target": "/demo-upstream",
          "type": "bind"
        },
        {
          "bind": {
            "create_host_path": false
          },
          "read_only": true,
          "source": "/home/catchplate/catchplate/scripts/check_development_sandbox.py",
          "target": "/app/scripts/check_development_sandbox.py",
          "type": "bind"
        }
      ],
      "working_dir": "/app"
    },
    "decision-gate-rs": {
      "cap_drop": [
        "ALL"
      ],
      "command": [
        "gate"
      ],
      "cpus": 1,
      "depends_on": {
        "catchplate": {
          "condition": "service_healthy",
          "required": true
        }
      },
      "dns": [
        "127.0.0.1"
      ],
      "entrypoint": [
        "python",
        "-B",
        "-m",
        "scripts.operator_install.runtime"
      ],
      "environment": {
        "CATCHPLATE_ALLOW_INSECURE_DEV_CREDENTIAL_LEASES": "1",
        "CATCHPLATE_ATOMIC_RELEASE_AUTHORIZATION_ENABLED": "0",
        "CATCHPLATE_CONTROL_PLANE_AUDIT_URL": "http://catchplate:3000/api/data-plane/audit",
        "CATCHPLATE_CONTROL_PLANE_CREDENTIAL_LEASE_URL": "http://catchplate:3000/api/data-plane/credential-leases",
        "CATCHPLATE_DATA_PLANE_AUDIT_BATCH_MAX": "1",
        "CATCHPLATE_DATA_PLANE_AUDIT_TOKEN_FILE": "/run/secrets/catchplate/audit.token",
        "CATCHPLATE_DATA_PLANE_CREDENTIAL_LEASE_TOKEN_FILE": "/run/secrets/catchplate/credential-lease.token",
        "CATCHPLATE_DATA_PLANE_INSTANCE_ID": "spiffe://development.catchplate/decision-gate/local",
        "CATCHPLATE_DATA_PLANE_MANAGEMENT_TOKEN_FILE": "/run/secrets/catchplate/management.token",
        "CATCHPLATE_DECISION_GATE_HOST": "0.0.0.0",
        "CATCHPLATE_DECISION_GATE_MANAGEMENT_HOST": "0.0.0.0",
        "CATCHPLATE_DECISION_GATE_MANAGEMENT_PORT": "9091",
        "CATCHPLATE_DECISION_GATE_PORT": "9090",
        "CATCHPLATE_DEVELOPMENT_SANDBOX": "1",
        "CATCHPLATE_MITM_CA_CERT": "/data/mitmproxy/mitmproxy-ca-cert.pem",
        "CATCHPLATE_MITM_CA_KEY": "/data/mitmproxy/mitmproxy-ca.pem",
        "CATCHPLATE_POLICY_BUNDLE": "/data/policy-bundle.json",
        "CATCHPLATE_POLICY_TRUST_ROOT_ATTESTATION_URL": "http://catchplate:3000/attestation",
        "CATCHPLATE_RELEASE_CHANNEL": "dev",
        "CATCHPLATE_UPSTREAM_CA_BUNDLE": "/demo-upstream/ca.pem"
      },
      "healthcheck": {
        "interval": "15s",
        "retries": 4,
        "start_period": "30s",
        "test": [
          "CMD",
          "/bin/bash",
          "-ec",
          "exec 3<>/dev/tcp/127.0.0.1/9091; printf 'GET /healthz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; read -r status <&3; [[ $$status == 'HTTP/1.1 200 '* ]]"
        ],
        "timeout": "3s"
      },
      "image": "sha256:239031aa68d723419d2d53f8f44f61d1487437898036a077767fe3c22f2ff7a9",
      "init": true,
      "logging": {
        "driver": "local",
        "options": {
          "max-file": "2",
          "max-size": "2m"
        }
      },
      "mem_limit": "536870912",
      "networks": {
        "sandbox": null
      },
      "pids_limit": 128,
      "pull_policy": "never",
      "read_only": true,
      "restart": "unless-stopped",
