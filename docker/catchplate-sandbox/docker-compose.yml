        {
          "bind": {
            "create_host_path": false
          },
          "read_only": true,
          "source": "/srv/catchplate-fast/homelab_data/catchplate-sandbox/service-secrets/management.token",
          "target": "/run/secrets/catchplate/management.token",
          "type": "bind"
        }
      ]
