# Combine with docker-compose.yml and the retained deployment environment.
# This selects the accepted application snapshot and normal Rust executable;
# it does not change the fixture source, edge, network or persistent data.
# The source must be a separately frozen, readable artifact, not a worktree.
services:
  serverware:
    environment:
      SERVERWARE_EXPECTED_DATA_PLANE_BINARY_DIGEST: sha256:f430734734cb43fb60eb1e28a863b337c314bb3e5377b23b6671564c62a91d9b
    volumes:
      - type: bind
        source: ${OPERATOR_DEMO_APP_SOURCE:?Set the approved immutable accepted application snapshot}
        target: /app
        read_only: true
        bind: {create_host_path: false}

  decision-gate-rs:
    volumes:
      - type: bind
        source: /srv/catchplate-fast/projects/serverware-operator-artifacts/sha256-f430734734cb43fb60eb1e28a863b337c314bb3e5377b23b6671564c62a91d9b/serverware-decision-gate
        target: /usr/local/bin/serverware-decision-gate
        read_only: true
        bind: {create_host_path: false}
