# Artifact selection matching the deployed Google-OFF app/gate identities.
# Combine with docker-compose.yml and the retained environment, not another
# source override. docker-compose.destinations-candidate.yml selects this pair.
# Include the separate notifications layer with its explicit enablement settings
# to reproduce the notification-enabled deployment; this file only selects code.
# Fixture, edge, images, networks and persistent data remain unchanged.
services:
  serverware:
    environment:
      SERVERWARE_EXPECTED_DATA_PLANE_BINARY_DIGEST: sha256:2bfe5e384d7e9c655de70704c25350c16336c55a2584fc59f363f12164f297d6
    volumes:
      - type: bind
        source: /srv/catchplate-fast/projects/serverware-operator-artifacts/source-577badff84b32eea052c53d6df8f6fd5de61d66a
        target: /app
        read_only: true
        bind: {create_host_path: false}

  decision-gate-rs:
    volumes:
      - type: bind
        source: /srv/catchplate-fast/projects/serverware-operator-artifacts/sha256-2bfe5e384d7e9c655de70704c25350c16336c55a2584fc59f363f12164f297d6/serverware-decision-gate
        target: /usr/local/bin/serverware-decision-gate
        read_only: true
        bind: {create_host_path: false}
