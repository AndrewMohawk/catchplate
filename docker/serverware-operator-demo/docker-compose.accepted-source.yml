# Paired withheld-response/audit update on retained-compatible authority; Google unconfigured.
# Do not deploy unrelated authority-contract changes without a reviewed migration.
# AWS credentials are storage-only: no signing, grants or ECR publication.
# Required order: base + this SINGLE source layer + curated-gate + notifications + providers.
# This pair includes the genuinely rebuilt provider and response-media fixes; the historical
# npm-publish-candidate retains the previous Rust executable and is not equivalent.
# Never combine source overrides or add the legacy google layer. Preserve the
# original private environment and explicit notification interpolation settings.
# Provider custody must already exist, app-owned 0700 and distinct from other
# retained roots. Do not initialize a key or reset existing custody/state.
# On first migration, start/verify app publication before creating the gate;
# keep the edge closed until paired and retained-state checks pass. See README.
services:
  serverware:
    environment:
      SERVERWARE_EXPECTED_DATA_PLANE_BINARY_DIGEST: sha256:b824bdfe77d8f1a14ce629909da027a0f6725651b6441bc160032714a1219641
      SERVERWARE_OPERATOR_MANAGED_GOOGLE_ENABLED: "1"
      SERVERWARE_OPERATOR_PROVIDER_CUSTODY_DIR: /provider-custody
      SERVERWARE_PROCESS_MODE: serverware-control-plane
      SERVERWARE_METADATA_STORE_BACKEND: sqlite
      SERVERWARE_AUDIT_STORE_BACKEND: sqlite
      SERVERWARE_GRANT_STORE_BACKEND: sqlite
      SERVERWARE_RELEASE_CHANNEL: dev
      SERVERWARE_ATOMIC_RELEASE_AUTHORIZATION_ENABLED: "0"
      SERVERWARE_KEY_RELEASE_REQUIRED: "0"
      SERVERWARE_DEV_AUTHENTICATOR: "0"
      SERVERWARE_DEV_DEMO_SEED: "0"
    volumes:
      - type: bind
        source: /srv/catchplate-fast/projects/serverware-operator-artifacts/source-71d4227fe3ccc91cdad829d07ab016e64e5d5cc7
        target: /app
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${OPERATOR_MANAGED_PROVIDER_CUSTODY_DIR:?Set the reviewed empty app-only provider custody directory}
        target: /provider-custody
        read_only: false
        bind: {create_host_path: false}

  decision-gate-rs:
    environment:
      SERVERWARE_OPERATOR_MANAGED_GOOGLE_ENABLED: "1"
    volumes:
      - type: bind
        source: /srv/catchplate-fast/projects/serverware-operator-artifacts/sha256-b824bdfe77d8f1a14ce629909da027a0f6725651b6441bc160032714a1219641/serverware-decision-gate
        target: /usr/local/bin/serverware-decision-gate
        read_only: true
        bind: {create_host_path: false}
