# Artifact selection matching the deployed Google-OFF app/gate identities.
# Combine with docker-compose.yml and the retained environment, not another
# source override. docker-compose.notifications-candidate.yml selects this pair.
# Include the separate notifications layer with its explicit enablement settings
# to reproduce the notification-enabled deployment; this file only selects code.
# Fixture, edge, images, networks and persistent data remain unchanged.
services:
  serverware:
    environment:
      SERVERWARE_EXPECTED_DATA_PLANE_BINARY_DIGEST: sha256:e7529b4484228ebdbf2be1ebb471a80a78a3e127673f0bc6dcb4921db92489e2
    volumes:
      - type: bind
        source: /srv/catchplate-fast/projects/serverware-operator-artifacts/source-b897d1aa51c70e23afaafc57e989e3f366939548
        target: /app
        read_only: true
        bind: {create_host_path: false}

  decision-gate-rs:
    volumes:
      - type: bind
        source: /srv/catchplate-fast/projects/serverware-operator-artifacts/sha256-e7529b4484228ebdbf2be1ebb471a80a78a3e127673f0bc6dcb4921db92489e2/serverware-decision-gate
        target: /usr/local/bin/serverware-decision-gate
        read_only: true
        bind: {create_host_path: false}
