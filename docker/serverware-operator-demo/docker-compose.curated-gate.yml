# Dormant opt-in: combine with base and the reviewed current-source layer.
# Start the app first so its existing publication owner prepares gate-runtime.
# Inspect the resolved mount model: /data MUST resolve to gate-runtime only.
# Original lock/marker/CA files must already exist; this layer never provisions
# or rotates them. Preserve their inode identity while a gate is running.
services:
  serverware:
    environment:
      SERVERWARE_OPERATOR_GATE_PUBLICATION_ENABLED: "1"

  decision-gate-rs:
    # Compose merges volumes by container target, replacing the base /data bind
    # while retaining its binary, high-water, upstream CA and service-token binds.
    volumes:
      - type: bind
        source: ${OPERATOR_DEMO_DATA_ROOT:-/srv/catchplate-fast/homelab_data/serverware-operator-demo}/app-data/gate-runtime
        target: /data
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${OPERATOR_DEMO_DATA_ROOT:-/srv/catchplate-fast/homelab_data/serverware-operator-demo}/app-data/.operator-publication.lock
        target: /data/.operator-publication.lock
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${OPERATOR_DEMO_DATA_ROOT:-/srv/catchplate-fast/homelab_data/serverware-operator-demo}/app-data/.serverware-operator-demo.json
        target: /data/.serverware-operator-demo.json
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${OPERATOR_DEMO_DATA_ROOT:-/srv/catchplate-fast/homelab_data/serverware-operator-demo}/app-data/mitmproxy/mitmproxy-ca-cert.pem
        target: /data/mitmproxy/mitmproxy-ca-cert.pem
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${OPERATOR_DEMO_DATA_ROOT:-/srv/catchplate-fast/homelab_data/serverware-operator-demo}/app-data/mitmproxy/mitmproxy-ca.pem
        target: /data/mitmproxy/mitmproxy-ca.pem
        read_only: true
        bind: {create_host_path: false}
