# Optional operator-development notifications; the current demo enables this layer.
# Combine with base + exactly one reviewed notification-capable source override.
# Requires a separately prepared app-only custody directory and Compose !reset.
# Merely including this layer adds app egress, even while the feature flag is 0.
# No native observer, provider profile, gate, edge or fixture change is included.
services:
  serverware:
    # Remove only the app's external-DNS sink; use Docker's normal resolver.
    # Reuse the existing outbound network without changing either subnet.
    dns: !reset []
    networks:
      outbound:
        # The gate reserves .34, including while stopped during maintenance.
        ipv4_address: 172.16.249.35
    # The gate's management listener binds only its sandbox address. Docker's
    # shared-network DNS could otherwise select its outbound-only interface.
    extra_hosts:
      decision-gate-rs: 172.16.249.20
    environment:
      SERVERWARE_OPERATOR_NOTIFICATIONS_ENABLED: ${OPERATOR_DEMO_NOTIFICATIONS_ENABLED:-0}
      SERVERWARE_OPERATOR_NOTIFICATIONS_CUSTODY_DIR: /notification-custody
      SERVERWARE_OPERATOR_NOTIFICATIONS_PRIVATE_DESTINATIONS_JSON: '{"bindings":[]}'
      # PILOT_SOURCE_JSON deliberately absent: no native source is admitted.
    volumes:
      - type: bind
        source: ${OPERATOR_DEMO_NOTIFICATIONS_CUSTODY_DIR:?Set the reviewed app-only notification custody directory}
        target: /notification-custody
        bind: {create_host_path: false}
