# Retained managed-demo candidate: stock npm flow and two cold starts verified.
# Not the accepted live selection. Required order: base + this SINGLE source
# layer + curated-gate + notifications. Never combine source-selection layers.
# Preserve the original environment, custody, CA, tokens, policy and shared lock.
# Root must verify the exact source/compiler-input join and resolved model,
# retain a fresh stopped-consistent backup and verify app publication before
# gate startup. Keep the existing edge stopped until pair/state checks pass.
# This layer supplies no provider configuration, notification receiver or native
# action. The existing unconfigured managed-provider state must be retained.
services:
  serverware:
    environment:
      SERVERWARE_EXPECTED_DATA_PLANE_BINARY_DIGEST: sha256:82a99cf00a7763dd1187f86607ffe2415487e98734f4b7d585f44909150e7b85
      SERVERWARE_OPERATOR_MANAGED_GOOGLE_ENABLED: "1"
      SERVERWARE_OPERATOR_PROVIDER_CUSTODY_DIR: /provider-custody
      SERVERWARE_PROCESS_MODE: serverware-control-plane
      SERVERWARE_METADATA_STORE_BACKEND: sqlite
      SERVERWARE_AUDIT_STORE_BACKEND: sqlite
      SERVERWARE_GRANT_STORE_BACKEND: sqlite
      SERVERWARE_RELEASE_CHANNEL: dev
      SERVERWARE_ATOMIC_RELEASE_AUTHORIZATION_ENABLED: "0"
      SERVERWARE_KEY_RELEASE_REQUIRED: "0"
      SERVERWARE_DEV_AUTHENTICATOR: "0"
      SERVERWARE_DEV_DEMO_SEED: "0"
    volumes:
      - type: bind
        source: ${OPERATOR_MANAGED_SOURCE:?Set the reviewed immutable managed source directory}
        target: /app
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${OPERATOR_MANAGED_PROVIDER_CUSTODY_DIR:?Set the reviewed empty app-only provider custody directory}
        target: /provider-custody
        read_only: false
        bind: {create_host_path: false}

  decision-gate-rs:
    environment:
      SERVERWARE_OPERATOR_MANAGED_GOOGLE_ENABLED: "1"
    volumes:
      - type: bind
        source: /srv/catchplate-fast/projects/serverware-operator-artifacts/sha256-82a99cf00a7763dd1187f86607ffe2415487e98734f4b7d585f44909150e7b85/serverware-decision-gate
        target: /usr/local/bin/serverware-decision-gate
        read_only: true
        bind: {create_host_path: false}
