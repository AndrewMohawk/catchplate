<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="884" viewBox="0 0 1000 884" role="img" aria-labelledby="activation-title activation-description">
  <title id="activation-title">OIDC activation: 14 of 26 source leaves landed; 1 in progress and 11 other open. Execution authorization grant is next.</title>
  <desc id="activation-description">The 26 numbered segments map to the named checklist below: the first fourteen are landed, including the encrypted execution bundle at step 14. At step 15, genuine private replay and durable ciphertext-store source are landed, but the leaf remains in progress: independent cold custody, sender/export and generic execution/SQL integration are still open. Execution authorization grant at step 16 is next and still open, and steps 17 through 26 are open. Every item has a stable ID and a written status, so color is not required. The former sixteen-leaf inventory becomes twenty-six by splitting three open scopes into thirteen leaves; no completed work is lost and no parent checkpoint is added. Parent progress remains 34 of 46; production remains 0 of 6 verified. These source-only counts are not a percentage, effort estimate or ETA. Source is unbuilt, unexecuted and unprovisioned. A sampled local signed head is not off-host or atomic action-time authority.</desc>
