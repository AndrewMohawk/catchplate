<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="730" viewBox="0 0 1000 730" role="img" aria-labelledby="activation-title activation-description">
  <title id="activation-title">OIDC activation: 15 of 26 tracked source steps landed; two in progress, nine other open. Step 15 has six of eight source components landed; step 17 has durable reserve but no independent cold pending receiver.</title>
  <desc id="activation-description">The 26 numbered segments match the linked status ledger. Steps 01 through 14 and 16 are landed; 15 private replay/custody and 17 reservation/pending admission are in progress; 18 one-use protected SQL is next and open; 19 through 26 are open. Step 16's distinct post-plan authorization and dedicated cold grant authorizer landed in d8e6bba without renewing original plan expiry or establishing public consent. Step 17's signed computation, durable exact reserve/ACK and cold state-v5 service landed in 81b7f7b, but the independent cold pending receiver is missing; its standalone admission API does not close the step. Each segment title names its stable task. The current-step detail has eight equal source-component segments with written names and states: F08.4e.2.a bound originals and genuine replay landed; b first-exact ciphertext store landed; c sender bootstrap and private export landed; d dedicated receiving bootstrap landed; e process-bound receiving owner landed; f generic frames and original-window forwarding landed; g receiving cold key and FD delivery partial/open; h dedicated grant/reserve/SQL role wiring partial/open. Grant and reserve delivery/wiring are landed; SQL remains open. These eight diagnostic components are inside step 15, not eight extra steps; the denominator stays 26 and step 15 stays open. F08.4e.4 through F08.4e.7 remain unchecked, as do public and portal flows. Parent progress remains 34 of 46; production acceptance remains 0 of 6 verified. These counts describe source checkpoints, not effort, an ETA or product readiness. Source is unbuilt, unexecuted and unprovisioned.</desc>
