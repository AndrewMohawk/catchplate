<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="712" viewBox="0 0 1000 712" role="img" aria-labelledby="activation-title activation-description">
  <title id="activation-title">OIDC activation detail: 12 of 16 source leaves landed; 4 remain. Fresh latest-head admission is next and still open.</title>
  <desc id="activation-description">Each equal-width segment corresponds to one disjoint deepest leaf of the existing F08 checklist, in the numbered order shown below. Landed: 01 F08.1 retained finalization admission; 02 F08.2 original assertion and CAS derivation; 03 F08.3 existing-cookie and login hardening; 04 F08.4a original read proofs; 05 F08.4b encrypted originals; 06 F08.4c business effects; 07 F08.4d.1 mutation and capacity adapter; 08 F08.4d.2 signed-original mechanics; 09 F08.4d.3 indexed write evidence; 10 F08.4d.4 configured owner and private retention; 11 F08.4d.5a root-authenticated configuration and snapshot; 12 F08.4d.5b fixed private service and key delivery. Next, still open and not claimed active: 13 F08.4d.5c fresh latest-head admission. Other open leaves: 14 F08.4e custody and protected execution; 15 F08.5 target-bound public activation and recovery; 16 F08.6 integrated post-finalization portal flow. These are source checklist counts, not effort estimates or whole-project percentages, and do not change the 46 parent checkpoints. Source remains unbuilt, unexecuted and unprovisioned; no production gate is closed. A signed launch snapshot does not establish fresh latest-state authority or session activation.</desc>
