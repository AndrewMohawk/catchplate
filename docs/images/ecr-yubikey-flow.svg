<svg xmlns="http://www.w3.org/2000/svg" width="720" height="900" viewBox="0 0 720 900" role="img" aria-labelledby="title desc">
  <title id="title">An ECR image update requires a developer's YubiKey approval</title>
  <desc id="desc">A build pipeline requests an AWS TEE container image publication. An authorized developer approves that exact account, region, repository and image digest with a YubiKey using WebAuthn. Serverware checks the approval and uses its protected AWS credential to push to ECR, or blocks publication. Nitro enclave build, rollout and attestation remain separate. This integration is illustrative and not yet implemented.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
    <marker id="yes" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#047857"/></marker>
    <marker id="no" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker>
  </defs>
  <rect width="720" height="900" rx="20" fill="#f8fafc"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="360" y="48" fill="#0f172a" font-size="32" font-weight="700">An image update needs human approval</text>
    <rect x="34" y="82" width="310" height="156" rx="16" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
    <text x="189" y="129" fill="#0f172a" font-size="31" font-weight="700">Build pipeline</text>
    <text x="189" y="171" fill="#334155" font-size="26">Requests publication</text>
    <text x="189" y="208" fill="#334155" font-size="26">of a TEE image</text>
    <rect x="376" y="82" width="310" height="156" rx="16" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
    <text x="531" y="129" fill="#0f172a" font-size="31" font-weight="700">Developer</text>
    <text x="531" y="171" fill="#334155" font-size="26">Approves this update</text>
    <text x="531" y="208" fill="#312e81" font-size="28" font-weight="700">with a YubiKey</text>
    <path d="M189 242V318" fill="none" stroke="#475569" stroke-width="3"/>
    <path d="M181 316L189 331L197 316Z" fill="#475569"/>
    <path d="M531 242V318" fill="none" stroke="#475569" stroke-width="3"/>
    <path d="M523 316L531 331L539 316Z" fill="#475569"/>
    <rect x="72" y="255" width="234" height="34" rx="8" fill="#f8fafc"/>
    <rect x="414" y="255" width="234" height="34" rx="8" fill="#f8fafc"/>
    <text x="189" y="280" fill="#334155" font-size="23">Image + identity</text>
    <text x="531" y="280" fill="#334155" font-size="23">WebAuthn approval</text>
    <rect x="62" y="337" width="596" height="225" rx="18" fill="#eef2ff" stroke="#4338ca" stroke-width="3"/>
    <text x="360" y="383" fill="#312e81" font-size="34" font-weight="700">Serverware checks both</text>
    <text x="360" y="428" fill="#1e1b4b" font-size="28" font-weight="700">Fresh approval for this exact image</text>
    <text x="360" y="466" fill="#312e81" font-size="25">Account · region · repository · image digest</text>
    <rect x="93" y="490" width="534" height="49" rx="10" fill="#fff"/>
    <text x="360" y="523" fill="#312e81" font-size="24" font-weight="700">AWS/ECR credentials stay inside Serverware</text>
    <path d="M250 566V612H190V650" fill="none" stroke="#047857" stroke-width="3"/>
    <path d="M182 648L190 663L198 648Z" fill="#047857"/>
    <path d="M470 566V612H530V650" fill="none" stroke="#b91c1c" stroke-width="3"/>
    <path d="M522 648L530 663L538 648Z" fill="#b91c1c"/>
    <rect x="63" y="584" width="128" height="35" rx="8" fill="#f8fafc"/>
    <text x="127" y="610" fill="#047857" font-size="24" font-weight="700">Approved</text>
    <rect x="526" y="584" width="134" height="35" rx="8" fill="#f8fafc"/>
    <text x="593" y="610" fill="#b91c1c" font-size="24" font-weight="700">Otherwise</text>
    <rect x="38" y="669" width="304" height="128" rx="16" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
    <text x="190" y="714" fill="#065f46" font-size="31" font-weight="700">Amazon ECR</text>
    <text x="190" y="755" fill="#065f46" font-size="25">Publish the exact image</text>
    <rect x="378" y="669" width="304" height="128" rx="16" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
    <text x="530" y="714" fill="#991b1b" font-size="31" font-weight="700">Blocked</text>
    <text x="530" y="755" fill="#991b1b" font-size="25">No image is published</text>
    <text x="360" y="846" fill="#475569" font-size="23">Nitro build, deployment and attestation are separate.</text>
    <text x="360" y="882" fill="#64748b" font-size="21">Intended integration—not a deployed capability.</text>
  </g>
</svg>
