<svg xmlns="http://www.w3.org/2000/svg" width="720" height="790" viewBox="0 0 720 790" role="img" aria-labelledby="title desc">
  <title id="title">npm publishing only during approved hours</title>
  <desc id="desc">An application sends a package publish request to Serverware. Serverware allows only @acme/widgets between 09:00 and 17:00 UTC, then uses its protected npm token to publish. Otherwise the request is blocked without contacting npm. The application never receives the npm token. Illustrative production flow.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
    <marker id="yes" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#047857"/></marker>
    <marker id="no" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker>
  </defs>
  <rect width="720" height="790" rx="20" fill="#f8fafc"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="360" y="48" fill="#0f172a" font-size="32" font-weight="700">Publish only during approved hours</text>
    <rect x="90" y="82" width="540" height="120" rx="16" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
    <text x="360" y="128" fill="#0f172a" font-size="32" font-weight="700">Application / CI</text>
    <text x="360" y="170" fill="#334155" font-size="27">npm publish · @acme/widgets</text>
    <path d="M360 206V270" fill="none" stroke="#475569" stroke-width="3"/>
    <path d="M352 268L360 282L368 268Z" fill="#475569"/>
    <rect x="373" y="222" width="238" height="34" rx="8" fill="#f8fafc"/>
    <text x="490" y="247" fill="#334155" font-size="23">Workload identity</text>
    <rect x="62" y="288" width="596" height="218" rx="18" fill="#eef2ff" stroke="#4338ca" stroke-width="3"/>
    <text x="360" y="335" fill="#312e81" font-size="34" font-weight="700">Serverware checks policy</text>
    <text x="360" y="380" fill="#1e1b4b" font-size="30" font-weight="700">09:00–17:00 UTC daily</text>
    <text x="360" y="418" fill="#312e81" font-size="25">Only this package is permitted</text>
    <rect x="93" y="441" width="534" height="44" rx="10" fill="#fff"/>
    <text x="360" y="471" fill="#312e81" font-size="24" font-weight="700">The npm token stays inside Serverware</text>
    <path d="M250 510V550H190V587" fill="none" stroke="#047857" stroke-width="3"/>
    <path d="M182 585L190 600L198 585Z" fill="#047857"/>
    <path d="M470 510V550H530V587" fill="none" stroke="#b91c1c" stroke-width="3"/>
    <path d="M522 585L530 600L538 585Z" fill="#b91c1c"/>
    <rect x="62" y="521" width="132" height="35" rx="8" fill="#f8fafc"/>
    <text x="128" y="547" fill="#047857" font-size="24" font-weight="700">Allowed</text>
    <rect x="526" y="521" width="134" height="35" rx="8" fill="#f8fafc"/>
    <text x="593" y="547" fill="#b91c1c" font-size="24" font-weight="700">Otherwise</text>
    <rect x="38" y="606" width="304" height="128" rx="16" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
    <text x="190" y="650" fill="#065f46" font-size="31" font-weight="700">npm registry</text>
    <text x="190" y="691" fill="#065f46" font-size="25">Publish the new version</text>
    <rect x="378" y="606" width="304" height="128" rx="16" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
    <text x="530" y="650" fill="#991b1b" font-size="31" font-weight="700">Blocked</text>
    <text x="530" y="691" fill="#991b1b" font-size="25">No request reaches npm</text>
    <text x="360" y="768" fill="#475569" font-size="22">The application receives a result—not the npm token.</text>
  </g>
</svg>
