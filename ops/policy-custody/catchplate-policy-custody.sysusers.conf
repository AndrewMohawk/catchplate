# A native measured driver or the decision-gate container receives this group
# only as an explicit supplemental socket capability. SO_PEERCRED authentication
# separately pins the driver's effective uid and primary gid.
g swpc-driver - -
u swpc-store - "Catchplate policy custody durable store" /nonexistent /usr/sbin/nologin
u swpc-consume - "Catchplate policy custody cleanup consumer" /nonexistent /usr/sbin/nologin
u swpc-target - "Catchplate policy custody recovery target provider" /nonexistent /usr/sbin/nologin
u swpc-signature - "Catchplate policy custody signature authority" /nonexistent /usr/sbin/nologin
u swpc-cleanup - "Catchplate policy custody bounded cleanup helper" /nonexistent /usr/sbin/nologin
