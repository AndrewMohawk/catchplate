# A native measured driver or the decision-gate container receives this group
# only as an explicit supplemental socket capability. SO_PEERCRED authentication
# separately pins the driver's effective uid and primary gid.
g swpc-driver - -
u swpc-store - "Serverware policy custody durable store" /nonexistent /usr/sbin/nologin
u swpc-consume - "Serverware policy custody cleanup consumer" /nonexistent /usr/sbin/nologin
u swpc-target - "Serverware policy custody recovery target provider" /nonexistent /usr/sbin/nologin
u swpc-signature - "Serverware policy custody signature authority" /nonexistent /usr/sbin/nologin
u swpc-cleanup - "Serverware policy custody bounded cleanup helper" /nonexistent /usr/sbin/nologin
