# Opt-in only for the independently admitted staging-enabled issuer launch.
# The v1 issuer template remains usable without any staging socket dependency.
[Unit]
Requires=catchplate-oidc-session-activation-consume-bootstrap.socket
After=catchplate-oidc-session-activation-consume-bootstrap.socket

[Service]
BindReadOnlyPaths=/run/catchplate/oidc-session-activation/consume-bootstrap.sock:/run/catchplate/oidc-session-activation/consume-bootstrap.sock
