# Opt-in only for the independently admitted staging-enabled issuer launch.
# The v1 issuer template remains usable without any staging socket dependency.
[Unit]
Requires=serverware-oidc-session-activation-consume-bootstrap.socket
After=serverware-oidc-session-activation-consume-bootstrap.socket

[Service]
BindReadOnlyPaths=/run/serverware/oidc-session-activation/consume-bootstrap.sock:/run/serverware/oidc-session-activation/consume-bootstrap.sock
