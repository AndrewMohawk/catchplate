[build-system]
requires = []
build-backend = "catchplate_agent_trust.build_backend"
backend-path = ["."]

[project]
name = "catchplate-enrollment"
version = "0.2.0"
description = "Clean-room Catchplate enrollment and attestation verification commands"
requires-python = ">=3.11"
dependencies = ["cryptography==50.0.0"]

[project.scripts]
catchplate-enrollment = "catchplate_agent_trust.enrollment:console_main"
catchplate-attestation = "catchplate_agent_trust.attestation:console_main"

[tool.catchplate-agent-trust]
runtime-lock = "catchplate_agent_trust/requirements.lock"
runtime-dependencies = ["cryptography==50.0.0"]
